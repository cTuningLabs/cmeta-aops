# The keys of the config artifact "task" that the task engine reads (cx task run ...). The task init reads the config
# and offers it to every task as global.init.<key>; --use.init.<key>=<value> changes one key for one run.
#
# An entry of "use" is what --use.<storage key>.<param> would say on every command line of this machine:
#   cx config set task --meta.use.python.tool_path=/opt/venv/bin/python

configs:
  task:
    keys:
      use:
        desc: 'this machine''s own defaults of --use, read once by the outermost task of a command line and merged under
          the command line''s --use (an instance of a stack template gets them from its template)'
        type: dict
      tool.check_versions:
        desc: 'true: a reused cache entry of a tool that asks for it (skip_cache_version_check: false) has its version
          checked against the tool itself. --check_versions checks the tool a command line names unless its entry
          says skip_cache_version_check: true; the nested tools are not checked by default (a check costs seconds per
          reuse)'
        type: yes/no
        default: 'false'
      reuse_conflict:
        desc: 'what the task engine does when a storage key that is already chosen in a run is asked again with another
          version (in one run a storage key is one choice: the first result is used, whatever the request asks). warn -
          the run says it and keeps it in its context (ctx.tasks.reuse_conflicts); all - any other parameter asked
          differently is said too; error - the run stops (an exploration: a variant must not run another version than
          the one it names); ignore - nothing. --use.init.reuse_conflict=<word> for one run, CMETA_REUSE_CONFLICT for
          a process'
        default: warn
        example: error
      cache_repos.<key>:
        desc: 'the repository that keeps the cache entries, and their files, of the data tasks whose cache_repo_key is
          <key>: portable, shared with the instances and the other hosts (such a task ignores file_cache);
          --use.init.cache_repos.<key>=<repo> for one run'
        example: my-data
      cache_repos.data:
        desc: 'the repository of the data tasks (get-hf-model, get-hf-dataset: cache_repo_key data) - their entries and
          files stay together there; get-host--docker mounts it into the instances it makes'
        example: my-data
      file_cache:
        desc: 'the file cache: where large downloads and clones are kept outside the cache entries (clone-git-to-cache,
          get-hf-model, get-hf-dataset) - one folder, or several separated by ; on Windows (: elsewhere), the first one
          first. A place that is there is used (its last folder is made when it is missing); a place that is away - a
          USB drive that is not connected - is passed over for the next one and the run says so; what is asked for is
          taken from the place that has it already; when no place of the list is there the run stops and says what to
          do. --use.init.file_cache=<folders> for one run'
        type: path
        example: X:\cmeta-file-cache;D:\cmeta-file-cache

# What the commands of the task category mean, for people: the cMeta CLI builder (cserver.cmeta.cli) and help read it,
# the engine never does. The words of "cx task run <task>" are described by each task, in the cli_help of its _desc.yaml
# (beside cli_params, which alone says how the engine reads a word).

cli_help:
  category:
    title: Tasks
    one: task
    desc: Run a ready automation - download a model, start a server, run an AI agent ...
    order: [run]
    hide: [use]

  run:
    title: Run
    desc: Run a task
    artifact: task
