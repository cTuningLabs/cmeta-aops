authors: Grigori Fursin
inherits:
  - template-c-cpu,649899ef3f004e4a

# The CUDA test program (test-nmm-nvcc-cuda) in HIP: the same sources through hipify-perl (cuda* -> hip*),
# compiled with hipcc on the rocm target. hipcc compiles for the GPU it finds and links the HIP runtime
# itself, so no lib-* for the runtime is needed (unlike lib-cuda for nvcc).
#
#   cx program run test-nmm-hipcc-rocm --compute=rocm
#   cx program run test-nmm-hipcc-rocm --compute=rocm --dim_m=1500 --dim_n=1500 --dim_k=1500

local_vars:
  src_file_names:
    - 'program.hip'
    - 'matmul.hip'

  output_files:
    - tmp-cmeta-program-stats.json
    - tmp-ck-timer.json

  result_files:
    stats: tmp-cmeta-program-stats.json
    stats-xopenme: tmp-ck-timer.json

params:
  compute: rocm
  compile:
    openmp: True
    d:
      XOPENME:

updates:
  compile:
    uses:
      - match:
          task: compiler,f3925b201c704bde
        update:
          lang: hip

      - match:
          task: setup-compile,10f1dfd3f6f04c35
        update:
          lang: hip

      - match:
          internal_func: customize2
        append:
          - task: setup,a2f9b61079ce4333
            name: lib-openssl,903191f1fab74064

          - task: setup,a2f9b61079ce4333
            name: lib-xopenme,c7b96678a7734510

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           cmd_main: >-
             {{params.precision|float32}}
             {{params.dim_m|10000}}
             {{params.dim_n|10000}}
             {{params.dim_k|10000}}
             {{params.repeat|3}}
             {{params.clean|1}}
             {{params.seed|12345}}
