inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: swiftc

  src_file_names: 
    - 'program.swift'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

updates:
  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           cmd_main: >-
             {{params.precision|float32}} 
             {{params.dim_m|1500}} 
             {{params.dim_n|1500}} 
             {{params.dim_k|1500}}
             {{params.repeat|3}}
             {{params.clean|1}}
             {{params.seed|12345}}


