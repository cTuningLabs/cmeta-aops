inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: c

  src_file_names: 
    - 'gemm.c'

  output_files:
    - tmp-ck-timer.json
    - tmp-ck-output-dump.txt

  result_files:
    stats-xopenme: tmp-ck-timer.json

params:
  compile:
    openmp: True
    d:
      DATA_TYPE: double
      NI: '{{params.NI|512}}'
      NJ: '{{params.NJ|512}}'
      NK: '{{params.NK|512}}'
      POLYBENCH_DUMP_ARRAYS: YES
      POLYBENCH_PADDING_FACTOR: 0
      XOPENME:

#params_os:
#  windows:
#    compile:
#      d:
#        WINDOWS:

updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          ######################################################################################
          # Prepare Libs for Host CPU
          - task: setup,a2f9b61079ce4333
            name: lib-polybench,70349e61a532455d
            with:
              static: '{{params.compile.static|$None}}'

          - task: setup,a2f9b61079ce4333
            name: lib-xopenme,c7b96678a7734510
            with:
              static: '{{params.compile.static|$None}}'

          # Only for Clang: its OpenMP runtime (static for a static build on Linux and macOS; on Windows
          # the DLL, whose folder goes on the run-time path)
          - task: setup,a2f9b61079ce4333
            if: '{{global.target.compute|$[]}} == ["cpu"] and "{{global.llvm.path|None}}" != "None" '
            name: lib-openmp,7958b973fc0d42a9
            with:
              static: '{{params.compile.static|$None}}'

          ######################################################################################
          # Prepare Libs for Android CPU
          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-sysroot-android,cdc22b7617f54f2c
            with:
              static: '{{local.params.compile.static|$None}}'
              lib_names:
                - dl
                - m
                - z
              dynamic_libs: 
                - c++_shared

          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-openmp-android,4631aca5f3d241b4

          ######################################################################################
          # The CUDA runtime: its library folder goes on the run-time library path (a CUDA from
          # the cMeta cache is not on the system's, e.g. CUDA 12 for an older GPU)
          - task: setup,a2f9b61079ce4333
            if: '"cuda" in {{global.target.compute|$[]}}'
            name: lib-cuda,ac9daedec465409e


  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           cmd_main: '{{params.NI|512}}'

