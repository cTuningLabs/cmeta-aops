inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: javac

  src_file_names: 
    - 'Program.java'
    - 'Matmul.java'

  target_file_name: 'Program'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

params:
  compile:
    target_ext: '.class'
    flags: '-d .'

# --jdk=temurin|microsoft|corretto|zulu|oracle (and --jdk_feature=<major>) compiles and runs with
# that vendor's JDK (tool/jdk-<vendor>); without it, tool/openjdk (the installed JDK or Temurin)
updates:
  compile:
    uses:
      - match:
          task: compiler,f3925b201c704bde
        update:
          cache: '{{local.compiler_cache|$None}}'
          tool_with:
            vendor: '{{params.jdk|$None}}'
            feature: '{{params.jdk_feature|$None}}'

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         prepend:
           - task: setup,a2f9b61079ce4333
             name: java,6c8d509f22c841e8
             with:
               vendor: '{{params.jdk|$None}}'
               feature: '{{params.jdk_feature|$None}}'
         update:
           target_exe: None
           cmd: >-
             {{global.java.qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}} 
             -cp . Program
           cmd_main: >-
             {{params.precision|float32}} 
             {{params.dim_m|1500}} 
             {{params.dim_n|1500}} 
             {{params.dim_k|1500}}
             {{params.repeat|3}}
             {{params.clean|1}}
             {{params.seed|12345}}

