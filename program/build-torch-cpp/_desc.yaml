###################################################################################################
inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: cpp

  target_file_name: 'libtorch'

  output_files:
    - output.txt

  result_files:
    output: output.txt

  print_files:
    - output.txt

params:
  compile:
    d:
      # Disable optional components to speed up the build; re-enable as needed
      USE_DISTRIBUTED: 'OFF'
      USE_QNNPACK: 'OFF'
      USE_NNPACK: 'OFF'
      USE_FBGEMM: 'OFF'
      # third_party/benchmark uses -pedantic-errors, which Clang 22 turns into a
      # hard error for __COUNTER__ in #if expressions (-Wc2y-extensions).
      BUILD_TEST: 'OFF'

###################################################################################################
updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          ######################################################################################
          # Python is required both for the build system and the resulting Python bindings
          - task: setup,a2f9b61079ce4333
            name: python,c00fb574d8ca4463

          # Extra C compiler required by PyTorch's CMake
          - task: compiler,f3925b201c704bde
            lang: c
            compute: '{{global.target.compute}}'
            use:
              llvm:
                version: '{{params.use.llvm.version|$None}}'

          - task: setup,a2f9b61079ce4333
            name: cmake,e26c11ebb3dd40ca

          - task: setup,a2f9b61079ce4333
            name: ninja,a3df3c45e9b04830

          ######################################################################################
          # Build-time pip requirements
          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: pyyaml

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: typing_extensions

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: sympy

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: filelock

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: networkx

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: numpy

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: setuptools

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: packaging

 #         - task: setup,a2f9b61079ce4333
 #           name: pip,c4987bc3955347f2
 #           with:
 #             package: mkl-devel
 #           if_os: windows,linux
 #           if: >-
 #             "cpu" in {{global.target.compute|$[]}}
 #             or
 #             "xpu" in {{global.target.compute|$[]}}

          ######################################################################################
          # OpenMP via Clang on Linux / macOS
          - task: setup,a2f9b61079ce4333
            if_os: linux,darwin
            if: '{{global.target.compute|$[]}} == ["cpu"] and "{{global.llvm.path|$None}}" != "None"'
            name: lib-openmp,7958b973fc0d42a9

          ######################################################################################
          # CUDA libs
          - task: setup,a2f9b61079ce4333
            if: '"cuda" in {{global.target.compute|$[]}}'
            name: lib-cuda,ac9daedec465409e
            with:
               lib_names:
                 - $cublas
                 - $cudart
                 - $cudnn

          ######################################################################################
          # Clone PyTorch source
          - task: clone-git-to-cache,86919b3cfdd443d2
            name: src-pytorch
            url: 'https://github.com/pytorch/pytorch'
            checkout: '{{params.checkout|$None}}'

          # PyTorch depends heavily on submodules (e.g. pybind11, sleef, XNNPACK)
          - task: cmd,c9ba0a88df394d7f
            storage_key: init-pytorch-submodules
            chdir: '{{global.clone-git-to-cache-src-pytorch.path_to_git_repo}}'
            cmds:
              - '{{global.git.qpath}} submodule update --init --recursive'

          ######################################################################################
          # Compute cmake -D flags and set local paths
          - internal_func: customize_pytorch
            internal_func_from_local_key: selected-program
            internal_func_safe: True
            _update: '{{ params.customize_torch_cpp|${} }}'
#            compile: '{{params.compile|$None}}'

          ######################################################################################
          # Configure, build, and install
          - task: cmd,c9ba0a88df394d7f
            storage_key: compile-program
            save_script: '{{local.target_path}}//tmp-cmeta-compile-program{{global.host.vars.file_ext_bat}}'
            chdir: '{{local.target_path}}'
            cmds:
              - '{{global.cmake.qpath}} "{{global.clone-git-to-cache-src-pytorch.path_to_git_repo}}" -G Ninja {{local.cmake_d_vars}}'
              - '{{global.cmake.qpath}} --build . --config {{local.build_type}}'
              - '{{global.cmake.qpath}} --install . --config {{local.build_type}}'


  run:
    uses:
      - match:
          internal_func: customize_run
        prepend:
          # Tools needed to compile the test binary against installed libtorch
          - task: setup,a2f9b61079ce4333
            name: cmake,e26c11ebb3dd40ca
          - task: setup,a2f9b61079ce4333
            name: ninja,a3df3c45e9b04830
          - task: compiler,f3925b201c704bde
            lang: c
            compute: '{{global.target.compute}}'
        append:
          # Compute cmake flags, source path, and test binary location
          - internal_func: customize_test
            internal_func_from_local_key: selected-program
            internal_func_safe: True
          # cmake configure + build of the test binary against the installed libtorch
          - task: cmd,c9ba0a88df394d7f
            storage_key: test-build
            chdir: '{{local.test_build_path}}'
            cmds:
              - '{{global.cmake.qpath}} {{local.test_cmake_src_path}} -G Ninja {{local.test_cmake_d_vars}}'
              - '{{global.cmake.qpath}} --build . --config Release'

      - match:
          task: setup-run,148f6c1fdb4247df
        update:
          target_exe: '{{local.target_path_exe}}'
          cmd: >-
             {{local.target_path_exe}}
             {run_flags_after_exe}
             {{params.run_flags|}}

#          cmd_main: ''
