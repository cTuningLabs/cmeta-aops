params:
  compute: cuda

use:
  nvcc:
    with:
      arch_flags: True

updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          # Prepare Libs for CUDA
          - task: setup,a2f9b61079ce4333
 #           if: '"{{params.compile.static|False}}" != "True"'
            name: lib-cuda,ac9daedec465409e
            with:
               lib_names:
                 - $cublas
                 - $cudart

          - task: setup,a2f9b61079ce4333
            name: lib-cudnn,440a30eb25b64853

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           cmd_main: >-
             {{local.unparsed|}}
