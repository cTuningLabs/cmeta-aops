        - 'echo "SELECTED PROGRAM PATH: {{local.selected-program.path}}"'

    - task: cmd,c9ba0a88df394d7f
      if_os: windows
      cmds: 
        - 'echo PYTHON PATH: {{global.python.qpath}}'
        - 'echo PYTHON VERSION:'
        - '{{global.python.qpath}} --version'
        - 'echo SELECTED PROGRAM PATH: {{local.selected-program.path}}'

    - task: cmd,c9ba0a88df394d7f
      cmd: '{{global.python.qpath}} {{local.selected-program.path}}/src/program.py {{params.run.flags|}} {{local.unparsed|}}'
