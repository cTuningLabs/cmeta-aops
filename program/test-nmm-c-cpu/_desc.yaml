inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  src_file_names: 
    - 'program.c'
    - 'matmul.c'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

params:
  compile:
    openmp: True
    d:
      XOPENME:

updates:
  compile:
    uses:
      - match:
          task: compiler,f3925b201c704bde
        update:
          lang: c

      - match:
          internal_func: customize2
        append:
          ######################################################################################
          # Prepare Libs for Host CPU
          - task: setup,a2f9b61079ce4333
            if: '{{global.target.compute|$[]}} == ["cpu"] and not ("{{global.host.os.uname}}" in ("linux", "darwin") and "{{params.compile.static|False}}" == "True")'
            name: lib-openssl,903191f1fab74064

          # A static link on Linux or macOS: lib-openssl links the static archives and only what they
          # need (zlib, zstd, jitterentropy), building those the system has no static library of
          - task: setup,a2f9b61079ce4333
            if: '{{global.target.compute|$[]}} == ["cpu"] and "{{global.host.os.uname}}" in ("linux", "darwin") and "{{params.compile.static|False}}" == "True"'
            name: lib-openssl,903191f1fab74064
            with:
              static: True

          # The static or the dynamic xopenme, as the build asks (the two have separate cache entries)
          - task: setup,a2f9b61079ce4333
            name: lib-xopenme,c7b96678a7734510
            with:
              static: '{{params.compile.static|$None}}'

          # Only for Clang: its OpenMP runtime (static for a static build on Linux and macOS; on Windows
          # the DLL, whose folder goes on the run-time path)
          - task: setup,a2f9b61079ce4333
            if: '{{global.target.compute|$[]}} == ["cpu"] and "{{global.llvm.path|None}}" != "None" '
            name: lib-openmp,7958b973fc0d42a9
            with:
              static: '{{params.compile.static|$None}}'


          ######################################################################################
          # Prepare Libs for Android CPU
          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-sysroot-android,cdc22b7617f54f2c
            with:
              static: '{{local.params.compile.static|$None}}'
              lib_names:
                - dl
                - m
                - z
              dynamic_libs: 
                - c++_shared

          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-openmp-android,4631aca5f3d241b4

          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-openssl-android,c6cd8622939a4f66


  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           cmd_main: >-
             {{params.precision|float32}} 
             {{params.dim_m|1500}} 
             {{params.dim_n|1500}} 
             {{params.dim_k|1500}}
             {{params.repeat|3}}
             {{params.clean|1}}
             {{params.seed|12345}}


