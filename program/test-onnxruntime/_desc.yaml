###################################################################################################
#   cx program run test-onnxruntime --compute=cpu                     # CPUExecutionProvider
#   cx program run test-onnxruntime --compute=cuda                    # CUDAExecutionProvider
#   cx program run test-onnxruntime --compute=npu-intel               # OpenVINO EP on the NPU
#   cx program run test-onnxruntime --compute=xpu                     # OpenVINO EP on the Intel GPU
#   cx program run test-onnxruntime --compute=cpu,cuda --size=4096 --batch=256 --seconds=30
#
# Each target's execution provider is named alone, with the session's CPU fallback disabled
# (session.disable_cpu_ep_fallback), so a provider that cannot run the model fails instead of
# running on the CPU. The ONNX Runtime package fits the targets (tool/pip-onnxruntime), in a
# venv of its own per set of targets.
###################################################################################################
inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  run_time_env:
    CMETA_TARGETS: '{{global.target.cmeta_targets}}'
    CMETA_ORT_SIZE: '{{local.params.size|1024}}'
    CMETA_ORT_BATCH: '{{local.params.batch|1}}'
    CMETA_ORT_ITERATIONS: '{{local.params.iterations|200}}'
    CMETA_ORT_SECONDS: '{{local.params.seconds|}}'
    CMETA_ORT_PROVIDERS: '{{local.params.providers|}}'
    PYTHONUNBUFFERED: 1

  run_src_file_names:
    - 'program.py'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

updates:
  compile:
    skip: True

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df

         prepend:
           # onnxruntime-openvino has wheels for Python 3.11-3.13, the others for 3.11-3.14
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463
             if: '"npu-intel" in {{global.target.compute|$[]}} or "xpu" in {{global.target.compute|$[]}} or "openvino" in {{global.target.compute|$[]}}'
             version: '{{params.python_version|>=3.11,<3.14}}'
             with:
               venv_path: '{{local.target_path}}/venv-{{global.target.cmeta_targets_tag}}'
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463
             if: 'not ("npu-intel" in {{global.target.compute|$[]}} or "xpu" in {{global.target.compute|$[]}} or "openvino" in {{global.target.compute|$[]}})'
             version: '{{params.python_version|>=3.11,<3.15}}'
             with:
               venv_path: '{{local.target_path}}/venv-{{global.target.cmeta_targets_tag}}'

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: numpy

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: onnx

           # The build for the targets: onnxruntime-gpu, onnxruntime-openvino, ... (tool/pip-onnxruntime)
           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: onnxruntime
             version: '{{params.onnxruntime_version|$None}}'

         update:
           target_exe:
           run_src_file_names: '{{local.run_src_file_names}}'
           cmd: >-
             {{global.python.qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}}
             {run_src_file_names_str_with_path}
