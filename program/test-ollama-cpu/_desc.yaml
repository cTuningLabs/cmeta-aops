compile:
  uses:
     - task: compiler,f3925b201c704bde
       lang: c

     - task: cmd,c9ba0a88df394d7f
       storage_key: compile-program
       chdir: '{{local.selected-program.path_tmp}}'
       cmd: >-
         {{global.compiler.qpath}} 
         {{params.flags|}}
         {{global.compiler.features.flags.catch_errors|}}
         {{local.selected-program.path}}/src/program.c
         {{global.compiler.features.flags.exe_file}}{{local.selected-program.path_tmp}}/test{{global.host.vars.file_ext_exe}}
         
run: 
  uses:
     - task: cmd,c9ba0a88df394d7f
       storage_key: run-program
       chdir: '{{local.selected-program.path_tmp}}'
       cmd: '{{global.host.vars.start_exe_prefix}}test{{global.host.vars.file_ext_exe}}'
