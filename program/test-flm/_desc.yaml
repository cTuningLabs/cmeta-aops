authors: Grigori Fursin

###################################################################################################
# One generation with FastFlowLM on the AMD NPU, on a private server (its own port, started and stopped
# by the program), with FastFlowLM's own timings as the result:
#
#   cx program run test-flm --compute=npu-amd
#   cx program run test-flm --compute=npu-amd --model=llama3.2:1b --n=128 --port=52702 --pmode=performance
#
# The model (FastFlowLM's own tags: "cx tool run flm -- list") is downloaded on first use into the flm
# tool's cache entry (--models_dir elsewhere). pmode: powersaver | balanced | performance | turbo.
###################################################################################################
inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  run_src_file_names:
    - 'program.py'

  run_time_env:
    CMETA_TARGETS: '{{global.target.cmeta_targets}}'
    CMETA_FLM: '{{global.flm.path}}'
    CMETA_FLM_MODEL: '{{local.params.model|qwen3:0.6b}}'
    CMETA_FLM_MAX_TOKENS: '{{local.params.n|128}}'
    CMETA_FLM_PORT: '{{local.params.port|52701}}'
    CMETA_FLM_PMODE: '{{local.params.pmode|performance}}'
    CMETA_FLM_MODELS: '{{local.params.models_dir|}}'
    CMETA_FLM_CACHE: '{{global.flm.path_cmeta_cache|}}'
    PYTHONUNBUFFERED: 1

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

params:
  compute: npu-amd

###################################################################################################
updates:
  compile:
    skip: True

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         prepend:
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463
           - task: setup,a2f9b61079ce4333
             name: flm,0d711a7bc3454056
             _update: '{{ params.setup_flm|${} }}'

         update:
           target_exe:
           run_src_file_names: '{{local.run_src_file_names}}'
           cmd: >-
             {{global.python.qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}}
             {run_src_file_names_str_with_path}

###################################################################################################
# What the program's own words mean, for people: the cMeta CLI builder (cserver.cmeta.cli) and help read this block,
# the engine never does. The page finds the words read above ({{local.params.model|qwen3:0.6b}} ...) with their
# usual values and shows them as parameters of the run; group: more keeps a rare one with the other options.
cli_help:
  model:
    title: Which model
    desc: 'The model, by FastFlowLM''s own name ("cx tool run flm -- list" shows them); it is downloaded on first use'
  n:
    title: How many tokens
    type: int
    min: 1
    desc: The number of tokens to generate
  pmode:
    title: Power mode
    values: [powersaver, balanced, performance, turbo]
    desc: The power mode of the NPU
  port:
    title: Port
    type: int
    desc: The port of the private FastFlowLM server this run starts and stops
    group: more
  models_dir:
    title: Folder of the models
    desc: The folder the models are kept in (the flm tool's own cache when you give none)
    group: more
