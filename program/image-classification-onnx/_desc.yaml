inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  run_src_file_names:
    - 'program.py'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

  library: onnx

#params:
#  compute: cuda

updates:
  compile:
    skip: True

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df

         prepend:
           # One venv per set of targets: the ONNX Runtime packages for CPU, CUDA and OpenVINO
           # all install the "onnxruntime" module (tool/pip-onnxruntime picks the one that fits);
           # onnxruntime-openvino has wheels for Python 3.11-3.13
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463
             if: '"npu-intel" in {{global.target.compute|$[]}} or "xpu" in {{global.target.compute|$[]}} or "openvino" in {{global.target.compute|$[]}}'
             version: '{{params.python_version|>=3.11,<3.14}}'
             with:
               venv_path: '{{local.target_path}}/venv-{{global.target.cmeta_targets_tag}}'
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463
             if: 'not ("npu-intel" in {{global.target.compute|$[]}} or "xpu" in {{global.target.compute|$[]}} or "openvino" in {{global.target.compute|$[]}})'
             version: '{{params.python_version|>=3.11,<3.15}}'
             with:
               venv_path: '{{local.target_path}}/venv-{{global.target.cmeta_targets_tag}}'

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: numpy

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: pillow

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: onnxruntime

           - task: model,86f0effd07ad454d
             model_tags: '{{local.library}},image-classification,imagenet-1k'

           - task: download-file,03fed13e2e0447cf
             storage_key: download-file--dataset-classes
             chdir: '{{local.target_path}}'
             url: "https://raw.githubusercontent.com/pytorch/hub/master/imagenet_classes.txt"

           - task: dataset,30e20c7489f14f84
             storage_key: dataset-file
             dataset_tags: image,jpg


         update:
           target_exe:
           profile_python: '{{params.profile_python|$None}}'
           run_src_file_names: '{{local.run_src_file_names}}'
           cmd: >-
             {{global.python.qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}}
             {run_src_file_names_str_with_path}
             {{local.dataset-file.qpath}}
             {{local.model.qpath_root}}
             {{local.download-file--dataset-classes.qpath_to_file}}
             -v
