inherits:
  - template-cpu-c,649899ef3f004e4a

local_vars:
  src_file_names: 
    - 'Program.java'
    - 'Matmul.java'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

updates:
  compile:
    uses_pre:
      - match:
          task: compiler,f3925b201c704bde
        update:
          lang: javac

    uses_prep:
      - match:
          task: setup-compile,10f1dfd3f6f04c35
        update:
          lang: javac

  run:
    uses_pre:
       - prepend:
         - task: setup,a2f9b61079ce4333
           name: java,6c8d509f22c841e8

    uses_prep:
       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           target_exe: None
           cmd: >-
             {{global.java.qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}} 
             -cp . Program
           cmd_main: >-
             {{params.precision|float32}} 
             {{params.dim_m|1500}} 
             {{params.dim_n|1500}} 
             {{params.dim_k|1500}}
             {{params.repeat|3}}
             {{params.clean|1}}
             {{params.seed|12345}}
