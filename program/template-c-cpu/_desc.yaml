###################################################################################################
local_vars:
  lang: c

  src_file_names: 
    - 'program.c'

  src_dir: src

  target_file_name: 'program'

  run_time_env:
    CMETA_TARGETS: '{{global.target.cmeta_targets}}'

###################################################################################################
all:
  uses:
#    - task: print-text,23e0ac84f583466f
#      text: '{{local.params.compute|cpu}}'

    - internal_func: customize
      internal_func_from_local_key: selected-program
      internal_func_safe: True

    - task: target,94decb2ddd28441f
      ask: '{{params.ask|$False}}'
      compute: '{{local.params.compute|cpu}}'

    - internal_func: customize1
      internal_func_from_local_key: selected-program
      internal_func_safe: True

compile:
  uses:
    - task: target-sdk,bb795b1444564935

    - task: compiler,f3925b201c704bde
      lang: '{{local.lang}}'
      compute: '{{global.target.compute}}'
#      copy_to_storage_key: compiler

    - internal_func: customize2
      internal_func_from_local_key: selected-program
      internal_func_safe: True

    - task: setup-compile,10f1dfd3f6f04c35
      if: 'not {{local.skip_template_compile|$False}}'
      lang: '{{local.lang}}'
      compute: '{{global.target.compute}}'
      profile: '{{params.profile|$None}}'
      profile_cuda: '{{params.profile_cuda|$None}}'
      profile_cuda_kernels: '{{params.profile_cuda_kernels|$None}}'
      target_file_name: '{{local.target_file_name}}'
      target_path: '{{local.target_path|$None}}'
      clean_files: '{{local.output_files|$None}}'
      src_path: '{{local.src_path}}'
      src_file_names: '{{local.src_file_names}}'
      include_paths:
        - '{{local.selected-program.path}}{{os_sep}}src'
      with: '{{local.params.compile|$None}}'

    - task: setup-dynamic-libs,e61c92b6d28148a9
#      should run always because even during static build we may link other dynamic libs
#      if: '"{{local.params.compile.static|$False}}" != "True"'
      dynamic_lib_paths: '{{local.params.dynamic_lib_paths|$None}}'

    - task: cmd,c9ba0a88df394d7f
      if: 'not {{local.skip_template_compile|$False}}'
      storage_key: compile-program
      save_script: '{{local.target_path}}//tmp-cmeta-compile-program{{global.host.vars.file_ext_bat}}'
      chdir: '{{local.target_path}}'
      env: '{{local.setup-compile.compile_env}}'
      cmds: '{{local.compile_cmds}}'

      # --compile_timeout=<seconds> stops each compile command with its subprocesses
      timeout: '{{params.compile_timeout|$None}}'
         


###################################################################################################
run: 
  uses:
    - internal_func: customize_run
      internal_func_from_local_key: selected-program
      internal_func_safe: True

    # CPU, android, profile
    - task: setup,a2f9b61079ce4333
      name: simpleperf-android,50a747d76c024428
      if: '"android-cpu" in {{global.target.compute|$[]}} and "{{params.profile|False}}" == "True"'

    # CPU, linux, profile
    - task: setup,a2f9b61079ce4333
      name: perf,70caec51baf449aa
      if_os: linux
      if: '{{global.target.compute|$[]}} == ["cpu"] and "{{params.profile|False}}" == "True"'

    # CPU, windows, microsoft profile
    - task: setup,a2f9b61079ce4333
      name: microsoft.windows.adk,45d476330b034ca1
      if_os: windows
      if: '{{global.target.compute|$[]}} == ["cpu"] and "{{params.profile|False}}" == "True"'

    # CUDA, nsys profile
    - task: setup,a2f9b61079ce4333
      name: nsys,08982359a2c14316
      if: '"cuda" in {{global.target.compute|$[]}} and "{{params.profile_cuda|False}}" == "True"'

    # CUDA kernels, ncu profile
    - task: setup,a2f9b61079ce4333
      name: ncu,01f8f885a9224281
      if: '"cuda" in {{global.target.compute|$[]}} and "{{params.profile_cuda_kernels|False}}" == "True"'

    - task: setup-dynamic-libs,e61c92b6d28148a9
      if: '"{{local.params.compile.static|$False}}" != "True"'
      dynamic_lib_paths: '{{local.params.dynamic_lib_paths|$None}}'

    - task: setup-run,148f6c1fdb4247df
      skip_clean_local: True
      target_path: '{{local.target_path|$None}}'
      target_path_bin: '{{local.target_path_bin|$None}}'
      target_exe: '{{local.target_exe|$None}}'
      profile: '{{params.profile|$None}}'
      profile_cuda: '{{params.profile_cuda|$None}}'
      profile_cuda_kernels: '{{params.profile_cuda_kernels|$None}}'
      input_files: '{{local.input_files|$None}}'
      output_files: '{{local.output_files|$None}}'
#      cmd: '{{local.target_exe}} {{params.run.flags|}} {{local.unparsed|}}'
      cmd: >-
        {target_xpath_exe}
        {run_flags_after_exe}

    - task: cmd,c9ba0a88df394d7f
      storage_key: run-program
      save_script: '{{local.target_path}}//tmp-cmeta-run-program{{global.host.vars.file_ext_bat}}'
      chdir: '{{local.work_path}}'
      print_line_in_verbose: True
      env: '{{local.run_time_env|$None}}'
      cmds: '{{local.run_time_cmds}}'

      # --timeout=<seconds> stops each run command with its subprocesses
      timeout: '{{params.timeout|$None}}'

    - task: finish-run,5e14d7eca4f64440
      chdir: '{{local.work_path}}'
      target_path: '{{local.target_path|$None}}'
      result_files: '{{local.result_files|$None}}'
      print_files: '{{local.print_files|$None}}'
      print_line: True

###################################################################################################
# What the words of the command line mean, for people: the cMeta CLI builder (cserver.cmeta.cli) and help read this
# block, the engine never does. The words every program takes are described by the task compile-and-run-program. A
# program's own - every {{params.<name>|<usual value>}} of its description - are found by the page with their usual
# values (a word read under "compile" changes what is built, one read under "run" what is run) and described by the
# program in a block like this one. Here: the words this template reads, the words many of its programs read
# (if_read: shown for a program that reads the word itself) and the words of a family of its programs (programs:
# the names they have).
cli_help:
  timeout:
    title: Time limit of the run
    type: int
    min: 1
    desc: Stop each command of the run, with everything it started, after this many seconds
    example: '600'
  compile_timeout:
    title: Time limit of the build
    type: int
    min: 1
    desc: Stop each command of the build, with everything it started, after this many seconds
    example: '600'

  run_flags:
    title: More for its command line
    desc: More words for the program's own command line, as you would type them
    choice: run
    group: more
    if_read: true
  python_version:
    title: Which Python
    desc: 'The Python it runs with: a version (3.12) or a range (">=3.11,<3.14")'
    example: '3.12'
    choice: run
    group: more
    if_read: true
  profile_python:
    title: Python profiler
    type: bool
    desc: Run it under Python's profiler (cProfile); the profile is kept in tmp-cmeta-python-profile.out
    choice: false                 # how it runs, not what: a control
    if_read: true

  # The matrix multiplication written in every language (test-nmm-*): (M x N) * (N x K)
  precision:
    title: Type of the numbers
    values: [float32, float64, int64, int32, int16, int8]
    desc: The type of the elements of the matrices
    choice: run
    programs: ['test-nmm-*']
    if_read: true
  dim_m:
    title: Size M
    type: int
    min: 1
    desc: 'The rows of the first matrix: the program multiplies (M x N) by (N x K)'
    choice: run
    programs: ['test-nmm-*']
    if_read: true
  dim_n:
    title: Size N
    type: int
    min: 1
    desc: The columns of the first matrix and the rows of the second
    choice: run
    programs: ['test-nmm-*']
    if_read: true
  dim_k:
    title: Size K
    type: int
    min: 1
    desc: The columns of the second matrix
    choice: run
    programs: ['test-nmm-*']
    if_read: true
  repeat:
    title: Repetitions
    type: int
    min: 1
    desc: How many times the multiplication runs
    choice: run
    programs: ['test-nmm-*']
    if_read: true
  clean:
    title: Fresh inputs
    values: ['1', '0']
    desc: '1 fills the matrices with new random values before each repetition, 0 keeps them'
    choice: run
    programs: ['test-nmm-*']
    if_read: true
  seed:
    title: Seed
    type: int
    desc: The seed of the random values of the matrices
    choice: run
    programs: ['test-nmm-*']
    if_read: true
