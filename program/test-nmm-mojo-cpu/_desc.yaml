inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  src_file_names: 
    - 'program.mojo'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json


updates:
  compile:
    skip: True

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df

         prepend:
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463

           - task: setup,a2f9b61079ce4333
             name: mojo,666e926f670a4dbc

           # Two generations of the language in one program: src/ is the syntax before Mojo 1.0
           # ("fn", len() of a String), src-v2/ the one since ("def" only, "var" for every new name,
           # String.byte_length()). The Mojo that was set up decides (--use.mojo.version=<v> picks one).
           - task: select-src-by-tool-version,0ad29e6691b94cd2
             tool: mojo
             program_path: '{{local.selected-program.path}}'
             src_file_names: '{{local.src_file_names}}'
             rules:
               - version: '>=1.0.0'
                 src_dir: src-v2

         update:
           target_exe: 
           cmd: >-
             {{global.mojo.qpath}}
             {run_flags_after_exe}
             run
             {{params.run_flags|}} 
             {{local.src_file_names_str_with_path}}
           cmd_main: >-
             {{params.precision|float32}} 
             {{params.dim_m|200}} 
             {{params.dim_n|200}} 
             {{params.dim_k|200}}
             {{params.repeat|3}}
             {{params.clean|1}}
             {{params.seed|12345}}

