inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: c

  src_file_names: 
    - 'susan.codelet__10.c'
    - 'susan.codelet__10.wrapper.c'

  input_files:
    data: '{{local.selected-program.path}}//data//codelet.data'

  output_files:
    - tmp-ck-timer.json

  result_files:
    stats-xopenme: tmp-ck-timer.json

  run_time_env:
    CT_REPEAT_MAIN: '{{params.repeat|10000}}'

#params_os:
#  windows:
#    compile:
#      d:
#        WINDOWS:

updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          ######################################################################################
          # Prepare Libs for Host CPU
          - task: setup,a2f9b61079ce4333
            name: lib-milepost,e54621e3059d4590

          - task: setup,a2f9b61079ce4333
            name: lib-xopenme,c7b96678a7734510

          ######################################################################################
          # Prepare Libs for Android CPU
          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-sysroot-android,cdc22b7617f54f2c
            with:
              static: '{{local.params.compile.static|$None}}'
              lib_names:
                - dl
                - m
                - z
              dynamic_libs: 
                - c++_shared

          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-openmp-android,4631aca5f3d241b4


  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           cmd_main: '{qinput_files.data}'
