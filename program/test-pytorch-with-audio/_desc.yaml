inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  run_src_file_names: 
    - 'program.py'

  output_files:
    - tmp-cmeta-program-stats.json

  result_files:
    stats: tmp-cmeta-program-stats.json

#params:
#  compute: cuda

updates:
  compile:
    skip: True

  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df

         prepend:
           # torchaudio's last release (2.11) has wheels for Python 3.10-3.14 only: with a shared Python 3.15 there was
           # no torchaudio at all ("from versions: none", ROCm 7.2 on an MI300X, 2026-11-26)
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463
             version: '{{params.python_version|>=3.10,<3.15}}'

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: numpy

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: torch

           - task: setup,a2f9b61079ce4333
             name: pip
             with:
               package: torchaudio

         update:
           target_exe:
           profile_python: '{{params.profile_python|$None}}'
           run_src_file_names: '{{local.run_src_file_names}}'
           cmd: >-
             {{global.python.qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}} 
             {run_src_file_names_str_with_path}
 
