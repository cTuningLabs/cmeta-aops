###################################################################################################
inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: cpp

  target_file_name: 'libtorch'

  run_src_file_names:
    - 'program.py'

  output_files:
    - output.txt

  result_files:
    output: output.txt

  print_files:
    - output.txt

params:
  compile:
    d:
      # Disable optional components to speed up the build; re-enable as needed
      USE_DISTRIBUTED: 'OFF'
#      USE_QNNPACK: 'OFF'
#      USE_NNPACK: 'OFF'
#      USE_FBGEMM: 'OFF'

###################################################################################################
# The host compilers this build does not configure with, by system and tool - each with what happens and since when,
# so that a limit is lifted when the compiler is fixed. The machine's newest compiler stays the default of every
# other request: this build alone takes the newest one outside its limits (api_v1.py: customize), says so, and
# stops with the reason when the machine has no other. A compiler the request names itself (--use.msvc.version=)
# is taken as asked. Seen with cl.exe 19.51.36260; the whole 19.51 line is excluded on that evidence, until one of
# its builds is seen to work (README.tech.md, "The host compiler on Windows").
compiler_limits:
  windows:
    msvc:
      - exclude: '>=19.51,<19.52'
        reason: 'its cl.exe ends with an internal compiler error (C1001) on a probe of SLEEF
          (COMPILER_SUPPORTS_BUILTIN_MATH: __builtin_sqrt), which CMake counts as a failed configuration'
        since: '2026-11-24'

###################################################################################################
# What a target asks of its vendor's toolkit, by the version of PyTorch that is built (README.tech.md, "The toolkit of
# a target"). For Intel GPUs (xpu), Intel names one release of oneAPI (its package Deep Learning Essentials) per
# PyTorch release, on its pages "PyTorch Prerequisites for Intel GPUs". When the request names no release
# (--use.oneapi.version=<version>), the build asks the oneapi tool for the named line: the tool finds it on the
# machine or installs it (--use.oneapi.with.accept_eula=yes: Intel's licence is the user's to accept). A PyTorch
# version no line here names asks nothing.
#
# works_with is what was seen, where that is more than Intel's one release: PyTorch 2.15 does not compile with
# oneAPI 2025.3 (c10/xpu/XPUCachingAllocator.cpp uses SYCL's ipc_memory, which that compiler does not have - seen
# with 2025.3.3 on 2026-11-24), and PyTorch's own CI builds it with 2026.0 and 2026.1.
toolkits:
  xpu:
    oneapi:
      - program_version: '>=2.15,<2.16'
        version: '2026.1'
        works_with: '>=2026.0'
        reason: 'its XPU allocator uses the SYCL extension ipc_memory, which the compiler of oneAPI 2025.3 does not have
          (c10/xpu/XPUCachingAllocator.cpp does not compile)'
        source: 'https://www.intel.com/content/www/us/en/developer/articles/tool/pytorch-prerequisites-for-intel-gpu/2-15.html'
      - program_version: '>=2.14,<2.15'
        version: '2026.1'
        source: 'https://www.intel.com/content/www/us/en/developer/articles/tool/pytorch-prerequisites-for-intel-gpu/2-14.html'
      - program_version: '>=2.13,<2.14'
        version: '2026.0'
        source: 'https://www.intel.com/content/www/us/en/developer/articles/tool/pytorch-prerequisites-for-intel-gpu/2-13.html'
      - program_version: '>=2.12,<2.13'
        version: '2025.3'
        reason: 'Intel: the 2026 releases of oneAPI are not compatible with PyTorch 2.12'
        source: 'https://www.intel.com/content/www/us/en/developer/articles/tool/pytorch-prerequisites-for-intel-gpu/2-12.html'

###################################################################################################
# The driver a target needs on a system, by the version of PyTorch that is built - a fact of the vendor's page and a
# warning: when the driver the target read on this machine is older, the build says so and goes on (the driver
# matters when the result runs, and updating it is the user's).
drivers:
  xpu:
    windows:
      - program_version: '>=2.15,<2.16'
        min: '32.0.101.9033'
        source: 'https://www.intel.com/content/www/us/en/developer/articles/tool/pytorch-prerequisites-for-intel-gpu/2-15.html'

###################################################################################################
# The optional parts of this build, and named sets of them (README.tech.md, "The parts of the build"):
#
#   cx program run build-pytorch --compute=cpu --compile.variation=lean
#   cx program run build-pytorch --compute=cuda --compile.variation=minimal --compile.components.kineto
#   cx program run build-pytorch --compile.components.distributed                 # one part on;  <name>-  off
#
# Without a variation and without a part asked, the build is what it was before the parts were declared. With one,
# the parts decide the build variables (flags: [when on, when off]) and what is cloned: the submodules shallow, and
# the submodules of a part that is off without their own (PyTorch's cmake/PreBuildSteps.cmake wants the folder of
# every submodule of .gitmodules; what is under it is read only where the part is built).
#
# The evidence for each part is PyTorch's own build (v2.14 / v2.15): the option in CMakeLists.txt and the place
# that reads the part's submodule.
components:
  distributed:
    desc: torch.distributed (c10d) with Gloo
    flags: {USE_DISTRIBUTED: ['ON', 'OFF']}          # option(USE_DISTRIBUTED "Use distributed" ON)
    default: 'off'                                   # as this program always built it

  tensorpipe:
    desc: TensorPipe, the RPC transport of torch.distributed - PyTorch builds it on Linux and macOS only
    flags: {USE_TENSORPIPE: ['ON', 'OFF']}
    submodules: [third_party/tensorpipe]             # cmake/Dependencies.cmake: if(USE_DISTRIBUTED AND USE_TENSORPIPE) ... if(MSVC) -> off
    os: [linux, darwin]
    requires: [distributed]
    default: 'on'

  kineto:
    desc: Kineto, the library behind torch.profiler (CUPTI traces of CUDA)
    flags: {USE_KINETO: ['ON', 'OFF']}               # option(USE_KINETO "Use Kineto profiling library" ON)
    # caffe2/CMakeLists.txt: if(USE_KINETO) ... third_party/kineto/libkineto/src. A submodule up to 2.14; 2.15 carries
    # it in its own tree - a submodule the source does not have is said by the run, and nothing is left out for it
    submodules: [third_party/kineto]
    default: {windows: 'off', '*': auto}             # Windows: off, as this program builds it there (build problems met)

  rocm-kernels:
    desc: AMD's Composable Kernel and AITER for attention and GEMM on ROCm
    flags: {USE_ROCM_CK_SDPA: ['ON', 'OFF'], USE_ROCM_CK_GEMM: ['ON', 'OFF']}      # cmake_dependent_option(... "USE_ROCM;NOT WIN32" OFF)
    # aten/src/ATen/CMakeLists.txt: if(USE_ROCM) ... third_party/aiter, third_party/composable_kernel; the submodules
    # under third_party/flash-attention are the same two again (its CUDA sources are its own folder csrc/)
    submodules: [third_party/flash-attention, third_party/aiter]
    os: [linux]
    targets: [rocm]
    default: 'on'

  mslk:
    desc: MSLK, quantized GEMM kernels for the newest GPUs (PyTorch turns it on by the GPU architecture)
    flags: {USE_MSLK: ['ON', 'OFF']}                 # cmake_dependent_option(USE_MSLK ... "(USE_CUDA AND NOT MSVC) OR USE_ROCM" OFF)
    submodules: [third_party/mslk]                   # aten/src/ATen/CMakeLists.txt: if(USE_MSLK)
    os: [linux]
    targets: [cuda, rocm]
    default: auto

  mkldnn:
    desc: oneDNN (MKL-DNN) kernels for CPUs, and for Intel GPUs
    flags: {USE_MKLDNN: ['ON', 'OFF']}               # cmake_dependent_option(USE_MKLDNN ... "CPU_INTEL OR CPU_AARCH64 ...")
    submodules: [third_party/ideep]                  # cmake/Modules/FindMKLDNN.cmake (only with USE_MKLDNN)
    default: {windows: 'off', '*': auto}             # Windows: off, as this program builds it there
    # The targets that cannot be built without it - on for them whatever the default or the variation says, and an
    # error when asked off (2.15 on Windows stopped after 2.5 h on oneapi/dnnl/dnnl.hpp, 2026-11-25)
    required_for:
      xpu: 'PyTorch compiles its oneDNN sources for XPU always (aten/src/ATen/CMakeLists.txt: if(USE_XPU) ... mkldnn_xpu_cpp,
        xpu_mkldnn), and builds oneDNN for the GPU only with USE_MKLDNN (cmake/Dependencies.cmake -> FindMKLDNN.cmake)'

  fbgemm:
    desc: FBGEMM, the quantized 8-bit operators for x86 servers
    flags: {USE_FBGEMM: ['ON', 'OFF']}               # (its submodule stays whole: PreBuildSteps.cmake wants third_party/fbgemm/external/asmjit)
    default: auto

  xnnpack:
    desc: XNNPACK, the mobile CPU kernels
    flags: {USE_XNNPACK: ['ON', 'OFF']}
    default: {windows: 'off', '*': auto}             # Windows: off, as this program builds it there

  nnpack:
    desc: NNPACK, the older CPU convolution kernels
    flags: {USE_NNPACK: ['ON', 'OFF']}
    default: auto

  qnnpack:
    desc: QNNPACK, quantized 8-bit operators of ATen
    flags: {USE_PYTORCH_QNNPACK: ['ON', 'OFF']}
    default: auto

  flash-attention:
    desc: the flash-attention kernels of scaled dot product attention on a GPU (a long part of a CUDA build)
    flags: {USE_FLASH_ATTENTION: ['ON', 'OFF']}      # cmake_dependent_option(USE_FLASH_ATTENTION ... ON "USE_CUDA ...")
    targets: [cuda, rocm]
    default: auto

  tests:
    desc: PyTorch's C++ test binaries (they double the build's time; not needed to use or measure it)
    flags: {BUILD_TEST: ['1', '0']}
    default: 'off'                                   # as this program always built it

variations:
  lean:
    desc: the same build as without a variation, cloned with only what it reads - the superproject and the submodules
      shallow, and the submodules of the parts that are off without their own
    components: {}

  minimal:
    desc: the smallest build for a check of the targets - the optional CPU kernels, the profiler and the GPU
      attention kernels off
    components:
      distributed: 'off'
      kineto: 'off'
      mkldnn: 'off'
      fbgemm: 'off'
      xnnpack: 'off'
      nnpack: 'off'
      qnnpack: 'off'
      mslk: 'off'
      flash-attention: 'off'
      tests: 'off'

###################################################################################################
updates:
  compile:
    uses:
      # The host compiler of the template's compiler step is asked for the targets that customize1 leaves to it
      # (local.pytorch_host_compute): on Linux an xpu build keeps the machine's compiler - asked for xpu, the
      # compiler task would take icpx for everything (README.tech.md, "The toolkit of a target")
      - match:
          task: compiler,f3925b201c704bde
        update:
          compute: '{{local.pytorch_host_compute}}'

      - match:
          internal_func: customize2
        append:
          ######################################################################################
          # Python is required both for the build system and the resulting Python bindings
          - task: setup,a2f9b61079ce4333
            name: python,c00fb574d8ca4463

            # Its own venv: the torch it builds must not meet another program's torch or the
            # CUDA wheels it brings (an older pip cuBLAS broke the import of a CUDA 13.3 build)
            with:
              venv_path: '{{local.target_path}}/venv-{{global.target.cmeta_targets_tag}}'

          # Host compiler
          - task: setup,a2f9b61079ce4333
            name: msvc,e823256bbbe54b4e
            if_os: windows

          # Extra C compiler required by PyTorch's CMake (asked for the same targets as the C++ one)
          - task: compiler,f3925b201c704bde
            lang: c
            compute: '{{local.pytorch_host_compute}}'

          # Intel GPUs: the oneAPI environment, in which PyTorch's CMake finds the SYCL compiler (icpx) and the
          # libraries - the release the toolkits block names for this PyTorch
          - task: setup,a2f9b61079ce4333
            if: '"xpu" in {{global.target.compute|$[]}}'
            name: oneapi,3d44b79b6a2b476c

          - task: setup,a2f9b61079ce4333
            name: cmake,e26c11ebb3dd40ca

          - task: setup,a2f9b61079ce4333
            name: ninja,a3df3c45e9b04830

          ######################################################################################
          # Build-time pip requirements
          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: pyyaml

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: typing_extensions

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: sympy

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: filelock

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: networkx

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: numpy

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: setuptools

          - task: setup,a2f9b61079ce4333
            name: pip
            with:
              package: packaging

          - task: setup,a2f9b61079ce4333
            name: pip,c4987bc3955347f2
            with:
              package: mkl-devel
            if_os: windows,linux
            if: >-
              {{params.use_mkl|$False}} and (
              "cpu" in {{global.target.compute|$[]}}
              or
              "xpu" in {{global.target.compute|$[]}}
              )

          ######################################################################################
          # OpenMP via Clang on Linux / macOS
          - task: setup,a2f9b61079ce4333
            if_os: linux,darwin
            if: '{{global.target.compute|$[]}} == ["cpu"] and "{{global.llvm.path|None}}" != "None"'
            name: lib-openmp,7958b973fc0d42a9

          ######################################################################################
          # CUDA libs
          - task: setup,a2f9b61079ce4333
            if: '{{params.use_cudnn|$False}}'
            name: lib-cudnn,440a30eb25b64853

          ######################################################################################
          # CUDA libs: what PyTorch links and includes (nvml.h of NVML in c10/cuda; cuFile on every system but
          # Windows). A toolkit that cMeta installed from NVIDIA's archives holds the compiler until a program asks
          # for its libraries (lib-cuda adds them to it; a component a system's archives do not have is left out);
          # a toolkit of the system has them all
          - task: setup,a2f9b61079ce4333
            if: '"cuda" in {{global.target.compute|$[]}}'
            name: lib-cuda,ac9daedec465409e
            with:
              lib_names:
                - $cublas
                - $cudart
                - $cufft
                - $curand
                - $cusparse
                - $cusolver
                - $nvrtc
                - $nvjitlink
                - $cupti
                - $nvtx
                - $nvml
                - $cufile

          ######################################################################################
          # A build of a variation or of named parts reads one commit of the superproject: cloned shallow (plan_clone)
          - internal_func: plan_clone
            internal_func_from_local_key: selected-program
            internal_func_safe: True

          # Clone PyTorch source
          - task: clone-git-to-cache,86919b3cfdd443d2
            name: src-pytorch
            url: 'https://github.com/pytorch/pytorch'

            # The newest release (master is the next development version); --checkout=<tag|branch>
            checkout: '{{params.checkout|v2.15.0}}'

            # its tag alone for a variation or named parts (a clone of its own beside the full one); whole otherwise
            depth: '{{local.pytorch_superproject_depth|$None}}'

          # The optional parts of the build for this system and these targets (components: / variations: above):
          # the build variables that follow, and which submodules are fetched without their own
          - internal_func: plan_components
            internal_func_from_local_key: selected-program
            internal_func_safe: True

          # PyTorch depends heavily on submodules (e.g. pybind11, sleef, XNNPACK): fetched by clone-git in the clone
          # made above - with git's long paths on Windows, by the plan of the parts when one is asked, and with the
          # words for Git's limit of a git folder on Windows when a clone is too deep for it
          - task: clone-git,af9422df6ea241ec
            storage_key: init-pytorch-submodules
            cache: False
            url: 'https://github.com/pytorch/pytorch'
            repo: '{{global.clone-git-to-cache-src-pytorch.path_to_git_repo}}'
            update_submodules: True
            submodules_depth: '{{local.pytorch_submodules_depth|$None}}'
            submodules_not_recursive: '{{local.pytorch_submodules_not_recursive|$[]}}'
            submodules_files: '{{local.pytorch_submodules_files|$[]}}'

          ######################################################################################
          # Compute pip_install_env and check-file paths
          - internal_func: customize_pytorch
            internal_func_from_local_key: selected-program
            internal_func_safe: True
            _update: '{{ params.customize_pytorch|${} }}'
#            compile: '{{params.compile|$None}}'

          ######################################################################################
          # Build and install PyTorch Python package into the active venv.
          # pip install --no-build-isolation uses the current venv (not an isolated env),
          # so the build-time requirements installed above are available to setup.py.
          # cmake + ninja are invoked internally by setup.py; BUILD_DIR is {source}/build/.
          - task: cmd,c9ba0a88df394d7f
            storage_key: compile-program
            save_script: '{{local.target_path}}//tmp-cmeta-compile-program{{global.host.vars.file_ext_bat}}'
            chdir: '{{global.clone-git-to-cache-src-pytorch.path_to_git_repo}}'
            env: '{{local.pip_install_env}}'
            cmds:
              # The release's own build requirements: since 2.14 the build backend is
              # scikit-build-core, which --no-build-isolation needs in the venv (older trees:
              # requirements.txt)
              - '{{global.python.qpath}} -m pip install -r {{local.pytorch_build_requirements}}'
              - '{{global.python.qpath}} -m pip install --no-build-isolation -v .'


  run:
    uses:
       - match:
           task: setup-run,148f6c1fdb4247df
         prepend:
           - task: setup,a2f9b61079ce4333
             name: python,c00fb574d8ca4463
             with:
               venv_path: '{{local.target_path}}/venv-{{global.target.cmeta_targets_tag}}'

         update:
           target_exe:
           profile_python: '{{params.profile_python|$None}}'
           run_src_file_names: '{{local.run_src_file_names}}'
           cmd: >-
             {{global.python.qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}}
             {run_src_file_names_str_with_path}
