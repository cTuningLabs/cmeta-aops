###################################################################################################
inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: cpp

  # cmake produces the binary named 'program' directly in target_path (Ninja generator)
  target_file_name: 'program'

  output_files:
    - output.txt

  result_files:
    output: output.txt

  print_files:
    - output.txt

###################################################################################################
updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          ######################################################################################
          # Tools required for cmake compilation of the test binary
          - task: compiler,f3925b201c704bde
            lang: c
            compute: '{{global.target.compute}}'

          - task: setup,a2f9b61079ce4333
            name: cmake,e26c11ebb3dd40ca

          - task: setup,a2f9b61079ce4333
            name: ninja,a3df3c45e9b04830

          ######################################################################################
          # Build libtorch via program/build-torch-cpp (cmake --install) if not cached
          - task: setup,a2f9b61079ce4333
            name: torch-cpp,d4f7a2e8c3b01956
            # Note that next I add space after ${} otherwise will mix up }}} ...
            with: '{{ params.setup_torch_cpp|${} }}'
            _update: '{{ params.setup_torch_cpp_task|${} }}'

          ######################################################################################
          # Compute cmake -D flags and source path for the test program
          - internal_func: customize_compile
            internal_func_from_local_key: selected-program
            internal_func_safe: True
#            compile: '{{params.compile|$None}}'

          ######################################################################################
          # cmake configure + build of the test program
          - task: cmd,c9ba0a88df394d7f
            storage_key: compile-program
            save_script: '{{local.target_path}}//tmp-cmeta-compile-program{{global.host.vars.file_ext_bat}}'
            chdir: '{{local.target_path}}'
            cmds:
              - '{{global.cmake.qpath}} {{local.cmake_src_path}} -G Ninja {{local.cmake_d_vars}}'
              - '{{global.cmake.qpath}} --build . --config {{local.build_type}}'


  run:
    uses:
      - match:
          task: setup-run,148f6c1fdb4247df
        prepend:
          # Ensure torch-cpp is available (triggers build if not cached)
          - task: setup,a2f9b61079ce4333
            name: torch-cpp,d4f7a2e8c3b01956
            _update: '{{ params.setup_torch_cpp|${} }}'

        update:
          # Add libtorch lib dir to PATH / LD_LIBRARY_PATH / DYLD_LIBRARY_PATH
          global_keys_with_dynamic_libs:
            - torch-cpp
          cmd_main: ''
