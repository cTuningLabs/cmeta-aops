###################################################################################################
inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  lang: cpp

  target_file_name: 'llama-cli'

  input_files:
    data: '{{local.dataset.path}}'

  output_files:
    - output.txt
    - llama.log
    - perf.json

  result_files:
    response: output.txt
    perf: perf.json

  print_files:
    - output.txt

params:
  compile:
    d:
      XOPENME:

###################################################################################################
updates:
  compile:
    uses:
      - match:
          internal_func: customize2
        append:
          ######################################################################################
          # Common for HOST CPU
          # Extra C compiler required
          - task: compiler,f3925b201c704bde
            lang: c
            compute: '{{global.target.compute}}'

          - task: setup,a2f9b61079ce4333
            name: cmake,e26c11ebb3dd40ca

          - task: setup,a2f9b61079ce4333
            name: ninja,a3df3c45e9b04830

          ######################################################################################
          # Prepare Libs for Target CPU
          # (OpenSSL is optional - customize_llama_cpp uses it when it is installed)

          # Only for Clang on Linux and MacOS
          - task: setup,a2f9b61079ce4333
            if_os: linux,darwin
            if: '{{global.target.compute|$[]}} == ["cpu"] and "{{global.llvm.path|None}}" != "None" '
            name: lib-openmp,7958b973fc0d42a9

          ######################################################################################
          # Prepare Libs for Target CUDA

          - task: setup,a2f9b61079ce4333
            if: '"cuda" in {{global.target.compute|$[]}}'
            name: lib-cuda,ac9daedec465409e
            with:
               lib_names:
                 - $cublas
                 - $cudart

          ######################################################################################
          # Prepare Libs for Target Android CPU
          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-sysroot-android,cdc22b7617f54f2c
            with:
              static: '{{local.params.compile.static|$None}}'
              lib_names:
                - dl
                - m
                - z
              dynamic_libs: 
                - c++_shared

          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-openmp-android,4631aca5f3d241b4

          - task: setup,a2f9b61079ce4333
            if: '"android-cpu" in {{global.target.compute|$[]}}'
            name: lib-openssl-android,c6cd8622939a4f66

          # The same build as the release tool installs (tool/llama-cpp default_version), so a
          # release and a source build compare out of the box; --checkout=<tag|branch|commit>
          # (master was the default: whatever it was at the first clone, then cached)
          - task: clone-git-to-cache,86919b3cfdd443d2
            name: src-llama-cpp
            url: 'https://github.com/ggml-org/llama.cpp'
            checkout: '{{params.checkout|b12590}}'

          - internal_func: customize_llama_cpp
            internal_func_from_local_key: selected-program
            internal_func_safe: True
            _update: '{{ params.customize_llama_cpp|${} }}'
#            compile: '{{params.compile|$None}}'

          - task: cmd,c9ba0a88df394d7f
            storage_key: compile-program
            save_script: '{{local.target_path}}//tmp-cmeta-compile-program{{global.host.vars.file_ext_bat}}'
            chdir: '{{local.target_path}}'
            env: '{{local.llama_cpp_build_env|$None}}'
            cmds: 
              - '{{global.cmake.qpath}} "{{global.clone-git-to-cache-src-llama-cpp.path_to_git_repo}}" -G Ninja {{local.cmake_d_vars}}'
              - '{{global.cmake.qpath}} --build . --config {{local.build_type}}'


  run:
    uses:
       - match:
           internal_func: customize_run
         append:
           - task: model,86f0effd07ad454d
             model_tags: gguf

           - task: dataset,30e20c7489f14f84
             dataset_tags: prompt,txt,llm

       - match:
           task: setup-run,148f6c1fdb4247df

         # The binary and the model: here, or on the Android device (kept under /data/local/tmp)
         prepend:
           - internal_func: prepare_target_run
             internal_func_from_local_key: selected-program
             internal_func_safe: True
         update:
           # Android (--compute=android-cpu): the build's binary and libraries and the model
           android_push_folders: '{{local.llama_cpp_setup_run.android_push_folders|$None}}'
           android_push_files: '{{local.llama_cpp_setup_run.android_push_files|$None}}'
           android_ld_library_path: '{{local.llama_cpp_setup_run.android_ld_library_path|$None}}'
           android_skip_pull: '{{local.llama_cpp_setup_run.android_skip_pull|$None}}'
           cmd: >-
             {{local.llama_cpp_exe}}
             {run_flags_after_exe}
           cmd_main: >-
               -m {{local.llama_cpp_model}}
               -f {qinput_files.data}
               -n {{params.n|500}}
               --temp {{params.temp|0.7}}
               -c {{params.c|4096}}
               --seed {{params.seed|12345}}
               --no-display-prompt
               --single-turn
               --simple-io
               {{params.log_flags|-v}}
               {{local.llama_cpp_compute_flags|}}
               2> llama.log
               > output.txt

       # Clean output.txt and record llama.cpp's timings (llama.log) as result['perf']
       - match:
           task: finish-run,5e14d7eca4f64440
         prepend:
           - internal_func: finish_llama_run
             internal_func_from_local_key: selected-program
             internal_func_safe: True

###################################################################################################
# What the program's own words mean, for people: the cMeta CLI builder (cserver.cmeta.cli) and help read this block,
# the engine never does. The page finds the words read above ({{params.checkout|...}}, {{params.n|500}} ...) with
# their usual values; the others are read by the program's code (api_v1.py,
# category/program/api/common_llama_cpp.py). choice: build | run - a parameter of the build or of the run, shown
# first; group: more keeps a rare one with the other options.
cli_help:
  checkout:
    title: Which llama.cpp
    desc: The version of llama.cpp to build - a tag, a branch or a commit
    choice: build
  max_jobs:
    title: Compile jobs
    type: int
    min: 1
    desc: How many files are compiled at once; the number that fits the free memory when you give none
    example: '4'
    choice: build
    group: more
  android_abi:
    title: Android processor
    desc: The processor of an Android build
    example: arm64-v8a
    choice: build
    group: more
  android_api:
    title: Android API level
    type: int
    desc: The Android API level of an Android build (28 when you give none)
    example: '28'
    choice: build
    group: more

  n:
    title: How many tokens
    type: int
    min: 1
    desc: The number of tokens to generate
  temp:
    title: Temperature
    type: float
    min: 0
    desc: 'How much the answer varies: 0 always takes the most likely token, a higher value chooses more freely'
  c:
    title: Context size
    type: int
    min: 1
    desc: The context window in tokens - the prompt and the answer together
  seed:
    title: Seed
    type: int
    desc: The seed of the random choices - the same seed, model and prompt give the same answer
  threads:
    title: CPU threads
    type: int
    min: 1
    desc: The number of CPU threads (llama.cpp's -t); its own choice when you give none
    example: '8'
    choice: run
  ngl:
    title: Layers on the GPU
    type: int
    min: 0
    desc: How many layers of the model go to the GPU, the rest staying on the CPU (llama.cpp's -ngl)
    example: '12'
    choice: run

  devices:
    title: Devices
    desc: The devices to use, by llama.cpp's names (its --device)
    example: CUDA0,Vulkan0
    choice: run
    group: more
  split_mode:
    title: Split over GPUs
    values: [layer, row, none]
    desc: How the model is split over several GPUs (llama.cpp's -sm)
    choice: run
    group: more
  tensor_split:
    title: Share of each GPU
    desc: The share of the model each GPU takes (llama.cpp's -ts)
    example: '3,1'
    choice: run
    group: more
  main_gpu:
    title: Main GPU
    type: int
    min: 0
    desc: The number of the GPU that does the rest of the work (llama.cpp's -mg)
    example: '1'
    choice: run
    group: more
  log_flags:
    title: Log flags
    desc: The flags of llama.cpp's log; the usual -v writes everything into llama.log
    group: more
