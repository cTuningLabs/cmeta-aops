###################################################################################################
inherits:
  - template-c-cpu,649899ef3f004e4a

local_vars:
  work_path: '{pwd}'

  input_files:
    data: '{{local.dataset.path}}'

  output_files:
    - output.txt
    - llama.log
    - perf.json

  result_files:
    response: output.txt
    perf: perf.json

  print_files:
    - output.txt

###################################################################################################
updates:
  compile:
    skip: True


  run:
    uses:
       - match:
           internal_func: customize_run
         append:
           - task: setup,a2f9b61079ce4333
             name: llama-cpp,daa99512448647b7
             # Note that next I add space after ${} otherwise will mix up }}} ...
#             with: '{{ params.setup_llama_cpp|${} }}'
#             skip_install: True
             _update: '{{ params.setup_llama_cpp|${} }}'

           - task: model,86f0effd07ad454d
             model_tags: gguf

           - task: dataset,30e20c7489f14f84
             dataset_tags: prompt,txt,llm

       - match:
           task: setup-run,148f6c1fdb4247df
         update:
           global_keys_with_dynamic_libs:
             - llama-cpp
           # llama-completion: one-shot text generation (llama-cli became an interactive
           # chat UI that prints a banner, late 2025); llama-cli itself in older builds
           cmd: >-
             {{global.llama-cpp.completion_qpath}}
             {run_flags_after_exe}
             {{params.run_flags|}} 
           cmd_main: >-
               -m {{local.model.qpath}}
               -f {qinput_files.data}
               -n {{params.n|500}}
               --temp {{params.temp|0.7}}
               -c {{params.c|4096}}
               --seed {{params.seed|12345}}
               --no-display-prompt
               --single-turn
               --simple-io
               {{local.llama_cpp_compute_flags|}}
               2> llama.log
               > output.txt

       # Clean output.txt and record llama.cpp's timings (llama.log) as result['perf']
       - match:
           task: finish-run,5e14d7eca4f64440
         prepend:
           - internal_func: finish_llama_run
             internal_func_from_local_key: selected-program
             internal_func_safe: True
