authors: Grigori Fursin

# AIPerf, benchmarking of generative AI inference servers - https://github.com/ai-dynamo/aiperf (Apache-2.0).
#
# Installed as the pinned PyPI package "aiperf" in its own Python 3.12
# environment by the shared helper category/tool/api/common_pyvenv.py: tool/uv creates the
# environment in the tool's cache entry (and downloads that Python if needed), so the system
# Python and other tools' packages are never touched. An installation already on the PATH is
# detected and used first.
#
#   cx tool setup aiperf                          # detect, else install the pinned version
#   cx tool setup aiperf --version=<x.y.z> --new  # another version
#
# Quick checks:
#   cx tool run aiperf -- --version
#   against a local OpenAI-compatible server (e.g. llama.cpp or vLLM):  cx tool run aiperf -- profile --model <name> --url http://127.0.0.1:8080 --endpoint-type chat --streaming --request-count 10

names:
  - aiperf{{global.host.vars.file_ext_exe}}

default_version: '0.13.0'

match_version:
  - regex: '(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/ai-dynamo/aiperf'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v?(\d+\.\d+\.\d+)(?![\w.-])'

install_help_text: |
  Could not install aiperf automatically on this system.
  See https://github.com/ai-dynamo/aiperf and run "cx tool setup aiperf" again.
