names:
  - go{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'go([^\s]+)'
    group: 1

cmd_get_version: '{{tool_path}} version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/golang/go'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'go(\d+(?:\.\d+)*(?:rc\d+)?)'

features:
  windows:
    flags:
      force_build: 'build'
      exe_file: '-o '
    vars:
      file_ext_exe: .exe
  linux:
    flags:
      force_build: 'build'
      exe_file: '-o '
    vars:
      file_ext_exe: 
  darwin:
    flags:
      force_build: 'build'
      exe_file: '-o '
    vars:
      file_ext_exe: 


