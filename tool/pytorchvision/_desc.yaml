authors: Grigori Fursin
storage_key: pytorchvision

###################################################################################################
# torchvision built from source against the torch of the Python, the mirror of tool/pytorch:
# program/build-pytorchvision does the build and pairs it by itself (the vision release of the torch
# found there, BUILD_VERSION, PYTORCH_VERSION; --version=0.29.1 names the release instead); a
# torchvision already in that Python - built earlier or PyTorch's wheel - is detected as it is.
#
#   cx tool setup pytorchvision --with.compute=cuda --use.python.venv_path=<folder>                 # the venv of the torch build
#   cx tool setup pytorchvision --with.compute=cuda --with.torch=pip --use.python.venv_path=<folder> # PyTorch's wheel torch first
#   cx tool setup pytorchvision --version=0.29.1 --with.compute=cuda --use.python.venv_path=<folder>
#
# (a tool setup takes the target as --with.compute, like tool/pytorch; a program run takes --compute)
#
# The same --use.python.venv_path on the torch build, this tool and the programs that use the pair
# (program/build-pytorchvision/README.md).
###################################################################################################

# The Python package the tool stands for
name: torchvision

# Found as the package's __init__.py in the site-packages of the Python of the run (a venv on Linux and
# macOS, a venv or a plain install on Windows); the generic search looks for a FILE of each name under
# the search paths, so the paths below point at the Python's home
names:
  - 'lib/python3.*/site-packages/torchvision/__init__.py'
  - 'Lib/site-packages/torchvision/__init__.py'

extra_paths:
  linux:                                 # Linux and macOS (a venv: <home>/lib/python3.x/site-packages)
    - '{{global.python.path_home|}}'
  windows:                               # a venv (<home>\Lib) or a plain install (python.exe next to Lib)
    - '{{global.python.path_home|}}'
    - '{{global.python.path_bin|}}'

# The Python first: the same --use.python.venv_path as the torch build selects its venv
uses:
  - task: runner,1e48cc0c5f6041a5
  - task: setup,a2f9b61079ce4333
    name: python,c00fb574d8ca4463

# torchvision.__version__ is "0.29.1", "0.29.1+cu132" or "0.30.0a0+abcdef0"
match_version:
  - regex: '^(\d+\.\d+[\.\d]*)'
    group: 1

# Version detection: import torchvision inside the active Python env
cmd_get_version: '{{global.python.qpath}} -c "import torchvision; print(torchvision.__version__)"'

# Available releases: git tags of the form v0.22.1, v0.29.1, ...
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/pytorch/vision'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

build_local:
  target_sub_dir: 'build'

cache_meta_const:
  params:
    with:
      compute: '{{local.compute}}'
      torch: '{{params.with.torch|$None}}'
      ver: '{{params.with.ver|$None}}'

build_uses:
  all:
    - task: compile-and-run-program,05437a1aae224270
      name: build-pytorchvision,c82421ed17254db4
      clean: '{{params.with.clean|$None}}'
      recompile: '{{params.with.recompile|$None}}'
      compute: '{{params.with.compute|$[]}}'
      skip_run: True
      target_path: '{{local.target_path}}'
      # v<version> when a version was asked; else the program pairs the checkout with the torch it finds
      checkout: '{{local.checkout|$None}}'
      # --with.torch=pip: PyTorch's wheel torch into the Python before the build
      torch: '{{params.with.torch|$None}}'
