authors: Grigori Fursin

# AKS Flex Node agent ("aks-flex-node") - https://github.com/Azure/AKSFlexNode (MIT, public preview).
#
# Upstream publishes release archives for Linux only (aks-flex-node-linux-{amd64,arm64}.tar.gz plus
# checksums.txt), because the agent runs on Linux hosts (Ubuntu 24.04, systemd-nspawn); it does not
# even compile for Windows or macOS (Linux-only dependencies). So:
#   install (tier 1, Linux amd64/arm64): download the pinned release archive, verify its SHA-256
#       against the release's checksums.txt, unpack, name the binary "aks-flex-node";
#   build (--build, Linux): clone the repository into the cMeta cache at
#       v<version> (or --with.checkout=<tag|branch|commit>) and "go build" it with the go tool,
#       stamping version, commit and build time the way upstream's Makefile does.
#
#   cx tool setup aks-flex-node                        # detect, else download the pinned release (Linux)
#   cx tool setup aks-flex-node --version=0.1.11 --new # another release
#   cx tool setup aks-flex-node --build --skip_install # build from git at v<default_version>
#   cx tool setup aks-flex-node --build --skip_install --with.checkout=main --new
#   cx tool run aks-flex-node -- version
#
# On Windows and macOS run the same commands in WSL or a Linux container.

names:
  - aks-flex-node{{global.host.vars.file_ext_exe}}

default_version: '0.2.0'

match_version:
  - regex: 'Version:\s*v?(\d+\.\d+\.\d+[0-9A-Za-z.\-]*)'
    group: 1

cmd_get_version: '{{tool_path}} version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/Azure/AKSFlexNode'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'

extra_paths:
  linux:
    - '/usr/local/bin'
    - '/usr/bin'

build_local:
  target_sub_dir: 'build'

install_help_text: |
  AKS Flex Node publishes Linux release archives only (amd64, arm64), and the agent builds and runs
  on Linux only. On Windows or macOS, run the same cx commands in WSL or a Linux container.
  For an unreleased revision on Linux, build it from git:
    cx tool setup aks-flex-node --build --skip_install [--with.checkout=<tag|branch|commit>] --new
  See https://github.com/Azure/AKSFlexNode and https://learn.microsoft.com/azure/aks/flex-nodes-for-aks-overview
