note: AKS Flex Node (https://github.com/Azure/AKSFlexNode, MIT, public preview) -
  the host agent that joins customer-managed Linux VMs and bare-metal hosts to an
  Azure Kubernetes Service cluster as worker nodes in an isolated systemd-nspawn environment.
  The tool only makes the binary available (for version checks, preflight, docs and
  offline bootstrap artifacts); joining a host is a separate, deliberate step that
  needs an AKS cluster, a Flex node pool and a host identity.
