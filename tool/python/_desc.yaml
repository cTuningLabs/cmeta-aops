storage_key: python

#cache_params_with: True
cache_params_with: False # moved explicitly to cache_params to avoid unexpected effects

cache_params:
  - with.venv
  - with.pip
  - with.conda    # a conda environment made by cMeta (task venv --conda) instead of a uv venv: its own entries
  - with.conda_packages
  - with.channel
  - venv_path
  - python_base   # the interpreter a venv was made on (a requested conda / system python): its own entries

names:
  - python3{{global.host.vars.file_ext_exe}}
  - python3.*{{global.host.vars.file_ext_exe}}
  - python{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "python ([0-9]+(?:[.\\-][0-9A-Za-z]+)*)"
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.uv.qpath}} python list --all-versions'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: uv,92f171fc18714ebd
cmd_get_versions_regex: 'cpython-(\d+\.\d+\.\d+)-'

install_help_text: Check https://www.python.org/ for more details!

install_uses:
  all:
    - task: venv,bb68247d2fde489d
      version: "{{params.version|$None}}"
      # A requested interpreter that is not a venv (--use.python.tool_path=<conda / system python>,
      # --here) is not replaced by a uv-managed python: the venv is made on it (python_base, set by check_params)
      python: "{{params.python_base|$None}}"
      # --use.python.with.conda: a conda environment (.conda-env, by the conda of tool/conda) instead of a uv venv;
      # with.conda_packages (comma-separated) and with.channel go into "conda create"
      conda: "{{params.with.conda|$None}}"
      conda_packages: "{{params.with.conda_packages|$None}}"
      channel: "{{params.with.channel|$None}}"

# Add env path keys to aggregated if detected
add_env_path_keys:
- PATH
- PYTHONPATH
- _OLD_VIRTUAL_PATH


