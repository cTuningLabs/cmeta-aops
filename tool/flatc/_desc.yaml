# flatc, the FlatBuffers schema compiler - https://github.com/google/flatbuffers (Apache-2.0).
# ExecuTorch's exporter runs it to write .pte programs (FLATC_EXECUTABLE points it at this one),
# and builds that generate FlatBuffers code need it.
#
# An installation on the PATH (or in extra_paths) is detected and used first. Otherwise the
# pinned GitHub release (install ladder tier 1, api_v1.py): Windows x64, Linux x86_64, macOS
# arm64 and x86_64, checked against its SHA-256. Linux on other CPUs falls back to the
# distribution's package (sudo).
#
#   cx tool setup flatc                          # detect, else install the pinned release
#   cx tool setup flatc --version=25.9.23 --new  # another release
#   cx tool setup flatc --versions               # the released versions
#   cx tool run flatc -- --version

names:
  - flatc{{global.host.vars.file_ext_exe}}

default_version: '25.12.19'

match_version:
  - regex: 'flatc version (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/google/flatbuffers'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'

# Where the release has no binary: the distribution's package
package_name: 'flatbuffers-compiler'
package_name_os_id:
  alpine: 'flatc'
  arch: 'flatbuffers'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'

requires_sudo:
  linux: True

install_help_text: |
  Could not install flatc automatically on this system. Install the FlatBuffers compiler from
  https://github.com/google/flatbuffers/releases (or build it from source) and run
  "cx tool setup flatc" again.
