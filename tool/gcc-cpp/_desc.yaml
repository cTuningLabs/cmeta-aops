storage_key: gcc-cpp

cache_params_use: 
  all:
    gcc:
      version: "{{global.gcc.version}}"
      path: "{{global.gcc.path}}"

only_paths:
  all:
    - "{{global.gcc.path_bin}}"

names:
  - g++{{global.host.vars.file_ext_exe}}
  - g++-?{{global.host.vars.file_ext_exe}}
  - g++-??{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'g\+\+(?:-\d+)?(?:\s+\([^)]*\))?\s+(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/gcc-mirror/gcc'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/releases/gcc-([^^\s]+)(?:\^\{\})?$'

uses:
- task: setup,a2f9b61079ce4333
  name: gcc,222c51b9e9eb4887
  version: "{{params.version|$None}}"

package_name: 'g++'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'

install_cmd_version:
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'

features:
  linux:
    flags:
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static'
      dynamic_build_debug: ''
      static_build_debug: '-static'
      exe_file: '-o '
      lib_path: '-L'
      lib_prefix: '-l'
    vars:
      file_ext_exe:
