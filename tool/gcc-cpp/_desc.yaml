copyright: Copyright (C) 2026 Grigori Fursin. All rights reserved.

storage_key: gcc-cpp

cache_params_use: 
  all:
    gcc:
      version: "{{global.gcc.version}}"
      path: "{{global.gcc.path}}"

only_paths:
  all:
    - "{{global.gcc.path_bin}}"

names:
  - g++{{global.host.vars.file_ext_exe}}
  - g++-?{{global.host.vars.file_ext_exe}}
  - g++-??{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'g\+\+(?:-\d+)?(?:\s+\([^)]*\))?\s+(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/gcc-mirror/gcc'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/releases/gcc-([^^\s]+)(?:\^\{\})?$'

uses:
- task: setup,a2f9b61079ce4333
  name: gcc,222c51b9e9eb4887
  version: "{{params.version|$None}}"

package_name: 'g++'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'

install_cmd_version:
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'

features:
  linux:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static'
      dynamic_build_debug: '-g'
      static_build_debug: '-static -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: '-fopenmp'
      fast: '-O3'
      fastest: '-Ofast -march=native'
      profile: '-fno-omit-frame-pointer'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-shared'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-shared -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe:
      file_ext_lib: .a
      file_ext_lib2: .a
      file_ext_dlib: .so
      file_ext_obj: .o
