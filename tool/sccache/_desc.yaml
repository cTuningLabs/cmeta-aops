authors: Grigori Fursin

# sccache, the shared compilation cache from Mozilla - https://github.com/mozilla/sccache (Apache-2.0).
#
# Installed from the pinned upstream release (install ladder tier 1) by the shared helper
# category/tool/api/common_release.py: the asset for this OS and CPU (x86_64 / aarch64 on Windows,
# Linux - the static musl build - and macOS), its SHA-256 checked against the per-asset ".sha256"
# file upstream publishes, the binary unpacked and named "sccache". An installation already on
# the PATH (cargo's ~/.cargo/bin included) is detected and used first.
#
#   cx tool setup sccache                         # detect, else install the pinned release
#   cx tool setup sccache --version=<x.y.z> --new # another release
#   cx tool setup sccache --versions              # the released versions
#
# Quick checks:
#   cx tool run sccache -- --version
#   cx tool run sccache -- --show-stats     # starts sccache's local server if none runs; hits, misses, cache size
#   cx tool run sccache -- --stop-server
#
# sccache wraps a compiler (gcc / clang / MSVC, Rust through RUSTC_WRAPPER, nvcc) and caches its
# outputs locally or in shared storage (S3, GCS, Azure, Redis, ...): a repeated build of the same
# sources is served from the cache. CMake: CMAKE_C_COMPILER_LAUNCHER=sccache (and _CXX_, _CUDA_);
# Cargo: RUSTC_WRAPPER=sccache.

names:
  - sccache{{global.host.vars.file_ext_exe}}

default_version: '0.18.0'

match_version:
  - regex: 'sccache (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/mozilla/sccache'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.cargo/bin'
    - '{{user_home}}/.local/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
    - '{{user_home}}/.cargo/bin'
  windows:
    - '{{user_home}}\.cargo\bin'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_help_text: |
  Could not install sccache from its release automatically on this system.
  Install it as described at https://github.com/mozilla/sccache#installation and run "cx tool setup sccache" again.
