names:
  - wpaexporter{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'performance analyzer version\s+([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} /h'

install_cmd:
  windows: "{{global.winget.qpath}} install -e -id Microsoft.WindowsADK --no-upgrade {{global.init.winget_install_flags|}}"

install_cmd_version:
  windows: "{{global.winget.qpath}} install -e -id Microsoft.WindowsADK --version={{simple_version}} --no-upgrade {{global.init.winget_install_flags|}}"

extra_paths:
  windows:
    - "C:\\Program Files**\\Windows Kits\\**"
    - "D:\\Program Files**\\Windows Kits\\**"

win_only: True

