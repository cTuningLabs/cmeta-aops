authors: Grigori Fursin

# OpenTofu, open-source infrastructure as code - https://opentofu.org (MPL-2.0).
#
# Installed from the pinned upstream release (install ladder tier 1) by the shared helper
# category/tool/api/common_release.py: the asset for this OS and CPU, its SHA-256 checked where
# upstream publishes checksums, the binary unpacked and named "tofu". An installation already
# on the PATH (or in extra_paths) is detected and used first.
#
#   cx tool setup opentofu                         # detect, else install the pinned release
#   cx tool setup opentofu --version=<x.y.z> --new # another release
#   cx tool setup opentofu --versions              # the released versions
#
# Quick checks:
#   cx tool run opentofu -- version
#   the terraform test above with "cx tool run opentofu -- ..."
#
# No release asset upstream for: windows/arm64 (setup then prints install_help_text).

names:
  - tofu{{global.host.vars.file_ext_exe}}

default_version: '1.12.6'

match_version:
  - regex: 'OpenTofu v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/opentofu/opentofu'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_help_text: |
  Could not install tofu from its release automatically on this system.
  Install it as described at https://opentofu.org and run "cx tool setup opentofu" again.
