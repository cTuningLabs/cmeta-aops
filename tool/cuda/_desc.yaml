storage_key: cuda

names:
  - nvidia-smi{{global.host.vars.file_ext_exe}}

# "nvidia-smi --version": drivers 610+ print "CUDA UMD version : 13.3" and
# "CUDA version : Deprecated, see ..."; older drivers print "CUDA Version : 13.0"
match_version:
  - regex: 'CUDA UMD version\s*:\s*([0-9.]+)'
    group: 1
  - regex: 'CUDA Version\s*:\s*([0-9.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

install_help_text:
  The CUDA version of the driver comes with the NVIDIA driver - "cx tool upgrade nvidia-driver" installs the newest
  one for this GPU; the CUDA toolkit is "cx tool install nvcc".

extra_paths:
  windows:
    - "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"
    - "D:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"

