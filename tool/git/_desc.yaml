names:
  - git{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "git version ([0-9]+(?:[.\\-][0-9A-Za-z]+)*)"
    group: 1

cmd_get_version: '{{tool_path}} --version'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: 'xcode-select --install'
  windows: "{{global.winget.qpath}} install --id=Git.Git -e --no-upgrade --source winget {{global.init.winget_install_flags|}}"

install_cmd_version:
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'
  darwin: 'xcode-select --install'
  windows: "{{global.winget.qpath}} install --id=Git.Git -e --version={{simple_version}} --no-upgrade --source winget {{global.init.winget_install_flags|}}"

# Windows: the winget install needs administrator rights.
# Git.Git: its installer elevates itself (ElevationRequirement elevatesSelf).
# A quiet run (-q) that is not elevated does not start it (task/setup/install.py, unattended_rights);
# without -q, Windows asks (UAC).
requires_sudo:
  linux: True
  darwin: True
  windows: True

extra_paths:
  linux:
    - "/home/linuxbrew/.linuxbrew/**"
  darwin:
    - "/opt/homebrew/opt/cmake*/**"
  windows:
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"
    - "C:\\Program Files\\Git\\**\\"
    - "D:\\Program Files\\Git\\**\\"

