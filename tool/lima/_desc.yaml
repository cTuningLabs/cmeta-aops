authors: Grigori Fursin

# Lima (https://lima-vm.io, Apache-2.0): Linux virtual machines on macOS and Linux through Apple's Virtualization
# framework or QEMU - the VM layer under colima. Installed from the pinned upstream release (install ladder tier 1)
# by api_v1.py: the archive for this OS and CPU from github.com/lima-vm/lima, its SHA-256 checked against the
# release's SHA256SUMS, the whole tree unpacked into the cache entry (bin/limactl, bin/lima and share/lima with the
# guest agents and templates: limactl needs share/lima next to its bin, so one binary is not enough). A Homebrew or
# system limactl is detected first. Nothing on the PATH, nothing in the system.
#
#   cx tool setup lima                          # detect, else install the pinned release
#   cx tool setup lima --version=2.2.0 --new    # another release
#   cx tool setup lima --versions               # the released versions
#   cx tool run lima -- --version
#
# The VMs and their disks live under LIMA_HOME (~/.lima by default; colima sets its own); the downloaded guest
# images under the OS cache (~/Library/Caches/lima on macOS, ~/.cache/lima on Linux). To keep them on another
# drive, set LIMA_HOME or make ~/.lima a link.

names:
  - limactl

default_version: '2.2.1'

match_version:
  - regex: '(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/lima-vm/lima'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

# Fallback when the release cannot be downloaded: Homebrew (macOS and Linuxbrew)
install_cmd:
  darwin: 'brew install lima'
  linux: 'brew install lima'

extra_paths:
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
  linux:
    - '/usr/local/bin'
    - '{{user_home}}/.local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'

install_help_text: |
  Could not install Lima from its release automatically on this system.
  Install it per https://lima-vm.io (brew install lima) and run "cx tool setup lima" again.
