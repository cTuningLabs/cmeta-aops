names:
  - rclone{{global.host.vars.file_ext_exe}}

match_version:
  - regex: 'rclone v(\d+\.\d+\.\d+(?:[a-zA-Z0-9\-]+)?)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/rclone/rclone'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/(?:[A-Za-z0-9_.-]*[-v])?([^^\s]+)(?:\^\{\})?$'

# Version installed when the caller does not ask for a specific one.
# Pinned on purpose: resolving "latest" over the network at install time would
# make the same command produce different results on different days. Bump this
# line to move everyone forward; `cx tool setup rclone --versions` lists what is
# available upstream.
default_version: '1.75.0'

# rclone publishes the same archives on its own site and on GitHub releases.
# api_v1.py hands BOTH to task/download-file, which walks them in order and
# stops at the first success - so an outage on either host is survivable.
download_url_templates:
  - 'https://downloads.rclone.org/v{version}/{filename}'
  - 'https://github.com/rclone/rclone/releases/download/v{version}/{filename}'

###############################################################################
# Fallbacks, used only if the binary download above fails (task/setup then runs
# install_cmd). rclone is packaged everywhere, unlike rsync.
install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.host.os_extra.install_cmd_sudo}}'
  windows: '{{global.winget.qpath}} install --id=Rclone.Rclone -e --no-upgrade --source winget {{global.init.winget_install_flags|}}'

install_cmd_version:
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'
  darwin: '{{global.host.os_extra.install_cmd_sudo_version}}'
  windows: '{{global.winget.qpath}} install --id=Rclone.Rclone -e --version={{simple_version}} --no-upgrade --source winget {{global.init.winget_install_flags|}}'

requires_sudo:
  linux: True

extra_paths:
  linux:
    - '/usr/bin'
    - '/usr/local/bin'
    - '{{user_home}}/bin/**'
    - '/home/linuxbrew/.linuxbrew/**'
  darwin:
    - '/opt/homebrew/bin'
    - '/opt/homebrew/opt/rclone/bin'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'
    - 'C:\Program Files\rclone\**\'
    - 'D:\Program Files\rclone\**\'

install_help_text: |
  Could not set up rclone automatically.

  Download a prebuilt binary by hand from https://rclone.org/downloads/
  (or https://github.com/rclone/rclone/releases), put it on PATH, then re-run
  `cx tool setup rclone`.

  Package-manager alternatives:
    Linux  : sudo apt install rclone   /   sudo dnf install rclone
    macOS  : brew install rclone
    Windows: winget install --id=Rclone.Rclone -e
