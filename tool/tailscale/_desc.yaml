names:
  - tailscale{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: '^\s*(\d+(?:\.\d+)+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

# Linux: Tailscale's own installer (2026-11-14). It adds Tailscale's package repository for the distribution (apt,
# dnf, zypper, pacman ...) and installs the package, whose tailscaled runs as a system service - a VPN daemon needs
# root and the tun device, which Homebrew's user install had not; upgrades then come with the system's packages
# (running it again installs the newest). Started and logged in by "cx task run start-tailscale-service".
install_cmd:
  darwin: '{{global.brew.qpath}} install tailscale'
  linux: 'curl -fsSL https://tailscale.com/install.sh | sh'
  windows: "{{global.winget.qpath}} install --id=Tailscale.Tailscale -e --no-upgrade --source winget {{global.init.winget_install_flags|}}"

install_cmd_version:
  darwin: '{{global.brew.qpath}} install tailscale@{{major_version}}'
  windows: "{{global.winget.qpath}} install --id=Tailscale.Tailscale -e --version={{simple_version}} --no-upgrade --source winget {{global.init.winget_install_flags|}}"

extra_paths:
  linux:
    - "/home/linuxbrew/.linuxbrew/**"
  darwin:
    - "/opt/homebrew/opt/tailscale*/**"
  windows:
    - "C:\\Program Files\\Tailscale\\**"
    - "D:\\Program Files\\Tailscale\\**"
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"

# Windows: the winget install needs administrator rights.
# Tailscale.Tailscale: a per-machine MSI only (it installs a service).
# A quiet run (-q) that is not elevated does not start it (task/setup/install.py, unattended_rights);
# without -q, Windows asks (UAC).
requires_sudo:
  windows: True
  linux: True
