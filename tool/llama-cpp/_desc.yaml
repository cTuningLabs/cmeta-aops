storage_key: llama-cpp

name: llama-cli

match_version: 
  - regex: '^version:\s*(\d+)\b'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/ggml-org/llama.cpp'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/b(\d+)\b'

install_help_text:
  Please check https://github.com/ggml-org/llama.cpp !

extra_paths:
  linux:
    - "/home/linuxbrew/.linuxbrew/**"
  darwin:
    - "/opt/homebrew/opt/**"
  windows:
    - "C:\\Program Files**\\llama.cpp\\**"
    - "D:\\Program Files**\\llama.cpp\\**"
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"

build_local:
  target_sub_dir: 'build'

cache_meta_const:
  params:
    with:
      compute: '{{local.compute}}'
      static: '{{params.with.static|$False}}'
      debug_info: '{{params.with.debug_info|$False}}'
      strict_compute: '{{params.with.strict_compute|$None}}'
    target_abi: '{{local.target_abi}}'

build_uses:
  all:
    - task: compile-and-run-program,05437a1aae224270
      name: build-llama-cpp,a48c282bec5c45b8
      clean: '{{params.with.clean|$None}}'
      recompile: '{{params.with.recompile|$None}}'
      compute: '{{params.with.compute|$[]}}'
#      clean: True
      compile:
        static: '{{params.with.static|$False}}'
        debug_info: '{{params.with.debug_info|$None}}'
        strict_compute: '{{params.with.strict_compute|$None}}'
      skip_run: True
      target_path: '{{local.target_path}}'
      checkout: '{{local.checkout|$None}}'
