authors: Grigori Fursin

# Flux, GitOps for Kubernetes - https://fluxcd.io (Apache-2.0).
#
# Installed from the pinned upstream release (install ladder tier 1) by the shared helper
# category/tool/api/common_release.py: the asset for this OS and CPU, its SHA-256 checked where
# upstream publishes checksums, the binary unpacked and named "flux". An installation already
# on the PATH (or in extra_paths) is detected and used first.
#
#   cx tool setup flux                         # detect, else install the pinned release
#   cx tool setup flux --version=<x.y.z> --new # another release
#   cx tool setup flux --versions              # the released versions
#
# Quick checks:
#   cx tool run flux -- version --client
#   with a cluster (e.g. kind): cx tool run flux -- check --pre

names:
  - flux{{global.host.vars.file_ext_exe}}

default_version: '2.9.5'

match_version:
  - regex: 'flux: v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} version --client'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/fluxcd/flux2'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_help_text: |
  Could not install flux from its release automatically on this system.
  Install it as described at https://fluxcd.io and run "cx tool setup flux" again.
