names:
  - tmux{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'tmux\s+([^\s]+)'
    group: 1

cmd_get_version: '{{tool_path}} -V'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install tmux'

install_cmd_version:
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'
  darwin: '{{global.brew.qpath}} install tmux'

extra_paths:
  darwin:
    - "/opt/homebrew/opt/**"
