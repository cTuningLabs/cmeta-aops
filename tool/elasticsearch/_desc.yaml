authors: Grigori Fursin
description: Detect or install the official Elasticsearch distribution with its bundled Java runtime.
names: [cmeta-elasticsearch.cmd, elasticsearch, elasticsearch.bat]
default_version: '9.5.5'
cmd_get_version: '{{tool_path}} --version'
match_version:
  - regex: 'Version:\s*(\d+\.\d+\.\d+)'
    group: 1
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/elastic/elasticsearch'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'
skip_common_install_uses: true
install_help_text: |
  Elasticsearch is installed from Elastic's official checked archive, including its JDK.
  No service is started. Choose an upstream version available for this OS and CPU:
    cx tool setup elasticsearch --version=7.17.29
  Recent releases publish Linux x86_64/aarch64 and Windows x86_64 distributions;
  historical macOS assets depend on the requested version. Use Linux/Docker for an unsupported platform.
  See https://www.elastic.co/downloads/elasticsearch and the distribution's license.
