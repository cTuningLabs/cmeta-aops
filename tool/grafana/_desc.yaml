authors: Grigori Fursin
description: Detect or install Grafana (the open-source edition) from its official checked release archive.

names:
  - grafana{{global.host.vars.file_ext_exe}}

default_version: '13.3.2'

cmd_get_version: '{{tool_path}} --version'
match_version:
  - regex: 'version v?(\d+\.\d+\.\d+)'
    group: 1

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/grafana/grafana'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'

skip_common_install_uses: true

install_help_text: |
  Grafana (the open-source edition, AGPL-3.0) is installed from its official archive at dl.grafana.com (checked with
  the archive's .sha256), the whole distribution kept (bin/, conf/, public/). Nothing is started: a server is the
  task run-grafana-server. Choose a version with:
    cx tool setup grafana --version=13.3.1
  See https://grafana.com/grafana/download?edition=oss and the distribution's LICENSE.
