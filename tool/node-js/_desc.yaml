# Node.js (https://nodejs.org): the runtime, with npm and npx next to it. Detected where it is (a system install, nvm,
# Homebrew, winget); else installed from the official release archives (api_v1.py, install ladder tier 1): the
# archive of the pinned version for this OS and CPU is downloaded from nodejs.org/dist, its SHA-256 checked against
# the SHASUMS256.txt of that release, and the whole tree (bin/node, bin/npm, bin/npx, lib/node_modules/npm) unpacked
# into the cMeta cache entry - nothing on the PATH, nothing in the system; the default version is the current LTS
# (24.21.0 "Krypton" on 2026-10-07; --version=26.11.0 or any other published version pins another;
# "cx tool setup node-js --versions" lists them from the git tags). The declarative fallbacks, when the download is
# not possible: winget (the LTS package) on Windows, Homebrew on macOS, the distribution's nodejs + npm on Linux.
# Since 2026-10-07 (before, the tool only detected Node and pointed at nodejs.org).
names:
  - node{{global.host.vars.file_ext_exe}}

match_version:
  - regex: 'v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/nodejs/node'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/(?:[A-Za-z0-9_.-]*[-v])?(\d+\.\d+\.\d+)(?![\w.-])'
cmd_get_versions_regex_group: 1

install_help_text: |
  Could not download Node.js automatically.
  Install it per https://nodejs.org/en/download (the LTS release), or
    Windows:  winget install OpenJS.NodeJS.LTS
    macOS:    brew install node
    Linux:    the distribution's nodejs and npm packages, or nvm (https://github.com/nvm-sh/nvm)
  then retry "cx tool setup node-js".

# Fallbacks when api_v1.py cannot download the release (no asset for this CPU, no network): the package managers
install_cmd:
  windows: '{{global.winget.qpath}} install --id=OpenJS.NodeJS.LTS -e --no-upgrade --source winget {{global.init.winget_install_flags|}}'
  darwin: 'brew install node'
  linux: '{{global.host.os_extra.cmd_sudo}} {{global.host.os_extra.package_manager}} install -y nodejs npm'

install_cmd_version:
  windows: '{{global.winget.qpath}} install --id=OpenJS.NodeJS.LTS -e --version={{simple_version}} --no-upgrade --source winget {{global.init.winget_install_flags|}}'
  darwin: 'brew install node'
  linux: '{{global.host.os_extra.cmd_sudo}} {{global.host.os_extra.package_manager}} install -y nodejs npm'

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21

extra_paths:
  linux:
    - "/home/linuxbrew/.linuxbrew/**"
    - "{{user_home}}/.nvm/versions/node/*/bin"
  darwin:
    - "/opt/homebrew/opt/**"
    - "{{user_home}}/.nvm/versions/node/*/bin"
  windows:
     - "C:\\Program Files\\nodejs\\"
     - "D:\\Program Files\\nodejs\\"
     - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"
