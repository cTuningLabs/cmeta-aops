authors: Grigori Fursin
storage_key: flm

# flm - FastFlowLM (github.com/ROCm/FastFlowLM, MIT): LLMs on the AMD Ryzen AI NPU. The portable Linux
# release is self-contained (the flm wrapper, flm-real, its NPU engines and AMD's XRT runtime with the
# xdna plugin under lib/): no system XRT, no root. It needs a kernel with the amdxdna driver (Linux 6.14+,
# Ubuntu 26.04), NPU firmware 1.1 or newer and an XDNA2 NPU (Strix Point, Strix Halo, Krackan Point,
# Gorgon Point; XDNA1 is not supported on Linux), and a high memory-lock limit (setup-amd-gpu sets it;
# the npu-amd target runs that first). On Windows the zip needs the Ryzen AI NPU driver.
#
#   cx tool setup flm --install              # the pinned release into the cache
#   cx tool run flm -- validate              # the NPU, its firmware, the memory-lock limit
#   cx tool run flm -- list                  # the models it knows (downloaded from Hugging Face on first use)
#   cx program run test-flm --compute=npu-amd
#
# Models go to FLM_MODEL_PATH (test-flm keeps them in the tool's cache entry).

default_version: 1.0.7

names:
  - flm{{global.host.vars.file_ext_exe}}

match_version:
  - regex: "FLM v([0-9]+(?:\\.[0-9]+)+)"
    group: 1

cmd_get_version: '{{tool_path}} version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/ROCm/FastFlowLM'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/v(\d+\.\d+\.\d+)$'

install_help_text: |
  FastFlowLM was not found: "cx tool setup flm --install" downloads the release from
  https://github.com/ROCm/FastFlowLM/releases (Linux x86_64 and Windows x64).

extra_paths:
  linux:
    - "/opt/fastflowlm/bin"
    - "/usr/local/bin"
