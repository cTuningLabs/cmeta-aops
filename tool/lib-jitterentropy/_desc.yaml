# libjitterentropy.a built from the pinned source release with the C compiler of cMeta, into the tool's cache
# entry (api_v1.py, category/tool/api/common_static_lib.py); Linux and macOS.
#
#   cx tool setup lib-jitterentropy

skip_detect: True

names:
  - jitterentropy.h

match_version:
  - regex: '^.*$'
    group: 0

install_help_text: |
  Could not build libjitterentropy.a: see the error above. A version that the tool does not pin needs its
  SHA-256: cx tool setup lib-jitterentropy --version=<version> --with.sha256=<SHA-256 of the source release>
