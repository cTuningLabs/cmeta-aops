# libjitterentropy.a built from the pinned source release with the C compiler of cMeta, into the tool's cache
# entry (api_v1.py, category/tool/api/common_static_lib.py); Linux and macOS.
#
#   cx tool setup lib-jitterentropy

skip_detect: True

names:
  - jitterentropy.h

default_version: '3.7.0'

# The versions that exist: the release tags of smuellerDD/jitterentropy-library (git is set up first)
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/smuellerDD/jitterentropy-library'

cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0

cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+(?:\.\d+)*)(?![\w.-])'

match_version:
  - regex: '^.*$'
    group: 0

install_help_text: |
  Could not build libjitterentropy.a: see the error above. A version that the tool does not pin needs its
  SHA-256: cx tool setup lib-jitterentropy --version=<version> --with.sha256=<SHA-256 of the source release>
