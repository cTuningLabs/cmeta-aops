# Found where a CUDA toolkit or Nsight Systems put it (extra_paths), else installed without root from NVIDIA's
# CUDA redistributable archives (api_v1.py; README.md)
names:
  - nsys{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'

uses:
  - task: runner,1e48cc0c5f6041a5

  - task: setup,a2f9b61079ce4333
    name: cuda,805716c4f32d42cf

extra_paths:
  windows:
    - "C:\\Program Files\\NVIDIA Corporation\\Nsight Systems*\\**\\"
    - "D:\\Program Files\\NVIDIA Corporation\\Nsight Systems*\\**\\"
  # Nsight Systems' own folders (a CUDA toolkit links its bin/nsys to them; a standalone install has its version's
  # bin) - never the nsys that Nsight Compute carries for itself (nsight-compute-*/host/...: no "stats --report"),
  # which a search of the whole toolkit found first by its newer version (2026-11-25, a WSL distribution)
  linux:
    - "/usr/local/cuda/bin"
    - "/usr/local/cuda*/nsight-systems*/bin"
    - "/usr/cuda/bin"
    - "/opt/nvidia/nsight-systems/*/bin"

install_help_text: |
  Nsight Systems: https://developer.nvidia.com/nsight-systems (or a CUDA toolkit, which carries it); then
  "cx tool setup nsys" again.
