names:
  - swift{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'Swift version (\d+(?:\.\d+)*)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/swiftlang/swift'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'swift-(\d+(?:\.\d+)*)-RELEASE'

#package_name: 'swiftlang'

uses:
  - task: setup,a2f9b61079ce4333
    name: msvc,e823256bbbe54b4e
    if: '"{{global.host.os.uname}}" == "windows"'
    with:
      add_env: True

  - task: setup,a2f9b61079ce4333
    name: macosx.sdk,70b0c05382be4e34
    if: '"{{global.host.os.uname}}" == "darwin"'
    with:
      add_env: True

install_uses:
  linux:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_build: True
    - task: setup,a2f9b61079ce4333
      name: tar,788abc644bf24d86
      skip_build: True
    - task: install-sys-tool,38596f32da974d46
      os: linux
      package: gnupg2
      sudo: True
    - task: install-sys-tool,38596f32da974d46
      os: linux
      package: libcurl4-openssl-dev
      sudo: True
    - task: install-sys-tool,38596f32da974d46
      os: linux
      package: pkg-config
      sudo: True

install_cmd:
  linux: '{{global.curl.qpath}} -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz && {{global.tar.qpath}} zxf swiftly-$(uname -m).tar.gz && ./swiftly init --quiet-shell-followup'
  darwin: '{{global.curl.qpath}} -O https://download.swift.org/swiftly/darwin/swiftly.pkg && installer -pkg swiftly.pkg -target CurrentUserHomeDirectory && ~/.swiftly/bin/swiftly init --quiet-shell-followup'
  windows: "{{global.winget.qpath}} install --id=Swift.Toolchain -e --source winget --no-upgrade {{global.init.winget_install_flags|}}"

install_cmd_version:
  linux: '{{global.curl.qpath}} -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz && {{global.tar.qpath}} zxf swiftly-$(uname -m).tar.gz && ./swiftly init --skip-install && ./swiftly install {{simple_version}}'
  darwin: '{{global.curl.qpath}} -O https://download.swift.org/swiftly/darwin/swiftly.pkg && installer -pkg swiftly.pkg -target CurrentUserHomeDirectory && ~/.swiftly/bin/swiftly init --skip-install && ~/.swiftly/bin/swiftly install {{simple_version}}'
  windows: "{{global.winget.qpath}} install --id=Swift.Toolchain -e --source winget --version={{simple_version}} --no-upgrade {{global.init.winget_install_flags|}}"

install_help_text:
  Please check https://www.swift.org/install !

extra_paths:
  linux:
    - "{{user_home}}/.local/share/swiftly/**"
    - "/home/linuxbrew/.linuxbrew/**"
  darwin:
    - "{{user_home}}/Library/Developer/**"
    - "/opt/homebrew/opt/swift*/**"
  windows:
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"
    - "{{global.host.os_env.LOCALAPPDATA}}\\Programs\\**"

features:
  windows:
    flags:
      force_build: 'build'
      exe_file: '-o '
    vars:
      file_ext_exe: .exe
  linux:
    flags:
      force_build: 'build'
      exe_file: '-o '
    vars:
      file_ext_exe: 
  darwin:
    flags:
      force_build: 'build'
      exe_file: '-o '
    vars:
      file_ext_exe: 


