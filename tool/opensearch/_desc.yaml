authors: Grigori Fursin
description: Detect or install OpenSearch with its bundled Java runtime and plugins.
names: [cmeta-opensearch.cmd, opensearch, opensearch.bat]
default_version: '3.9.0'
cmd_get_version: '{{tool_path}} --version'
match_version:
  - regex: 'Version:\s*(\d+\.\d+\.\d+)'
    group: 1
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/opensearch-project/OpenSearch'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/(\d+\.\d+\.\d+)$'
skip_common_install_uses: true
install_help_text: |
  OpenSearch is installed from its official SHA-512 checked archive, including its JDK and plugins.
  No service, demo security configuration or password is created by tool setup.
  Supported archives: Linux x64/arm64 and Windows x64; use --on=wsl or Docker elsewhere.
  See https://opensearch.org/downloads/ and https://docs.opensearch.org/latest/install-and-configure/.
