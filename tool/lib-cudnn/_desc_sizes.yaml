# Disk space of a cuDNN setup in GB (read by task/setup before an install, and by
# "cx tool setup lib-cudnn --sizes"; see docs/cmeta-aops/tool-sizes.md). The install downloads
# NVIDIA's redistributable archive (0.9-1.8 GB) and unpacks it; the archive is removed afterwards.
# peak = during the setup, kept = what stays in the cache. The first matching rule wins.
sizes:
  - if: {method: install, os: windows}
    peak: 5
    kept: 3
  - if: {method: install}
    peak: 4
    kept: 3
  - peak: 0.1
