names:
  - codex{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: '\bcodex-cli\s+(\S+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/openai/codex'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/rust-v(\d[\w.\-]*?)(?:\^\{\})?$'

install_help_text:
  Please install Codex as described at 
    https://github.com/openai/codex !

install_cmd:
  windows: 'powershell -ExecutionPolicy ByPass -c "irm https://chatgpt.com/codex/install.ps1 | iex"'
  linux: '{{global.curl.qpath}} -fsSL https://chatgpt.com/codex/install.sh | sh'
  darwin: '{{global.curl.qpath}} -fsSL https://chatgpt.com/codex/install.sh | sh'

# Specific version via --version=X.Y.Z (install.sh takes --release; install.ps1 reads $env:CODEX_RELEASE).
install_cmd_version:
  windows: 'powershell -ExecutionPolicy ByPass -c "$env:CODEX_RELEASE=''{{simple_version}}''; irm https://chatgpt.com/codex/install.ps1 | iex"'
  linux: '{{global.curl.qpath}} -fsSL https://chatgpt.com/codex/install.sh | sh -s -- --release {{simple_version}}'
  darwin: '{{global.curl.qpath}} -fsSL https://chatgpt.com/codex/install.sh | sh -s -- --release {{simple_version}}'

extra_paths:
  linux:
    - "{{user_home}}/.local/bin"
  darwin:
    - "{{user_home}}/.local/bin"
  windows:
    - "{{global.host.os_env.LOCALAPPDATA}}\\Programs\\OpenAI\\Codex\\**"

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21

