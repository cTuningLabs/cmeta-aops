# Only for Clang: the runtime it links with -fopenmp (libomp.so, libomp.dylib, libomp.dll)

names:
  - libomp{{global.host.vars.file_ext_dlib}}

# The runtime follows the LLVM of the build, as tool/clang-cpp does: another LLVM gets a lib-openmp entry of its
# own, found in its own folders (a "default" entry made with LLVM 22 served the clang 23 builds on the P14s until
# 2026-11-01: the link line pointed at the older LLVM's folder and the loader took the distribution's libomp)
cache_params_use:
  all:
    llvm:
      version: "{{global.llvm.version|}}"
      path: "{{global.llvm.path|}}"

match_version:
  - regex: '^.*$'
    group: 0

# The library folders of the LLVM that provides clang (its home: the parent of its bin), then the
# usual places. Never "<home>/**": a distribution's clang has its home at /usr or /, and a recursive
# search from there never ends.
extra_paths:
  linux:
    - "{{global.llvm.features.paths.home|/home/linuxbrew/.linuxbrew}}/lib"
    - "{{global.llvm.features.paths.home|/home/linuxbrew/.linuxbrew}}/lib/*"
    - "/home/linuxbrew/.linuxbrew/lib"

    # The distribution's libomp-dev (Debian, Ubuntu: /usr/lib/llvm-<N>/lib; Fedora, Arch: /usr/lib64, /usr/lib)
    - "/usr/lib/llvm-*/lib"
    - "/usr/lib/*-linux-gnu"
    - "/usr/lib64"
    - "/usr/lib"

  darwin:
    - "{{global.llvm.features.paths.home|/opt/homebrew/opt/llvm}}/lib"
    - "/opt/homebrew/opt/libomp/lib"
    - "/opt/homebrew/opt/llvm/lib"
  windows:
    - "{{global.llvm.features.paths.home|C:\\Program Files\\LLVM}}\\bin"
    - "{{global.llvm.features.paths.home|C:\\Program Files\\LLVM}}\\lib"
    - "C:\\Program Files\\LLVM\\bin"

package_name: 'libomp-dev'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install libomp'

