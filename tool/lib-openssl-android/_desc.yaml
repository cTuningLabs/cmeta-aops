skip_detect: True

default_version: 4.0.0

cache_params_with: False # Otherwise add various flags that mix up cache detection

cache_meta_const:
  params:
    target_abi: '{{local.target_abi}}'

names:
  - opensslv.h

match_version: 
  - regex: '^.*$'
    group: 0

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/217heidai/openssl_for_android'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/(?:[A-Za-z0-9_.-]*[-v])?([^^\s]+)(?:\^\{\})?$'

uses:
  - task: target,94decb2ddd28441f
