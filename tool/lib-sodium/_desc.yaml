authors: Grigori Fursin

# libsodium in the tool's own cache entry, the same way on Linux, macOS and Windows: upstream's
# release of the pinned version, checked against the SHA-256 pinned below, with the static and the
# shared library side by side (api_v1.py). Nothing goes into the system, no package manager is asked.
#
#   cx tool setup lib-sodium                       # the pinned release into the cache
#   cx tool setup lib-sodium --version=1.0.21      # another release this file pins
#   cx tool setup lib-sodium --with.check-         # Linux, macOS: without upstream's test suite
#   cx tool setup lib-sodium --with.toolset=v143   # Windows: the libraries of this MSVC toolset
#   cx tool setup lib-sodium --tool_path=<prefix>/include/sodium.h     # a libsodium that is already there
#
# setup-compile links every global key that starts with "lib-", so a program that sets up
# "lib-sodium" gets the include folder and the library with no further wiring: the shared library
# for a dynamic build, the static one (by its path) for --compile.static.

# The pinned release in the cache; a libsodium that is already there only when its sodium.h is named
skip_detect: True

names:
  - sodium.h

default_version: '1.0.22'

# One cache entry per version serves the static and the dynamic build: no with.* word is part of
# what makes an entry
cache_params_with: False

# The versions that exist: the release tags of jedisct1/libsodium (git is set up first)
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/jedisct1/libsodium'

cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0

cmd_get_versions_regex: '\brefs/tags/(\d+\.\d+\.\d+)-RELEASE(?![\w.-])'

match_version:
  - regex: '^.*$'
    group: 0

# What a release is made of. A new version is an edit of this block: its two SHA-256 (GitHub
# publishes them for the files of a release: "digest" in
# https://api.github.com/repos/jedisct1/libsodium/releases) and, when it works, default_version.
release:

  # Where the files are, in the order they are tried
  urls:
    - 'https://github.com/jedisct1/libsodium/releases/download/{version}-RELEASE/{file}'
    - 'https://download.libsodium.org/libsodium/releases/{file}'

  files:
    source: 'libsodium-{version}.tar.gz'      # Linux, macOS: built with its configure and make
    msvc: 'libsodium-{version}-msvc.zip'      # Windows: upstream's libraries for MSVC (clang links them too)

  sha256:
    '1.0.22':
      source: 'adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349'
      msvc: '3e03a726fac4bc09cb61d8f29d658ef7a5eca0811de59082130414f7ca2e4279'
    '1.0.21':
      source: '9e4285c7a419e82dedb0be63a72eea357d6943bc3e28e6735bf600dd4883feaf'
      msvc: '0bb510c1bc3dbcd2212f4be348ca97fc94f258658f5a40ec462b1fa8500ecb4b'

  # The source folder inside the source release
  source_dir: 'libsodium-{version}'

  # What configure gets besides --prefix: position-independent objects in the static library too,
  # so that it links into a position-independent program (the default of today's distributions)
  configure:
    - '--disable-dependency-tracking'
    - '--with-pic'

  # The folder of the MSVC package for each architecture of cMeta (host.os.uarch)
  msvc_arch:
    amd64: 'x64'
    arm64: 'ARM64'

install_help_text: |
  Could not install libsodium into the cache: see the error above.
  A version that _desc.yaml does not pin needs the SHA-256 of its file:
    cx tool setup lib-sodium --version=<version> --with.sha256=<SHA-256>
  (Linux, macOS: of libsodium-<version>.tar.gz; Windows: of libsodium-<version>-msvc.zip).
  Linux and macOS build it from source: a C compiler and make are needed.
