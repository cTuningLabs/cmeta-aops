names:
  - tar{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'bsdtar\s+(\d+\.\d+\.\d+)'
    group: 1
  - regex: 'tar \(GNU tar\)\s+(\d+(?:\.\d+)+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

package_name: tar

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'

install_cmd_version:
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'

