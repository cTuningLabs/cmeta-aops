storage_key: msvc

names:
  - cl.exe

cache_params_use: 
  windows:
    microsoft-sdk:
      version: "{{global.microsoft-sdk.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-sdk.path}}" 
    microsoft-visual-studio:
      version: "{{global.microsoft-visual-studio.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-visual-studio.path}}" 

match_version: 
  - regex: 'version\s*([\d.]+)'
    group: 1

cmd_get_version: 'cl.exe'

uses:
  - task: setup,a2f9b61079ce4333
    name: microsoft.visual-studio,b30299aeb2bd4c6e

features:
  windows:
    flags:
      catch_errors: '/EHsc'
      include_path: '/I '
      dynamic_build: '/MD'
      static_build: '/MT'
      dynamic_build_debug: '/MDd'
      static_build_debug: '/MTd'
      obj_file: '/Fo:'
      exe_file: '/out:'
      lib_file: '/OUT:'
      lib_file2: '/IMPLIB:'
      link_sep: '/link'
      lib_path: '/LIBPATH:'
      lib_prefix: ''
      lib_prefix2: 'lib'
      lib_postfix: '.lib'
      openmp: '/openmp'
      fast: '/O2 /Ob2 /Oi /Ot /GL'
      fastest: '/O2 /Ob2 /Oi /Ot /GL'
      profile: '/Zi'
      link_profile: '/PROFILE'
      compile_to_obj: '/c'
      d: '/D'
      lib_dynamic_build: '/LD'
      lib_static_build: '/c'
      lib_dynamic_build_debug: '/LDd'
      lib_static_build_debug: '/c /Zi'
      static_lib1: ''
      static_lib2: '/OUT:'
    vars:
      file_ext_exe: .exe
      file_ext_lib: .lib
      file_ext_lib2: .lib
      file_ext_dlib: .dll
      file_ext_obj: .obj
