names:
  - claude{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: '([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/anthropics/claude-code'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/v([\d.]+)(?:\^\{\})?$'

install_help_text:
  Please install "claude" tool as described at 
    https://code.claude.com/docs/en/quickstart !

install_cmd:
  windows: '{{global.curl.qpath}} -fsSL https://claude.ai/install.cmd -o install.cmd && install.cmd && del install.cmd'
  linux: '{{global.curl.qpath}} -fsSL https://claude.ai/install.sh | bash'
  darwin: '{{global.curl.qpath}} -fsSL https://claude.ai/install.sh | bash'

# Specific version via --version=X.Y.Z (the claude installer accepts a version arg).
install_cmd_version:
  windows: '{{global.curl.qpath}} -fsSL https://claude.ai/install.cmd -o install.cmd && install.cmd {{simple_version}} && del install.cmd'
  linux: '{{global.curl.qpath}} -fsSL https://claude.ai/install.sh | bash -s -- {{simple_version}}'
  darwin: '{{global.curl.qpath}} -fsSL https://claude.ai/install.sh | bash -s -- {{simple_version}}'

extra_paths:
  linux:
    - "{{user_home}}/.local/bin"
  darwin:
    - "{{user_home}}/.local/bin"
  windows:
    - "{{global.host.os_env.USERPROFILE}}\\.local\\bin"

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21

