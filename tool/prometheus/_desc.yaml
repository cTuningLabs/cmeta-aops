authors: Grigori Fursin
description: Detect or install Prometheus (with promtool) from the official checked release archive.

names:
  - prometheus{{global.host.vars.file_ext_exe}}

default_version: '3.16.0'

cmd_get_version: '{{tool_path}} --version'
match_version:
  - regex: 'prometheus, version (\d+\.\d+\.\d+)'
    group: 1

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/prometheus/prometheus'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'

skip_common_install_uses: true

install_help_text: |
  Prometheus is installed from its official release archive on GitHub (checked with the release's sha256sums.txt),
  the whole distribution kept: prometheus and promtool side by side. Nothing is started: a server is the task
  run-prometheus-server. Choose a version with:
    cx tool setup prometheus --version=3.16.0
  See https://prometheus.io/download/ and the distribution's LICENSE (Apache-2.0).
