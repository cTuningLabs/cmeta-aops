# GNU tar as a tool of its own (2026-11-12): the archives of "cx host archive" need its --listed-incremental,
# --checkpoint and --anchored, which the bsdtar of macOS and Windows lack. Linux has it as "tar"; macOS gets it
# from Homebrew as "gtar" (the "tar" there stays bsdtar); Windows has none - a Windows machine archives itself
# with its own archiver (Python's tarfile). The version is matched on "GNU tar" alone: a bsdtar found first is no match.

names:
  - gtar{{global.host.vars.file_ext_exe}}
  - tar{{global.host.vars.file_ext_exe}}

match_version:
  - regex: 'tar \(GNU tar\)\s+(\d+(?:\.\d+)+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

package_name: tar

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install gnu-tar'

requires_sudo:
  linux: True

extra_paths:
  darwin:
    - '/opt/homebrew/opt/gnu-tar/libexec/gnubin'
    - '/opt/homebrew/bin'
    - '/usr/local/opt/gnu-tar/libexec/gnubin'
    - '/usr/local/bin'

install_help_text: |
  Could not install GNU tar automatically: Linux has it as the package "tar", macOS as "gnu-tar" of Homebrew
  (brew install gnu-tar; then run "cx tool setup gnu-tar" again). Windows has no GNU tar: a Windows machine archives
  itself with cMeta's own archiver (Python), and reads archives with Windows' own tar (bsdtar) or 7-Zip.
