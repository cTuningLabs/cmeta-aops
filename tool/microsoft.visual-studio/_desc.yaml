names:
  - vcvars{{global.host.os.bits}}{{global.host.vars.file_ext_bat}}

cache_params_use: 
  windows:
    microsoft-sdk:
      version: "{{global.microsoft-sdk.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-sdk.path}}"

match_version: 
  - regex: 'version\s*([\d.]+)'
    group: 1

cmd_call_script: '{{tool_path}} {{global.microsoft-sdk.version}} '

cmd: ''
cmd_get_version: 'cl.exe'

uses:
  - task: setup,a2f9b61079ce4333
    name: microsoft.sdk,8a47d88b2b974243

# api_v1.py find_paths() lists the installations with vswhere and the usual folders (Program
# Files and Program Files (x86), C: and D:); these recursive searches are the last resort
extra_paths:
  windows:
    - "C:\\Program Files\\Microsoft Visual Studio\\**"
    - "D:\\Program Files\\Microsoft Visual Studio\\**"

# Visual Studio Build Tools with the C++ workload (MSVC, the Windows SDK, CMake) through winget:
#   cx tool setup microsoft.visual-studio --install                 # the newest (2026)
#   cx tool setup microsoft.visual-studio --install --with.year=2022
# The Visual Studio installer asks for administrator rights (UAC).
install_cmd:
  windows: '{{global.winget.qpath}} install --id=@VS_BUILD_TOOLS@ -e --source winget {{global.init.winget_install_flags|}} --override "--quiet --wait --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"'

install_help_text: |
  Could not install Visual Studio Build Tools automatically: install them from
  https://visualstudio.microsoft.com/downloads/ (Tools for Visual Studio, Build Tools) with the
  "Desktop development with C++" workload, and run "cx tool setup microsoft.visual-studio" again.

win_only: True

