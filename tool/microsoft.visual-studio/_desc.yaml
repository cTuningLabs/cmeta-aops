names:
  - vcvars{{global.host.os.bits}}{{global.host.vars.file_ext_bat}}

cache_params_use: 
  windows:
    microsoft-sdk:
      version: "{{global.microsoft-sdk.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-sdk.path}}"

match_version: 
  - regex: 'version\s*([\d.]+)'
    group: 1

cmd_call_script: '{{tool_path}} {{global.microsoft-sdk.version}} '

cmd: ''
cmd_get_version: 'cl.exe'

uses:
  - task: setup,a2f9b61079ce4333
    name: microsoft.sdk,8a47d88b2b974243

extra_paths:
  windows:
    - "C:\\Program Files\\Microsoft Visual Studio\\**"
    - "D:\\Program Files\\Microsoft Visual Studio\\**"
