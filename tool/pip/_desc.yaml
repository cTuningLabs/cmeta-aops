authors: Grigori Fursin
copyright: 2025-2026 Grigori Fursin and cTuning Labs. See the COPYRIGHT and LICENSE files in the project root for details.
storage_key: 'pip-{{params.with.package}}'

artifact_print_name: 'pip ({{params.with.package|-}},{{params.arg3|}})'

can_have_sub_tool: True # Can have sub tools pip-{name}

cache_params_with: False # Otherwise add various flags that mix up cache detection

cache_params:
  - with.package

cache_params_use: 
  all:
    python:
      version: "{{global.python.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.python.path}}" # Path can be from the different venv

cache_features:
  - with.extras
  - with.variations

match_version: 
  - regex: "version: (.+)"
    group: 1

path: "{{global.pip.path}}"
cmd: "{{global.pip.cmd}}"
cmd_filename: "{{global.python.filename}} -m pip"
cmd_get_version: '{{global.pip.cmd}} show {{params.with.package}}'
cmd_get_versions: '{{global.pip.cmd}} index versions {{params.with.package}}'


uninstall_cmd:
  all: '{{global.pip.cmd}} uninstall {{params.with.uninstall_flags|}} {{custom_package}} {{params.with.uninstall_post_flags|}}'
install_cmd:
  all: '{{global.pip.cmd}} install {{params.with.flags|}} {{custom_package}} {{params.with.post_flags|}}'
install_cmd_version:
  all: '{{global.pip.cmd}} install {{params.with.flags|}} {{custom_package}}{{custom_version}} {{params.with.post_flags|}}'

uses:
  - task: setup,a2f9b61079ce4333
    name: python-pip,28399f0bb52c4148

