storage_key: 'pip-{{params.with.package}}'

cache_params:
  - package
  - "@version"                  # Treat @keys such as this version as fuzzy versions or versions with conditions during cMeta search!

cache_params_with: True

cache_params_use: 
  python:
    version: "{{global.python.version}}" # This version must be already resolved here, therefore not fuzzy

match_version: 
  - regex: "version: (.+)"
    group: 1

path: "{{global.pip.path}}"
cmd: "{{global.pip.cmd}}"
cmd_filename: "{{global.python.filename}} -m pip"
cmd_get_version: '{{global.pip.cmd}} show {{params.with.package}}'

install_cmd:
  all: "{{global.pip.cmd}} install {{params.with.flags|}} {{params.with.package}}"
install_cmd_version:
  all: '{{global.pip.cmd}} install {{params.with.flags|}} "{{params.with.package}}{{pip_version}}"'

uses:
  - task: setup,a2f9b61079ce4333
    name: python-pip,28399f0bb52c4148
