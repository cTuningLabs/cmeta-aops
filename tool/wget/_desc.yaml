names:
  - wget{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'GNU Wget (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

package_name: 'wget'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install wget'
  windows: "{{global.winget.qpath}} install JernejSimoncic.Wget -e --no-upgrade {{global.init.winget_install_flags|}}"

install_cmd_version:
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'
  darwin: '{{global.brew.qpath}} install wget@{{major_version}}'
  windows: "{{global.winget.qpath}} install JernejSimoncic.Wget -e --version={{simple_version}} --no-upgrade {{global.init.winget_install_flags|}}"
