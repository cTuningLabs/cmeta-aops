skip_detect: True

name: libxopenme

match_version: 
  - regex: '^.*$'
    group: 0

build_local:
  target_sub_dir: 'build'

cache_meta_const:
  params:
    with:
      compute: '{{local.compute}}'
      static: '{{params.with.static|$False}}'
      debug_info: '{{params.with.debug_info|$False}}'
    target_abi: '{{local.target_abi}}'
#    Can't pick up compiler (too early or picks up the wrong one from the higher pipeline 
#      that is nothing to do with the lower one)
#    compiler_path: '{{global.compiler.path|$None}}'
#    compiler_version: '{{global.compiler.version|$None}}'

build_uses:
  all:
    - task: compile-and-run-program,05437a1aae224270
      name: lib-xopenme,5298772417f54247
      compute: '{{params.with.compute|$[]}}'
      clean: True
      compile:
        static: True
        debug_info: '{{params.with.debug_info|$None}}'
      target_path: '{{local.target_path}}//lib//static'

    - task: compile-and-run-program,05437a1aae224270
      name: lib-xopenme,5298772417f54247
      compute: '{{params.with.compute|$[]}}'
      clean: True
      compile:
        static: False
        debug_info: '{{params.with.debug_info|$None}}'
      target_path: '{{local.target_path}}//lib//dynamic'
    
