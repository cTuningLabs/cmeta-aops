# Hermes Agent ("hermes": https://hermes-agent.nousresearch.com, https://github.com/NousResearch/hermes-agent, MIT),
# Nous Research's open-source agent: a Python CLI with a learning loop (it writes skills from experience), a
# persistent memory, skills in the agentskills.io format, and many inference providers - Nous Portal (OAuth, a free
# tier), Anthropic (a Claude Code login on Claude Max, or ANTHROPIC_API_KEY), OpenAI Codex (OAuth), OpenRouter and the
# other API-key providers, GitHub Copilot, and any OpenAI-compatible endpoint (llama.cpp, Ollama, vLLM, LM Studio).
#
# Install strategy: the official installer, downloaded first and then run (so it can be read before it runs),
# non-interactive and without the browser and computer-use drivers (heavy; "hermes pm install agent-browser" adds
# them later). It clones the code under <HERMES_HOME>/hermes-agent (~/.hermes, %LOCALAPPDATA%\hermes on Windows),
# brings its own uv, Python 3.14 and Node through its package manager "pm", and publishes the "hermes" command as
# a shim in ~/.local/bin (Linux, macOS) or %LOCALAPPDATA%\hermes\bin (Windows: hermes.cmd + hermes.ps1), which is
# where cMeta finds it (extra_paths). HERMES_HOME keeps the user's config, keys, skills, memory and sessions
# (state.db), like ~/.claude for Claude Code: cMeta never moves it. No administrator rights are needed.
# The PyPI package "hermes-agent" (0.19.0, Python < 3.14) is an older distribution and is not used.
# Checked 2026-10-07 on Ubuntu 24.04 (install 2 min 27 s, v0.21.5 = release 2026.9.24).
names:
  - hermes
  - hermes.cmd

# "hermes --version" prints "Hermes Agent v0.21.5+8859.g0e21933 (2026.9.24) · upstream 0e219331": the version in
# brackets is the release (the git tags are v2026.9.24), the one after "v" is the package's own number
match_version:
  - regex: '\((\d{4}\.\d{1,2}\.\d{1,2})\)'
    group: 1
  - regex: 'v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/NousResearch/hermes-agent'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/v(\d{4}\.\d{1,2}\.\d{1,2})(?:\^\{\})?$'

install_help_text: |
  Could not install Hermes Agent automatically.
  Install it per https://hermes-agent.nousresearch.com/docs/getting-started/installation
    Linux, macOS, WSL2:  curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
    Windows (PowerShell): iex (irm https://hermes-agent.nousresearch.com/install.ps1)
  then open a new terminal and retry "cx tool setup hermes".

# The installer is downloaded first and then run: non-interactive (no setup wizard, no gateway questions), without
# the browser tools and the computer-use driver. It writes the shim and adds its folder to the PATH of new shells
# (~/.local/bin in the shell profiles; the user PATH in the registry on Windows); cMeta does not need that PATH.
install_cmd:
  linux: '{{global.curl.qpath}} -fsSLo install-hermes.sh https://hermes-agent.nousresearch.com/install.sh && bash install-hermes.sh --non-interactive --skip-browser --skip-computer-use && rm -f install-hermes.sh'
  darwin: '{{global.curl.qpath}} -fsSLo install-hermes.sh https://hermes-agent.nousresearch.com/install.sh && bash install-hermes.sh --non-interactive --skip-browser --skip-computer-use && rm -f install-hermes.sh'
  windows: '{{global.curl.qpath}} -fsSLo install-hermes.ps1 https://hermes-agent.nousresearch.com/install.ps1 && powershell -NoProfile -ExecutionPolicy Bypass -File install-hermes.ps1 -NonInteractive -SkipBrowser -SkipComputerUse && del install-hermes.ps1'

# A release is a git tag (v2026.9.24): the installer clones that tag with --branch
install_cmd_version:
  linux: '{{global.curl.qpath}} -fsSLo install-hermes.sh https://hermes-agent.nousresearch.com/install.sh && bash install-hermes.sh --branch v{{simple_version}} --non-interactive --skip-browser --skip-computer-use && rm -f install-hermes.sh'
  darwin: '{{global.curl.qpath}} -fsSLo install-hermes.sh https://hermes-agent.nousresearch.com/install.sh && bash install-hermes.sh --branch v{{simple_version}} --non-interactive --skip-browser --skip-computer-use && rm -f install-hermes.sh'
  windows: '{{global.curl.qpath}} -fsSLo install-hermes.ps1 https://hermes-agent.nousresearch.com/install.ps1 && powershell -NoProfile -ExecutionPolicy Bypass -File install-hermes.ps1 -Branch v{{simple_version}} -NonInteractive -SkipBrowser -SkipComputerUse && del install-hermes.ps1'

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21

# Where the installer puts the shim (single quotes: the backslashes are literal); HERMES_HOME moves the Windows one
extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
  darwin:
    - '{{user_home}}/.local/bin'
  windows:
    - '{{global.host.os_env.HERMES_HOME|}}\bin'
    - '{{global.host.os_env.LOCALAPPDATA}}\hermes\bin'
