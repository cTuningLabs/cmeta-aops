authors: Grigori Fursin

# The Apache HTTP Server. Its binary is apache2 on Debian and Ubuntu (apache2ctl next to it) and httpd elsewhere:
# the RPM distributions, Homebrew on macOS, Apache Lounge's build on Windows.
names:
  - apache2
  - httpd{{global.host.vars.file_ext_exe}}

extra_paths:
  linux:
    - /usr/sbin
    - /usr/local/apache2/bin
  darwin:
    - /opt/homebrew/bin
    - /usr/local/bin
    - /usr/sbin
  windows:
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\ApacheLounge.httpd*\\**"
    - "C:\\Apache24\\bin"
    - "C:\\Program Files**\\Apache**\\bin"

# "Server version: Apache/2.4.65 (Ubuntu)"
cmd_get_version: '{{tool_path}} -v'
match_version:
  - regex: 'Apache/(\d+\.\d+\.\d+)'
    group: 1

# The releases (github.com/apache/httpd tags of the 2.4 line); a package manager installs its distribution's version
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/apache/httpd'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/(2\.4\.\d+)$'
default_version: '2.4.69'

# The package: apache2 on Debian, Ubuntu, SUSE and Alpine, httpd on the RPM distributions (Rocky, Alma, CentOS, Fedora,
# Amazon Linux and Azure Linux are like fedora or rhel), apache on Arch
package_name: apache2
package_name_os_id:
  fedora: httpd
  rhel: httpd
  azurelinux: httpd
  mariner: httpd
  arch: apache

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install httpd'
  windows: '{{global.winget.qpath}} install --id=ApacheLounge.httpd -e --no-upgrade --source winget {{global.init.winget_install_flags|}}'

requires_sudo:
  linux: True

# After the package (api_v1.py post_install, Linux with systemd): the service enabled and started - the Debian package
# starts it by itself, the RPM ones do not
services:
  apache2: [apache2, httpd]

install_help_text: |
  Apache HTTP Server: "cx tool setup apache2 --install" takes the distribution's package (apache2 on Debian and Ubuntu,
  httpd on the RPM distributions; sudo), Homebrew's httpd on macOS, Apache Lounge's build through winget on Windows
  (it needs the Visual C++ runtime). A certificate for it: cx task run setup-ssl-certificate.
