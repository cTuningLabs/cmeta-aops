authors: Grigori Fursin

# kwokctl and kwok, Kubernetes without kubelets - https://kwok.sigs.k8s.io (Apache-2.0).
#
# Installed from the pinned upstream release (install ladder tier 1) by the shared helper
# category/tool/api/common_release.py: the asset for this OS and CPU, its SHA-256 checked where
# upstream publishes checksums, the binary unpacked and named "kwokctl". An installation already
# on the PATH (or in extra_paths) is detected and used first.
#
#   cx tool setup kwokctl                         # detect, else install the pinned release
#   cx tool setup kwokctl --version=<x.y.z> --new # another release
#   cx tool setup kwokctl --versions              # the released versions
#
# Quick checks:
#   cx tool run kwokctl -- --version
#   cx tool run kwokctl -- create cluster --name cx-test   (Docker)   then   cx tool run kwokctl -- scale node --replicas 100 --name cx-test   ...   cx tool run kwokctl -- delete cluster --name cx-test

names:
  - kwokctl{{global.host.vars.file_ext_exe}}

default_version: '0.8.0'

match_version:
  - regex: 'v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/kubernetes-sigs/kwok'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_help_text: |
  Could not install kwokctl from its release automatically on this system.
  Install it as described at https://kwok.sigs.k8s.io and run "cx tool setup kwokctl" again.
