note: 'kwok simulates the lifecycle of nodes and pods, so one laptop can host a cluster
  of hundreds or thousands of fake nodes (with any capacity, including fake GPUs)
  for scheduler, placement and controller tests. kwokctl creates such clusters (runtime:
  Docker, Podman, or kwok''s binary runtime on Linux and macOS); the kwok binary is
  installed next to it.'
