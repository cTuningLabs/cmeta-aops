authors: Grigori Fursin

# NVIDIA OpenShell - https://github.com/NVIDIA/OpenShell (Apache-2.0): runs AI agents in sandboxes (Docker, Podman or
# micro-VMs) under a YAML policy for files, processes, network and credentials. Two binaries: the CLI "openshell" and
# the gateway "openshell-gateway" (the control plane the CLI talks to).
#
# Installed from the pinned upstream release (install ladder tier 1; api_v1.py with category/tool/api/common_release.py):
# the static CLI (openshell-<cpu>-unknown-linux-musl.tar.gz, -apple-darwin on macOS) and the gateway
# (openshell-gateway-<cpu>-unknown-linux-gnu.tar.gz: glibc 2.28 or newer), both checked against the release's
# SHA-256 lists, into the cache entry - no package, no service, no root. An installation on the PATH (the deb/rpm or
# snap of upstream's install.sh, Homebrew) is detected first. Upstream publishes nothing for Windows (WSL2 is its
# way: --on=wsl) nor for Intel Macs.
#
#   cx tool setup openshell                        # detect, else install the pinned release
#   cx tool setup openshell --versions             # the released versions
#   cx tool run openshell -- --help
#   cx task run run-openshell-gateway start|status|test|stop    # a local gateway of this user, and a test sandbox

names:
  - openshell

default_version: '0.1.4'

match_version:
  - regex: 'openshell (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

# The tags of the stable releases (v0.1.4); "dev" is the rolling build
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/NVIDIA/OpenShell'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'

extra_paths:
  linux:
    - '/usr/bin'
    - '/usr/local/bin'
    - '/snap/bin'
    - '{{user_home}}/.local/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'

# The download needs nothing; the rest is the help text (Windows: WSL2, an Intel Mac: none)
skip_common_install_uses: True

install_help_text: |
  Could not set up NVIDIA OpenShell here. It runs on Linux (x86_64, aarch64; the gateway needs glibc 2.28 or newer)
  and macOS on Apple Silicon, with Docker, Podman or host virtualization; on Windows run it in WSL2:
    cx tool setup openshell --on=wsl
  or install it as upstream does: curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
