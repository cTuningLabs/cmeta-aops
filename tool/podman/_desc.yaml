names:
  - podman{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'version ([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

# On Linux the distribution's own Podman (rootless, no service); on macOS Homebrew's; on Windows winget's
package_name: 'podman'

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install podman'
  windows: "{{global.winget.qpath}} install --id=RedHat.Podman -e --no-upgrade --source winget {{global.init.winget_install_flags|}}"

# Windows: the winget install needs administrator rights.
# RedHat.Podman: a per-machine bundle only.
# A quiet run (-q) that is not elevated does not start it (task/setup/install.py, unattended_rights);
# without -q, Windows asks (UAC).
requires_sudo:
  linux: True
  windows: True

install_help_text: |
  Podman was not found: "cx tool setup podman --install" (the distribution's package on Linux, Homebrew on
  macOS, winget on Windows), or https://podman.io/docs/installation.

extra_paths:
  windows:
    - "C:\\Program Files\\RedHat\\Podman\\**"
    - "D:\\Program Files\\RedHat\\Podman\\**"
  linux:
    - "/usr/local/**"

