copyright: 2025-2026 Grigori Fursin and cTuning Labs. See the COPYRIGHT and LICENSE files in the project root for details.
storage_key: icpx

names:
  - icpx{{global.host.vars.file_ext_exe}}

cache_params_use: 
  windows:
    microsoft-sdk:
      version: "{{global.microsoft-sdk.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-sdk.path}}" 
    microsoft-visual-studio:
      version: "{{global.microsoft-visual-studio.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-visual-studio.path}}" 
    oneapi:
      version: "{{global.oneapi.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.oneapi.path}}" 
    icx:
      version: "{{global.icx.version}}"
      path: "{{global.icx.path}}"
  linux:
    icx:
      version: "{{global.icx.version}}"
      path: "{{global.icx.path}}"


match_version: 
  - regex: 'oneAPI.*?Compiler\s+\d+\.\d+\.\d+\s*\(\s*(\d+\.\d+\.\d+\.\d+)\s*\)'
    group: 1

cmd_get_version: 'icpx{{global.host.vars.file_ext_exe}} --version'

uses:
  - task: force-fail,fbc834fe54894aec
    if: '"{{global.host.os.uname}}" == "darwin"'
    text: 'task "{{task_artifact_alias}} icpx" is not supporting MacOS'

  - task: setup,a2f9b61079ce4333
    name: oneapi,3d44b79b6a2b476c

  - task: setup,a2f9b61079ce4333
    name: icx,15789d59a5534055
    version: "{{params.version|$None}}"


install_help_text:
  Please install intel compilers from https://www.intel.com/content/www/us/en/developer/tools/oneapi/overview.html !

features:
  windows:
    id: Intel
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: '-fms-runtime-lib=static'
      dynamic_build_debug: '-g'
      static_build_debug: '-fms-runtime-lib=static -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '/Fe:'
      lib_file2: '-Wl,/IMPLIB:'
      link_sep: ''
      lib_path: '-Wl,/LIBPATH:'
      lib_prefix: '-Wl,'
      lib_prefix2: 'lib'
      lib_postfix: '.lib'
      openmp: '-qopenmp'
      fast: '-O3'
      fastest: '-O3 -ffast-math -xHost'
      profile: '-gcodeview -fno-omit-frame-pointer'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '/LD'
      lib_static_build: '/c'
      lib_dynamic_build_debug: '/LDd'
      lib_static_build_debug: '/c /Zi'
      static_lib1: ''
      static_lib2: '/OUT:'
    vars:
      file_ext_exe: .exe
      file_ext_lib: .lib
      file_ext_lib2: .lib
      file_ext_dlib: .dll
      file_ext_obj: .obj
  linux:
    id: Intel
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static'
      dynamic_build_debug: '-g'
      static_build_debug: '-static -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: '-qopenmp'
      fast: '-O3'
      fastest: '-O3 -ffast-math -xHost'
      profile: '-fno-omit-frame-pointer'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-shared -fPIC'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-shared -fPIC -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe:
      file_ext_lib: .a
      file_ext_lib2: .a
      file_ext_dlib: .so
      file_ext_obj: .o

