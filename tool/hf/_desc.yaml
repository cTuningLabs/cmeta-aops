names:
  - hf{{global.host.vars.file_ext_exe}}

cache_params_use: 
  all:
    pip-huggingface:
      version: "{{global.pip-huggingface_hub.version}}"
      path: "{{global.pip.path}}"

match_version: 
  - regex: 'version: (.+)'
    group: 1

cmd_get_version: '{{global.pip.cmd}} show huggingface_hub'

uses:
  - task: setup,a2f9b61079ce4333
    name: pip,c4987bc3955347f2
    version: "{{params.version|$None}}"
    with:
      package: huggingface_hub

# The key of the config artifact "task" this tool reads.

configs:
  task:
    keys:
      hf.cache:
        desc: 'the Hugging Face cache (HF_HOME of the hf tool and of what runs with it): one folder, or several separated
          by ; on Windows (: elsewhere) - the first one that exists or can be made'
        type: path
        example: D:\hf-cache
