names:
  - docker{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'version ([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

# The versions Docker's client publishes (github.com/docker/cli tags) - the static archives below follow them
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/docker/cli'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

# macOS and Windows (api_v1.py, since 2026-10-15): the Docker CLIENT of this version from Docker's static release
# archives (download.docker.com/<mac|win>/static/stable), for a machine whose daemon runs elsewhere - colima
# (tool/colima) or Docker Desktop on a Mac, an engine behind a docker context or DOCKER_HOST. Docker Desktop, when
# installed, is detected first (extra_paths). "cx tool setup docker --versions" lists the releases.
default_version: '29.9.1'

# On Linux the distribution's own Docker (docker.io on Debian and Ubuntu, docker on Fedora: the engine and
# the CLI, enabled as a service by the package); the socket needs the "docker" group, which the post_install
# hook of api_v1.py gives the user after the install (a new login applies it); the same hook installs the
# buildx plugin (docker-buildx on Debian and Ubuntu), which the package leaves out and BuildKit builds need.
package_name: 'docker.io'
package_name_os_id:
  fedora: docker
  rhel: docker
  arch: docker
  opensuse: docker

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'

requires_sudo:
  linux: True

install_help_text: |
  Docker was not found. Linux: "cx tool setup docker --install" takes the distribution's package (docker.io
  on Ubuntu and Debian); Windows and macOS: Docker Desktop (https://www.docker.com/products/docker-desktop/),
  or the client alone with "cx tool setup docker --install" plus a daemon (colima on a Mac: "cx tool setup colima").

extra_paths:
  windows:
    - "C:\\Program Files\\Docker\\Docker\\**"
    - "D:\\Program Files\\Docker\\Docker\\**"
  linux:
    - "/usr/local/**"
  darwin:
    - "/usr/local/bin"
    - "/opt/homebrew/bin"
    - "{{user_home}}/.docker/bin"

