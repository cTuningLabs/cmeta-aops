# Ray (https://www.ray.io, Apache-2.0): distributed Python - tasks and actors across machines,
# Ray Train, Tune, Data and Serve, and the cluster vLLM and SGLang use for multi-node inference.
# Detected on the PATH, else installed in its own Python environment ("ray[default]", api_v1.py).
# Every node of a cluster needs the same Ray and the same Python patch release: the pins (Ray
# 2.59.0, Python 3.12.14, which uv downloads) give them on every machine.
#
#   cx tool setup ray
#   cx tool run ray -- start --head --port=6379                        # the head node
#   cx tool run ray -- start --address=<head>:6379                     # each worker node
#   cx tool run ray -- status
#   cx tool run ray -- stop
#
# Linux (x86_64, aarch64), macOS (Apple silicon) and Windows (a single node: Ray does not support
# Windows machines in a multi-node cluster).

names:
  - ray{{global.host.vars.file_ext_exe}}

default_version: '2.59.0'

match_version:
  - regex: 'version (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/ray-project/ray'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/ray-(\d+\.\d+\.\d+)(?![\w.-])'

install_help_text: |
  Could not install Ray automatically. Install it with "pip install ray[default]" (the same
  version on every node of a cluster) and run "cx tool setup ray" again.
