names:
  - brew{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: 'Homebrew\s+([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

install_cmd:
  linux: '/bin/bash -c "$({{global.curl.qpath}} -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
  darwin: '/bin/bash -c "$({{global.curl.qpath}} -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'

skip_common_install_uses: True

install_uses:
  linux:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_build: True
    - task: setup,a2f9b61079ce4333
      name: git,959d8c0fbc004bd0
      skip_build: True
  darwin:
    # Git should be installed by brew installer via xcode if not installed ...
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_install: True # Available on MacOS by default!
      skip_build: True

requires_sudo:
  linux: True
  darwin: True

extra_paths:
  linux:
    - "/home/linuxbrew/.linuxbrew/bin"
