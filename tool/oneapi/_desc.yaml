# Intel oneAPI: the environment of an installed release (its script oneapi-vars), which the Intel compilers icx and
# icpx (DPC++/C++ with SYCL) and the xpu target stand on. Detected where Intel installs and in the cMeta cache;
# installed from Intel's "Deep Learning Essentials" - the oneAPI package Intel publishes for building PyTorch for
# its GPUs (the compiler with SYCL, oneMKL, oneDNN, oneCCL, oneTBB, oneDPL, PTI ...):
#
#   cx tool status oneapi                                             what is installed, and its version
#   cx tool setup oneapi --install --with.accept_eula=yes             the default line of oneAPI
#   cx tool setup oneapi --version=2026.0 --install --with.accept_eula=yes
#   cx program run build-pytorch --compute=xpu --use.oneapi.with.accept_eula=yes
#
# A SYCL extension (sycl_ext_oneapi_ipc_memory, which PyTorch 2.15 uses, for one) is no package of its own: it is a
# part of the compiler and its runtime, so "which extensions" is "which release".
#
#   Linux     Intel's installer runs without root into the tool's cache entry, with an installation instance of
#             its own: nothing of the system changes, and several releases stand side by side, one per entry.
#   Windows   Intel's installer needs administrator rights and installs where Intel does (C:\Program Files (x86)\
#             Intel\oneAPI, or beside the oneAPI the machine has; releases side by side as <line>\oneapi-vars.bat),
#             or into the folder --with.install_dir=<folder> names.
#             The tool downloads it; a quiet run from a plain process prints the command instead of starting it.
#   macOS     Intel publishes no oneAPI compilers for it.
#
# Intel's End User License Agreement for Developer Tools is the user's to read and accept
# (https://www.intel.com/content/www/us/en/developer/articles/license/end-user-license-agreement.html): without
# --with.accept_eula=yes the install stops and says so. README.tech.md: what an install leaves and how it is removed.

storage_key: oneapi

# The line of oneAPI an install takes when none is asked: the one Intel names for the PyTorch that build-pytorch
# builds by default (2.15: https://www.intel.com/content/www/us/en/developer/articles/tool/pytorch-prerequisites-for-intel-gpu/2-15.html).
# A build names its own need (build-pytorch: toolkits), so this default matters for a bare "cx tool setup oneapi".
default_version: '2026.1'

# Intel Deep Learning Essentials by Intel's release name. Intel names the file of each system with a build number of
# its own and keeps it at an address that cannot be derived: hence the table (from Intel's pages "PyTorch
# Prerequisites for Intel GPUs", one per PyTorch release, and its download page for the newest). size and sha256 as
# downloaded on 2026-11-24.
#
# The version of the tool is the compiler's (icx --version), and Intel numbers the compiler apart from the package:
# the package 2026.1.3 holds the compiler 2026.1.1 ("compiler:", where a release was installed and asked). So a
# request names a line of oneAPI (2026.1; a range: >=2026.0) or a compiler version this table knows, and takes the
# newest release here that answers it - never the package's own number.
