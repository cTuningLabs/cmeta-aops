names:
  - oneapi-vars{{global.host.vars.file_ext_bat}}

cache_params_use: 
  windows:
    microsoft-sdk:
      version: "{{global.microsoft-sdk.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-sdk.path}}" 
    microsoft-visual-studio:
      version: "{{global.microsoft-visual-studio.version}}" # This version must be already resolved here, therefore not fuzzy
      path: "{{global.microsoft-visual-studio.path}}" 

match_version: 
  - regex: 'oneAPI.*?Compiler\s+\d+\.\d+\.\d+\s*\(\s*(\d+\.\d+\.\d+\.\d+)\s*\)'
    group: 1

cmd_call_script: '{{tool_path}}'
cmd: ''
cmd_get_version: 'icx{{global.host.vars.file_ext_exe}} --version'

uses_os:
  windows:
    - task: setup,a2f9b61079ce4333
      name: microsoft.visual-studio,b30299aeb2bd4c6e
  darwin:
    - task: force-fail,fbc834fe54894aec
      text: 'task "{{task_artifact_alias}} oneapi" is not supporting MacOS'



extra_paths:
  linux:
    - "/opt/intel/oneapi/*"
    - "{{global.host.os_env.HOME|}}/intel/oneapi/*"
  windows:
    - "C:\\Program Files (x86)\\Intel\\oneAPI\\**"
    - "D:\\Program Files (x86)\\Intel\\oneAPI\\**"
    - "C:\\Program Files\\Intel\\oneAPI\\**"
    - "D:\\Program Files\\Intel\\oneAPI\\**"

# Windows: Intel's installer asks for administrator rights (a UAC prompt). Linux: none (the cache entry)
requires_sudo:
  windows: True

install_help_text: |
  Intel oneAPI was not found. "cx tool setup oneapi --install --with.accept_eula=yes" installs Intel Deep Learning
  Essentials (Linux and Windows on x86_64; read Intel's EULA first:
  https://www.intel.com/content/www/us/en/developer/articles/license/end-user-license-agreement.html), or install
  oneAPI yourself from https://www.intel.com/content/www/us/en/developer/tools/oneapi/overview.html

