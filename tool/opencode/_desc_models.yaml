  # ---- gone from the bundled tier between 2026-08-21 (docs/cmeta-aops/agent-tasks.md) and 2026-10-04
  - name: opencode/hy3-free
    disabled: true
    note: 'not in "opencode models" on 2026-10-04'
  - name: opencode/mimo-v2.5-free
    disabled: true
