authors: Grigori Fursin

# OpenCode.AI (https://opencode.ai) - a terminal AI coding agent, the third
# sibling of the "claude" and "codex" tools.
names:
  - opencode{{global.host.vars.file_ext_exe}}

# "opencode --version" prints a bare semver, i.e. "1.18.19"
match_version:
  - regex: '([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/anomalyco/opencode'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
# The repo also carries "vscode-vX.Y.Z" tags for the editor extension - only the
# plain "vX.Y.Z" tags are opencode releases
cmd_get_versions_regex: 'refs/tags/v([\d.]+)(?:\^\{\})?$'

install_help_text:
  Please install "opencode" tool as described at
    https://opencode.ai/docs/ !

# Linux/macOS: the official installer drops a prebuilt binary into
#   ~/.opencode/bin (no root, exact version pinnable) - the same shape as "claude".
# Windows: upstream publishes no .cmd/.ps1 installer (https://opencode.ai/install.ps1
#   is a 404), so we go one rung down the ladder and use winget, which is set up
#   by task/setup on Windows anyway.
install_cmd:
  windows: '{{global.winget.qpath}} install --id=SST.opencode -e --no-upgrade --source winget {{global.init.winget_install_flags|}}'
  linux: '{{global.curl.qpath}} -fsSL https://opencode.ai/install | bash'
  darwin: '{{global.curl.qpath}} -fsSL https://opencode.ai/install | bash'

# Specific version: the install script takes "--version X.Y.Z" (or $VERSION),
# winget takes "--version".
install_cmd_version:
  windows: '{{global.winget.qpath}} install --id=SST.opencode -e --version={{simple_version}} --no-upgrade --source winget {{global.init.winget_install_flags|}}'
  linux: '{{global.curl.qpath}} -fsSL https://opencode.ai/install | bash -s -- --version {{simple_version}}'
  darwin: '{{global.curl.qpath}} -fsSL https://opencode.ai/install | bash -s -- --version {{simple_version}}'

extra_paths:
  linux:
    - "{{user_home}}/.opencode/bin"
    - "{{user_home}}/.local/bin"
  darwin:
    - "{{user_home}}/.opencode/bin"
    - "{{user_home}}/.local/bin"
    - "/opt/homebrew/bin"
  windows:
    - '{{global.host.os_env.USERPROFILE}}\.opencode\bin'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
