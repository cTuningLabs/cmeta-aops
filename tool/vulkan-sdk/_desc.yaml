# The Vulkan SDK: headers, the loader library, glslc (GLSL -> SPIR-V) and the tools that
# building Vulkan programs needs (llama.cpp with GGML_VULKAN, ...). Running them needs only
# the runtime (tool/vulkan).
#
# Detected (api_v1.py detect()) wherever an SDK can be: $VULKAN_SDK, the LunarG folders
# (C:\VulkanSDK\<version>, ~/VulkanSDK/<version>/{x86_64,macOS}), the distro packages (/usr)
# and Homebrew. A folder counts when it has glslc and vulkan/vulkan_core.h; its version is
# the LunarG folder's (1.4.350.0) or the headers' (1.4.341).
#
# Installed (install ladder):
#   1. the pinned LunarG SDK into the cMeta cache - no administrator rights:
#        Linux x86_64: the release tarball; Windows x64: the installer in copy-only mode;
#   2. Homebrew on macOS (vulkan-headers, vulkan-loader, molten-vk, shaderc, vulkan-tools),
#      winget (KhronosGroup.VulkanSDK) on Windows when the copy-only install cannot run;
#   3. the distro packages (sudo) on other Linux machines (arm64, ...).
#
#   cx tool setup vulkan-sdk                       # detect, else install the pinned SDK
#   cx tool setup vulkan-sdk --version=1.4.350.0   # another LunarG release
#   cx tool setup vulkan-sdk --versions            # the LunarG releases
#
# The result exports VULKAN_SDK (and the SDK's bin to PATH) for the steps that follow, which
# is how CMake's FindVulkan finds headers, library and glslc.

storage_key: vulkan-sdk

default_version: '1.4.363.0'

match_version:
  - regex: 'Vulkan SDK\s+(\S+)'
    group: 1

# Every LunarG SDK release is tagged vulkan-sdk-<version> in Vulkan-Headers (hotfix SDKs such as
# 1.4.357.1 may be missing there; https://vulkan.lunarg.com/sdk/versions/linux.json lists all)
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/KhronosGroup/Vulkan-Headers'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/vulkan-sdk-(\d+\.\d+\.\d+\.\d+)(?![\w.-])'

# Fallbacks of the LunarG install (api_v1.py returns 16 with these)
package_name: 'libvulkan-dev glslc spirv-headers vulkan-tools'
package_name_os_id:
  fedora: 'vulkan-headers vulkan-loader-devel glslc spirv-headers-devel vulkan-tools'
  rhel: 'vulkan-headers vulkan-loader-devel glslc spirv-headers-devel vulkan-tools'
  rocky: 'vulkan-headers vulkan-loader-devel glslc spirv-headers-devel vulkan-tools'
  almalinux: 'vulkan-headers vulkan-loader-devel glslc spirv-headers-devel vulkan-tools'
  amzn: 'vulkan-headers vulkan-loader-devel glslc spirv-headers-devel vulkan-tools'
  azurelinux: 'vulkan-headers vulkan-loader-devel glslc spirv-headers-devel vulkan-tools'
  alpine: 'vulkan-headers vulkan-loader-dev shaderc spirv-headers vulkan-tools'
  arch: 'vulkan-headers vulkan-icd-loader shaderc spirv-headers vulkan-tools'

install_cmd:
  windows: '{{global.winget.qpath}} install --id=KhronosGroup.VulkanSDK -e --source winget {{global.init.winget_install_flags|}}'
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers vulkan-tools'

install_cmd_version:
  windows: '{{global.winget.qpath}} install --id=KhronosGroup.VulkanSDK -e --version={{simple_version}} --source winget {{global.init.winget_install_flags|}}'

install_help_text: |
  Could not install the Vulkan SDK automatically on this system.
  Install it from https://vulkan.lunarg.com/sdk/home (or your distribution's
  Vulkan development packages: headers, loader, glslc) and run
  "cx tool setup vulkan-sdk" again.
