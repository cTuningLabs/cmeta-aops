storage_key: nvcc

names:
  - nvcc{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "Cuda compilation tools.*?\\bV([0-9]+(?:\\.[0-9]+)+)\\b"
    group: 1

cmd_get_version: '{{tool_path}} --version'

install_help_text:
  Please install CUDA from https://developer.nvidia.com/cuda/toolkit !

uses:
  - task: runner,1e48cc0c5f6041a5

  - task: setup,a2f9b61079ce4333
    name: cuda,805716c4f32d42cf

  - task: compiler,f3925b201c704bde
    lang: cpp
    text: "INFO: Selecting host compiler for NVCC"
    extra_tags: '{{local.compiler_extra_tags}}'
    extra_match: '{{local.compiler_extra_match}}'

extra_paths:
  windows:
    - "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"
    - "D:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"
  linux:
    - "/usr/local/**"
