storage_key: nvcc

cache_params_use: 
  windows:
    tool--microsoft-sdk:
      version: "{{global.tool--microsoft-sdk.version}}" # This version must be already resolved here, therefore not fuzzy
    tool--msvc:
      version: "{{global.tool--msvc.version}}" # This version must be already resolved here, therefore not fuzzy

names:
  - nvcc{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "Cuda compilation tools.*?\\bV([0-9]+(?:\\.[0-9]+)+)\\b"
    group: 1

cmd_get_version: '{{tool_path}} --version'

install_help_text:
  Please install CUDA from https://developer.nvidia.com/cuda/toolkit !

uses:
  - task: host,96ac7118439c4490

  - task: setup,a2f9b61079ce4333
    name: cuda,805716c4f32d42cf

  - task: setup,a2f9b61079ce4333
    name: msvc,e823256bbbe54b4e
    skip_if_not_win: True

extra_paths:
  windows:
    - "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"
    - "D:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"
  linux:
    - "/usr/local/**"
