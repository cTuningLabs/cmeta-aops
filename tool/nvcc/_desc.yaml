storage_key: nvcc

names:
  - nvcc{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "Cuda compilation tools.*?\\bV([0-9]+(?:\\.[0-9]+)+)\\b"
    group: 1

cmd_get_version: '{{tool_path}} --version'

install_help_text:
  Please install CUDA from https://developer.nvidia.com/cuda/toolkit !

uses:
  - task: runner,1e48cc0c5f6041a5

  - task: setup,a2f9b61079ce4333
    name: cuda,805716c4f32d42cf

  - task: compiler,f3925b201c704bde
    lang: cpp
    text: "INFO: Selecting host compiler for NVCC"
    extra_tags: '{{local.compiler_extra_tags}}'
    extra_match: '{{local.compiler_extra_match}}'

extra_paths:
  windows:
    - "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"
    - "D:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\**"
  linux:
    - "/usr/local/**"
    - "/opt/nvidia/**"

features:
  windows:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: '-cudart={cudart_shared} -Xcompiler /MD'
      static_build: '-cudart=static -Xcompiler /MT'
      dynamic_build_debug: '-g -cudart=hybrid -Xcompiler /MDd'
      static_build_debug: '-g -cudart=static -Xcompiler /MTd'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: 'lib'
      lib_postfix: ''
      openmp: '-Xcompiler /openmp'
      link_openmp:
      fast: '-O3'
      fastest: '-O3'
      profile: ''
      profile_cuda: '-lineinfo'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-shared'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-shared -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe: .exe
      file_ext_lib: .lib
      file_ext_lib2: .lib
      file_ext_dlib: .dll
      file_ext_obj: .obj
  linux:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: '-cudart={cudart_shared}'
      static_build: '-cudart=static'
      dynamic_build_debug: '-cudart=shared -g'
      static_build_debug: '-cudart=static -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: '-Xcompiler -fopenmp'
      link_openmp:
      fast: '-O3'
      fastest: '-O3'
      profile: ''
      profile_cuda: '-lineinfo'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-shared'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-shared -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe:
      file_ext_lib: .a
      file_ext_lib2: .a
      file_ext_dlib: .so
      file_ext_obj: .o

