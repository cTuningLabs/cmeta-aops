authors: Grigori Fursin

# PowerShell 7 and newer ("pwsh", https://github.com/PowerShell/PowerShell): detected where the system keeps it, and
# installed or upgraded through the system's own channel - never as a copy in the cMeta cache:
#
#   cx tool setup powershell --status     the installed version, the newest one of its channel, outdated or not
#   cx tool install powershell            where it is missing: winget on Windows, Homebrew on macOS
#   cx tool upgrade powershell            through the same channel
#   cx tool run powershell -- -NoProfile -Command "$PSVersionTable.PSVersion"
#
# Windows PowerShell 5.1 (powershell.exe, a part of Windows) is another program: this tool neither detects nor
# replaces it. PowerShell 7 is installed beside it and is started as "pwsh".
#
#   Windows   winget's Microsoft.PowerShell - its MSIX package for this user (no administrator rights; pwsh.exe is
#             then the app's alias in %LOCALAPPDATA%\Microsoft\WindowsApps, a folder of the user's PATH). Microsoft's
#             MSI (C:\Program Files\PowerShell\7) is detected too.
#   macOS     Homebrew's formula "powershell".
#   Linux     detected (Microsoft's packages: /opt/microsoft/powershell/7 with /usr/bin/pwsh; the snap: /snap/bin);
#             not installed by this tool - install_help_text says how.

names:
  - pwsh{{global.host.vars.file_ext_exe}}

# "PowerShell 7.7.0" (a preview: "PowerShell 7.8.0-preview.1")
match_version:
  - regex: 'PowerShell\s+([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.\-]*)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

# The releases (not the previews and release candidates): the tags v<major>.<minor>.<patch>
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/PowerShell/PowerShell'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'

# Installed into the system (the user's apps on Windows, Homebrew's prefix on macOS): --status guesses no other
# channel from where it is found
installs_into_system: True

install_cmd:
  windows: '{{global.winget.qpath}} install --id=Microsoft.PowerShell -e --no-upgrade --source winget {{global.init.winget_install_flags|}}'
  darwin: '{{global.brew.qpath}} install powershell'

extra_paths:
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WindowsApps'
    - 'C:\Program Files\PowerShell\7'
  linux:
    - /usr/bin
    - /opt/microsoft/powershell/7
    - /snap/bin
  darwin:
    - /opt/homebrew/bin
    - /usr/local/bin
    - /usr/local/microsoft/powershell/7

install_help_text: |
  PowerShell 7 could not be installed automatically: https://learn.microsoft.com/powershell/scripting/install/installing-powershell
    Windows : winget install --id Microsoft.PowerShell -e --source winget
    macOS   : brew install powershell
    Linux   : Microsoft's package for the distribution (the page above: apt, dnf, zypper), or
              sudo snap install powershell --classic; then "cx tool setup powershell" finds it
  Windows PowerShell 5.1 (powershell.exe) is a part of Windows and another program: it is not what this tool looks for.
