authors: Grigori Fursin

# The program: Docker Compose as its own binary (also what Docker loads as its `compose` plugin)
names:
  - docker-compose{{global.host.vars.file_ext_exe}}

# The version installed when none is asked for, and how a found program tells its version
default_version: '5.6.0'

match_version:
  - regex: 'Docker Compose version v?(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} version'

# The versions that exist: the release tags of docker/compose (git is set up first)
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/docker/compose'

cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0

cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

# Where Docker keeps its CLI plugins: the program is looked for there too, not only on the PATH
extra_paths:
  linux:
    - '{{user_home}}/.docker/cli-plugins'
    - '/usr/local/lib/docker/cli-plugins'
    - '/usr/libexec/docker/cli-plugins'
    - '/usr/lib/docker/cli-plugins'

  darwin:
    - '/Applications/Docker.app/Contents/Resources/cli-plugins'
    - '{{user_home}}/.docker/cli-plugins'
    - '/opt/homebrew/lib/docker/cli-plugins'

  windows:
    - 'C:\Program Files\Docker\cli-plugins'
    - 'C:\Program Files\Docker\Docker\resources\cli-plugins'
    - '{{user_home}}/.docker/cli-plugins'

install_help_text: |
  Compose is a Docker client tool; installing it does not install or start Docker Engine.
  The pinned upstream binary is installed in the cMeta cache and its SHA-256 is verified.
  Run it with "cx tool run docker-compose -- version" or use its resolved path directly.
  To expose it as "docker compose", link it into a Docker CLI plugin directory explicitly.
  Installation reference: https://docs.docker.com/compose/install/linux/
