authors: Grigori Fursin

# The Khronos OpenCL headers (CL/cl.h ...) and the library a program links, for the opencl target
# (task target--opencl finds the devices; tool/opencl the ICD loader): installed into the tool's cache
# entry from the pinned Khronos releases (api_v1.py). A program sets it up after its compiler:
#
#   - task: setup,a2f9b61079ce4333
#     if: '"opencl" in {{global.target.compute|$[]}}'
#     name: lib-opencl,c209094321c94530
#
#   cx tool setup lib-opencl

skip_detect: True

names:
  - cl.h

# The release tag of KhronosGroup/OpenCL-Headers and KhronosGroup/OpenCL-ICD-Loader (the same tags)
default_version: '2026.05.29'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/KhronosGroup/OpenCL-Headers'

cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0

cmd_get_versions_regex: '\brefs/tags/v(\d{4}\.\d{2}\.\d{2})(?![\w.-])'

match_version:
  - regex: '^.*$'
    group: 0

install_help_text: |
  Could not install the OpenCL headers or the library to link: see the error above. A release that the tool
  does not pin needs the SHA-256 of both archives (GitHub's archives of the tags of KhronosGroup/OpenCL-Headers
  and KhronosGroup/OpenCL-ICD-Loader):
    cx tool setup lib-opencl --version=<YYYY.MM.DD> --with.sha256=<headers> --with.sha256_loader=<ICD loader>
