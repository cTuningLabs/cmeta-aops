authors: Grigori Fursin

# lib-level-zero - the SDK of oneAPI Level Zero (Intel's interface to its GPUs and NPUs: the headers
# include/level_zero/*.h and, on Windows, the import library lib/ze_loader.lib), from the release Intel publishes
# (github.com/oneapi-src/level-zero, MIT), checked against the SHA-256 pinned here and unpacked into the tool's cache
# entry. What links against Level Zero needs it: the launcher Triton's Intel backend compiles on Windows looks for it
# in LEVEL_ZERO_V1_SDK_PATH (features.paths.root). The runtime itself (ze_loader.dll) comes with Intel's GPU driver.
#
#   cx tool setup lib-level-zero                         # the pinned release (Windows)
#   cx tool setup lib-level-zero --version=1.37.0 --with.sha256=<SHA-256 of level-zero-win-sdk-1.37.0.zip>
#
# Windows: the SDK of the release. Linux: the distribution's development package (Ubuntu and Debian: libze-dev) - its
# headers are where compilers look (Triton's Intel backend: /usr/local, or ZE_PATH).

skip_detect: True

names:
  - ze_api.h

default_version: '1.36.0'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/oneapi-src/level-zero'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'

match_version:
  - regex: '^.*$'
    group: 0

install_help_text: |
  Could not install the Level Zero SDK: see the error above. A release that the tool does not pin needs the SHA-256
  of its Windows SDK zip (level-zero-win-sdk-<version>.zip of github.com/oneapi-src/level-zero/releases):
    cx tool setup lib-level-zero --version=<version> --with.sha256=<SHA-256>
  Linux: the distribution's development package (Ubuntu, Debian: sudo apt install libze-dev).
