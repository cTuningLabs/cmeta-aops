authors: Grigori Fursin

# jq, the JSON processor - https://jqlang.org (MIT).
#
# Installed from the pinned upstream release (install ladder tier 1) by the shared helper
# category/tool/api/common_release.py: the asset for this OS and CPU, its SHA-256 checked where
# upstream publishes checksums, the binary unpacked and named "jq". An installation already
# on the PATH (or in extra_paths) is detected and used first.
#
#   cx tool setup jq                         # detect, else install the pinned release
#   cx tool setup jq --version=<x.y.z> --new # another release
#   cx tool setup jq --versions              # the released versions
#
# Quick checks:
#   cx tool run jq -- --version
#   with {"a":[1,2,3]} in t.json:  cx tool run jq -- ".a[1]" t.json   (prints 2)

names:
  - jq{{global.host.vars.file_ext_exe}}

default_version: '1.8.2'

match_version:
  - regex: 'jq-(\d+\.\d+(?:\.\d+)?)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/jqlang/jq'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/jq-(\d+\.\d+(?:\.\d+)?)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_help_text: |
  Could not install jq from its release automatically on this system.
  Install it as described at https://jqlang.org and run "cx tool setup jq" again.
