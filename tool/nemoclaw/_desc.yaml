authors: Grigori Fursin

# NVIDIA NemoClaw - https://github.com/NVIDIA/NemoClaw (Apache-2.0, alpha): runs OpenClaw (its default agent), Hermes
# or LangChain Deep Agents Code inside NVIDIA OpenShell sandboxes, with guided onboarding, managed inference and
# network policies. Its CLI "nemoclaw" is a Node.js program (Node 22.19 or newer).
#
# Installed (api_v1.py) as upstream's installer builds it, without that installer's system changes: the pinned release
# tag cloned into the cache entry, its dependencies installed and built with cMeta's Node.js (tool/node-js) and npm's
# cache inside the entry, then a launcher content/bin/nemoclaw that runs bin/nemoclaw.js with that Node and points
# NemoClaw at cMeta's OpenShell CLI (NEMOCLAW_OPENSHELL_BIN, tool/openshell). The npm package "nemoclaw" is a
# placeholder (222 bytes, not NVIDIA's), so npm is not the source. Linux and macOS; Windows through WSL2 (--on=wsl).
#
#   cx tool setup nemoclaw                  # detect, else build the pinned tag
#   cx tool run nemoclaw -- --version
#   cx tool run nemoclaw -- onboard         # NemoClaw's own onboarding (in a terminal: an inference provider, a sandbox)

names:
  - nemoclaw

default_version: '0.0.135'

match_version:
  - regex: '(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/NVIDIA/NemoClaw'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)$'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '{{user_home}}/.npm-global/bin'
  darwin:
    - '{{user_home}}/.local/bin'
    - '/opt/homebrew/bin'

# The build needs git and Node.js, set up by api_v1.py itself
skip_common_install_uses: True

install_help_text: |
  Could not set up NVIDIA NemoClaw here. It runs on Linux and macOS with Docker (Windows: in WSL2, --on=wsl) and needs
  Node.js 22.19 or newer. Upstream's installer: curl -fsSL https://www.nvidia.com/nemoclaw.sh | bash
