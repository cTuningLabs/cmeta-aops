names:
  - ndk-which.cmd

match_version: 
  - regex: '^Pkg\.Revision\s*=\s*([^\n]+)'
    group: 1

cmd_get_version: 'more {{root_tool_path}}{{os_sep}}source.properties'

install_note: >-
  Please note that installing Android NDK may require administrative privileges!

install_cmd:
  all: '{{global.google-android-sdk-command-line-tools.qpath}} "ndk;29.0.14206865"'

install_cmd_version:
  all: '{{global.google-android-sdk-command-line-tools.qpath}} "ndk;{{simple_version}}"'

extra_paths:
  windows:
    - "C:\\Program Files\\Android\\**"
    - "C:\\Program Files (x86)\\Android*\\**"
    - "D:\\Program Files\\Android\\**"
    - "D:\\Program Files (x86)\\Android*\\**"

uses:
  - task: setup,a2f9b61079ce4333
    name: google.android-sdk.command-line-tools,2ee8eb31da764eef
  