# The Android NDK. An NDK of an Android SDK (extra_paths) or on the PATH is detected first.
# Otherwise api_v1.py downloads the zip of the pinned (or requested) NDK for this host OS from
# Google's repository and checks it against the SHA-1 of Google's repository index (install
# ladder tier 1: no Java, no sdkmanager, no administrator rights); on Linux ARM, which Google
# publishes no zip for, it falls back to sdkmanager (the SDK command-line tools, with Java).
#
#   cx tool setup google.android-ndk
#   cx tool setup google.android-ndk --version=30.0.16248370 --new
#   cx tool setup google.android-ndk --versions        # the revisions (needs the command-line tools)

default_version: '29.0.14206865'

names:
  - ndk-which{{global.host.vars.file_ext_cmd2}}

match_version: 
  - regex: '^Pkg\.Revision\s*=\s*([^\n]+)'
    group: 1

cmd_get_version: 'more {{root_tool_path}}{{os_sep}}source.properties'

# The NDKs the Android SDK offers (sdkmanager --list: "ndk;30.0.16248370 | ..."), for --versions,
# --status and --upgrade; NDKs install side by side
cmd_get_versions: '{{global.google-android-sdk-command-line-tools.qpath}} --list'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: google.android-sdk.command-line-tools,2ee8eb31da764eef
cmd_get_versions_regex: '\bndk;(\d+\.\d+\.\d+)\b'

extra_paths:
  windows:
    - "{{global.host.os_env.LOCALAPPDATA}}\\Android\\Sdk\\ndk\\**"
    - "C:\\Program Files\\Android\\**"
    - "C:\\Program Files (x86)\\Android*\\**"
    - "D:\\Program Files\\Android\\**"
    - "D:\\Program Files (x86)\\Android*\\**"
  linux:
    - "{{user_home}}/Android/Sdk/ndk/**"
    - "/home/linuxbrew/.linuxbrew/**"
  darwin:
    - "{{user_home}}/Library/Android/sdk/ndk/**"
    - "/opt/homebrew/opt/**"
    - "/opt/homebrew/share/**"


