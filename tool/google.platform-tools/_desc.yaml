names:
  - adb{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: '^version\s+(\d+\.\d+\.\d+(?:-\d+)?)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

install_cmd:
  windows: "{{global.winget.qpath}} install --id=Google.PlatformTools -e --no-upgrade {{global.init.winget_install_flags|}}"
  linux: '{{global.brew.qpath}} install android-platform-tools'
  darwin: '{{global.brew.qpath}} install android-platform-tools'

install_cmd_version:
  windows: "{{global.winget.qpath}} install --id=Google.PlatformTools -e --version={{simple_version}} --no-upgrade {{global.init.winget_install_flags|}}"
  linux: '{{global.brew.qpath}} install android-platform-tools@{{major_version}}'
  darwin: '{{global.brew.qpath}} install android-platform-tools@{{major_version}}'

extra_paths:
  windows:
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"
  linux:
    - "/home/linuxbrew/.linuxbrew/**"
  darwin:
    - "/opt/homebrew/opt/**"

install_uses:
  linux:
    - task: setup,a2f9b61079ce4333
      name: brew,27859c999bdd4085
