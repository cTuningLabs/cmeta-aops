storage_key: clang-cpp

cache_params_use: 
  all:
    llvm:
      version: "{{global.llvm.version}}"
      path: "{{global.llvm.path}}"
    clang:
      version: "{{global.clang.version}}"
      path: "{{global.clang.path}}"

only_paths:
  all:
    - "{{global.llvm.path_bin}}"

names:
  - clang++{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "clang version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/llvm/llvm-project'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/(?:.+?-)?([^^\s]+)(?:\^\{\})?$'

uses:
  - task: setup,a2f9b61079ce4333
    name: llvm,532bab2de2e94c7d
    version: "{{params.version|$None}}"
  - task: setup,a2f9b61079ce4333
    name: clang,51754c984f184e96
    version: "{{params.version|$None}}"

uses_os:
  linux:
    - task: setup,a2f9b61079ce4333
      name: gcc,222c51b9e9eb4887
    - task: setup,a2f9b61079ce4333
      name: gcc-cpp,b444b09b95b84696
    - task: setup,a2f9b61079ce4333
      name: make,d539463695b8480c
  darwin:

install_help_text:
  Please check https://releases.llvm.org !

features:
  windows:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: '-fms-runtime-lib=static'
      dynamic_build_debug: '-g'
      static_build_debug: '-fms-runtime-lib=static -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-Wl,/LIBPATH:'
      lib_prefix: '-Wl,'
      lib_prefix2: 'lib'
      lib_postfix: '.lib'
      openmp: '-fopenmp'
      fast: '-O3'
      fastest: '-O3 -ffast-math -march=native'
      profile: '-gcodeview -fno-omit-frame-pointer'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-shared'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-shared -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe: .exe
      file_ext_lib: .lib
      file_ext_lib2: .lib
      file_ext_dlib: .dll
      file_ext_obj: .o
  linux:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static'
      dynamic_build_debug: '-g'
      static_build_debug: '-static -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: '-fopenmp'
      fast: '-O3'
      fastest: '-O3 -ffast-math -march=native'
      profile: '-fno-omit-frame-pointer'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-shared -fPIC'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-shared -fPIC -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe:
      file_ext_lib: .a
      file_ext_lib2: .a
      file_ext_dlib: .so
      file_ext_obj: .o
  darwin:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: ''
      dynamic_build_debug: '-g'
      static_build_debug: '-g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: '-Xpreprocessor -fopenmp'
      fast: '-O3'
      fastest: '-O3 -ffast-math -march=native'
      profile: '-fno-omit-frame-pointer'
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-dynamiclib'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-dynamiclib -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe:
      file_ext_lib: .a
      file_ext_lib2: .a
      file_ext_dlib: .dylib
      file_ext_obj: .o

