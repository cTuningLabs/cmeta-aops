authors: Grigori Fursin

names:
  - nginx{{global.host.vars.file_ext_exe}}

extra_paths:
  linux:
    - /usr/sbin
    - /usr/local/nginx/sbin
  darwin:
    - /opt/homebrew/bin
    - /usr/local/bin

# "nginx version: nginx/1.30.6" (on stderr)
cmd_get_version: '{{tool_path}} -v'
match_version:
  - regex: 'nginx/(\d+\.\d+\.\d+)'
    group: 1

# The releases (github.com/nginx/nginx tags release-<version>); the stable line is the default
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/nginx/nginx'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/release-(\d+\.\d+\.\d+)$'
default_version: '1.30.6'

# nginx numbers its stable line with an even minor (1.30) and its mainline with an odd one (1.31): the pin follows the
# stable line, so latest does too
latest_limits:
  - exclude: '>=1.31,<1.32'
    reason: '1.31 is nginx mainline; the pin follows the stable line (an even minor: 1.30, then 1.32)'
    since: '2026-10-17'

# Windows (api_v1.py): the official zip of nginx.org, the whole folder (nginx.exe needs conf/, html/, logs/ and temp/
# next to it); nginx.org signs its files with PGP only: HTTPS
windows_zip: 'https://nginx.org/download/nginx-{version}.zip'

package_name: nginx

install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install nginx'
  windows: 'nginx zip'

requires_sudo:
  linux: True

# After the package (api_v1.py post_install, Linux with systemd): the service enabled and started - the Debian package
# starts it by itself, the RPM ones do not
services:
  nginx: [nginx]

install_help_text: |
  nginx: "cx tool setup nginx --install" takes the distribution's package on Linux (sudo), Homebrew's on macOS, and on
  Windows the official zip of nginx.org into cMeta's cache (start it there: nginx.exe in its folder; stop: nginx -s stop).
  Apache and nginx both listen on port 80 by default: one of them must move before both run on one machine.
