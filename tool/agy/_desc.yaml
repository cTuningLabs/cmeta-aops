authors: Grigori Fursin

# Antigravity CLI ("agy": https://antigravity.google/docs/cli, https://github.com/google-antigravity/antigravity-cli),
# Google's terminal coding agent and the successor of Gemini CLI for personal Google accounts: on 2026-06-18 Gemini
# CLI stopped serving the free, Google AI Pro and Google AI Ultra tiers (it still serves Gemini Code Assist
# Standard/Enterprise licences and paid API keys). agy is one proprietary Go binary; it signs in with a Google
# account (personal, with or without AI Pro/Ultra, or a Gemini Enterprise licence) or with GEMINI_API_KEY.
#
# Install strategy (api_v1.py): Tier 1 = curl the release archive straight from GitHub releases
# (agy_cli_<os>_<arch>.zip on Windows, .tar.gz elsewhere; one file inside, "antigravity[.exe]", renamed to
# "agy[.exe]"), pinned by --version or GitHub's "latest". No PATH or shell-profile change: Google's installers end
# with "agy install", which edits the profile, while cMeta keeps the binary in its cache and finds it there.
# Fallbacks (install_cmd, when api_v1.py returns 16): winget on Windows, the official install script elsewhere.
# Checked 2026-10-03 with 1.2.16 on Windows.
names:
  - agy{{global.host.vars.file_ext_exe}}

# "agy --version" prints a bare version, i.e. "1.2.16"
match_version:
  - regex: '([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

# The release tags are bare versions ("1.2.16", no "v")
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/google-antigravity/antigravity-cli'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/(\d+\.\d+\.\d+)(?:\^\{\})?$'

install_help_text: |
  Could not download the Antigravity CLI automatically.
  Install it per https://antigravity.google/docs/cli/install
    Windows:      irm https://antigravity.google/cli/install.ps1 | iex   (or: winget install Google.AntigravityCLI)
    macOS/Linux:  curl -fsSL https://antigravity.google/cli/install.sh | bash
  and retry "cx tool setup agy".

# Declarative fallbacks. Both official routes end with "agy install", which appends the binary to PATH in the
# shell profile - that is why the Tier-1 download above is preferred.
install_cmd:
  windows: '{{global.winget.qpath}} install --id=Google.AntigravityCLI -e --no-upgrade {{global.init.winget_install_flags|}}'
  linux: '{{global.curl.qpath}} -fsSL https://antigravity.google/cli/install.sh | bash'
  darwin: '{{global.curl.qpath}} -fsSL https://antigravity.google/cli/install.sh | bash'

install_cmd_version:
  windows: '{{global.winget.qpath}} install --id=Google.AntigravityCLI -e --version={{simple_version}} --no-upgrade {{global.init.winget_install_flags|}}'
  # the official script takes no version: it installs the latest build
  linux: '{{global.curl.qpath}} -fsSL https://antigravity.google/cli/install.sh | bash'
  darwin: '{{global.curl.qpath}} -fsSL https://antigravity.google/cli/install.sh | bash'

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21

# Where an agy installed by Google's own installers or by winget lives (single quotes: the backslashes are literal)
extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
  darwin:
    - '{{user_home}}/.local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\agy\bin'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'
    - 'C:\Program Files\Google\antigravity-cli'
