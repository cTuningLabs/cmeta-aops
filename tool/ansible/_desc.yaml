authors: Grigori Fursin

# Ansible (ansible-core), agentless automation - https://www.ansible.com (GPL-3.0).
#
# Installed as the pinned PyPI package "ansible-core" in its own Python 3.12
# environment by the shared helper category/tool/api/common_pyvenv.py: tool/uv creates the
# environment in the tool's cache entry (and downloads that Python if needed), so the system
# Python and other tools' packages are never touched. An installation already on the PATH is
# detected and used first.
#
# Not on: windows - use WSL or a Linux container there.
#
#   cx tool setup ansible                          # detect, else install the pinned version
#   cx tool setup ansible --version=<x.y.z> --new  # another version
#
# Quick checks:
#   cx tool run ansible -- --version
#   cx tool run ansible -- localhost -i localhost, -c local -m ping   (prints "pong")

names:
  - ansible{{global.host.vars.file_ext_exe}}

default_version: '2.21.4'

match_version:
  - regex: 'core (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/ansible/ansible'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v?(\d+\.\d+\.\d+)(?![\w.-])'

install_help_text: |
  Could not install ansible automatically on this system.
  See https://www.ansible.com and run "cx tool setup ansible" again.
