names:
  - swiftc{{global.host.vars.file_ext_exe}}

cache_params_use: 
  all:
    swiftlang:
      version: "{{global.swiftlang.version}}"
      path: "{{global.swiftlang.path}}"

force_tool_path: "{{global.swiftlang.path_bin}}{{global.host.vars.os_sep}}swiftc{{global.host.vars.file_ext_exe}}"

match_version: 
  - regex: 'Swift version (\d+(?:\.\d+)*)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

uses:
  - task: setup,a2f9b61079ce4333
    name: swiftlang,043d6514109e495d
    version: "{{params.version|$None}}"

features:
  windows:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static-stdlib'
      dynamic_build_debug: '-g'
      static_build_debug: '-static-stdlib -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: ''
      fast: '-O'
      fastest: '-O'
      profile: ''
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-emit-library'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-emit-library -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe: .exe
      file_ext_lib: .lib
      file_ext_lib2: .lib
      file_ext_dlib: .dll
      file_ext_obj: .obj
  linux:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static-stdlib'
      dynamic_build_debug: '-g'
      static_build_debug: '-static-stdlib -g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: ''
      fast: '-O'
      fastest: '-O'
      profile: ''
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-emit-library'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-emit-library -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe:
      file_ext_lib: .a
      file_ext_lib2: .a
      file_ext_dlib: .so
      file_ext_obj: .o
  darwin:
    flags:
      catch_errors: ''
      include_path: '-I'
      dynamic_build: ''
      static_build: ''
      dynamic_build_debug: '-g'
      static_build_debug: '-g'
      obj_file: '-o '
      exe_file: '-o '
      lib_file: '-o '
      lib_file2: ''
      link_sep: ''
      lib_path: '-L'
      lib_prefix: '-l'
      lib_prefix2: ''
      lib_postfix: ''
      openmp: ''
      fast: '-O'
      fastest: '-O'
      profile: ''
      link_profile: ''
      compile_to_obj: '-c'
      d: '-D'
      lib_dynamic_build: '-emit-library'
      lib_static_build: '-c'
      lib_dynamic_build_debug: '-emit-library -g'
      lib_static_build_debug: '-c -g'
      static_lib1: 'rcs'
      static_lib2: ''
    vars:
      file_ext_exe:
      file_ext_lib: .a
      file_ext_lib2: .a
      file_ext_dlib: .dylib
      file_ext_obj: .o


