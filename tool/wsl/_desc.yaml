names:
  - wsl{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: '^WSL version:\s*([\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

win_only: True

# WSL is a Windows system component: use Microsoft's inbox bootstrapper.
# This installs the runtime without adding a default Linux distribution.
skip_common_install_uses: True

install_cmd:
  windows: 'wsl.exe --install --no-distribution --web-download'

upgrade_cmd:
  windows: 'wsl.exe --update --web-download'

# Installing a Windows component needs administrator rights: a quiet run (-q) from a process that is not
# elevated does not start it (a UAC prompt would wait for nobody) and says what to run instead
requires_sudo:
  windows: True

install_help_text: |
  WSL requires Windows 10 build 19041 or later, or Windows 11, and hardware virtualization.
  Open PowerShell as Administrator and run:
    cx tool setup wsl --install
  Restart Windows if the installer requests it, then retry the original command.
  No Linux distribution is installed by tool setup. To select one:
    cx tool run wsl -- --list --online
  See https://learn.microsoft.com/windows/wsl/install

