storage_key: android-ndk-clang

names:
  - clang{{global.host.vars.file_ext_exe}}

cmd_get_version: '{{tool_path}} --version'

cache_params_use: 
  all:
    android-ndk:
      version: "{{global.google-android-ndk.version}}"
      path: "{{global.google-android-ndk.path_home}}"

only_paths:
  windows:
    - "{{global.google-android-ndk.path_home}}\\**"
  linux:
    - "{{global.google-android-ndk.path_home}}/**"

match_version: 
  - regex: 'clang version\s+([\d.]+)'
    group: 1

uses:
  - task: setup,a2f9b61079ce4333
    name: google.android-ndk,ce4e80d6d26240c0

features:
  windows:
    flags:
      include_path: '-I'
      dynamic_build: ''
      static_build: '-fms-runtime-lib=static'
      dynamic_build_debug: ''
      static_build_debug: '-fms-runtime-lib=static'
      exe_file: '-o '
      lib_path: '-Wl,/LIBPATH:'
      lib_prefix: '-Wl,'
    vars:
      file_ext_exe:
  linux:
    flags:
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static'
      dynamic_build_debug: ''
      static_build_debug: '-static'
      exe_file: '-o '
      lib_path: '-L'
      lib_prefix: '-l'
    vars:
      file_ext_exe:
  darwin:
    flags:
      include_path: '-I'
      dynamic_build: ''
      static_build: ''
      dynamic_build_debug: ''
      static_build_debug: ''
      exe_file: '-o '
      lib_path: '-L'
      lib_prefix: '-l'
    vars:
      file_ext_exe:
