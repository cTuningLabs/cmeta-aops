# zstd, the Zstandard compressor (https://github.com/facebook/zstd, BSD) - unpacks the .tar.zst
# archives of ollama and others:  zstd -dc archive.tar.zst | tar -xf -
#
#   cx tool setup zstd
#   cx tool run zstd -- --version

names:
  - zstd{{global.host.vars.file_ext_exe}}

default_version: '1.5.7'

match_version:
  - regex: 'v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/facebook/zstd'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

# Windows: the release zip (no admin) is downloaded by api_v1.py install(); these are the
# fallbacks there and the installs elsewhere
install_cmd:
  windows: '{{global.winget.qpath}} install --id=Meta.Zstandard -e --source winget {{global.init.winget_install_flags|}}'
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install zstd'

requires_sudo:
  linux: True

extra_paths:
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'

install_help_text: |
  Could not install zstd automatically: install it from https://github.com/facebook/zstd
  (or the zstd package of your system) and run "cx tool setup zstd" again.
