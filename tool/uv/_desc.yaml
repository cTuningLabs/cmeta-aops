names:
  - uv{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "uv ([0-9]+(?:[.\\-][0-9A-Za-z]+)*)"
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/astral-sh/uv'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/([^^\s]+)(?:\^\{\})?$'

install_help_text:
  Please install "uv" tool as described at 
    https://docs.astral.sh/uv/getting-started/installation !

install_cmd:
  windows: "{{global.winget.qpath}} install --id=astral-sh.uv -e --source winget {{global.init.winget_install_flags|}}"
  linux: '{{global.curl.qpath}} -LsSf https://astral.sh/uv/install.sh | sh'

install_cmd_version:
  windows: "{{global.winget.qpath}} install --id=astral-sh.uv -e --version={{simple_version}} --source winget {{global.init.winget_install_flags|}}"
  linux: '{{global.curl.qpath}} -LsSf https://astral.sh/uv/{{simple_version}}/install.sh | sh'

extra_paths:
  linux:
    - "{{user_home}}/.local/bin"
  windows:
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"

