authors: Grigori Fursin

# twine, the PyPA's tool that checks and uploads Python packages to PyPI - https://twine.readthedocs.io (Apache-2.0).
#
# Installed as the pinned PyPI package "twine" in its own Python 3.12 environment by the shared helper
# category/tool/api/common_pyvenv.py: tool/uv creates the environment in the tool's cache entry (and downloads that
# Python if needed), so the system Python and other tools' packages are never touched. An installation already on
# the PATH is detected and used first.
#
#   cx tool setup twine                             # detect, else install the pinned version
#   cx tool setup twine --version=<x.y.z> --new     # another version
#   cx tool run twine -- check dist/*
#
# The upload with the API token of a cMeta secret (kept with a password: cx secret store <alias> --password_protected),
# the token in the environment of twine alone (TWINE_PASSWORD):
#
#   cxt upload-to-pypi <dist folder>          # --secret=<alias>, or the token secret that declares "service: pypi"

names:
  - twine{{global.host.vars.file_ext_exe}}

default_version: '7.0.0'

match_version:
  - regex: 'twine version (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/pypa/twine'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v?(\d+\.\d+\.\d+)(?![\w.-])'

install_help_text: |
  Could not install twine automatically on this system.
  See https://twine.readthedocs.io and run "cx tool setup twine" again.
