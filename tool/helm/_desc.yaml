authors: Grigori Fursin

# Helm, the package manager for Kubernetes - https://helm.sh (Apache-2.0).
#
# Installed from the pinned upstream release (install ladder tier 1) by the shared helper
# category/tool/api/common_release.py: the asset for this OS and CPU, its SHA-256 checked where
# upstream publishes checksums, the binary unpacked and named "helm". An installation already
# on the PATH (or in extra_paths) is detected and used first.
#
#   cx tool setup helm                         # detect, else install the pinned release
#   cx tool setup helm --version=<x.y.z> --new # another release
#   cx tool setup helm --versions              # the released versions
#
# Quick checks:
#   cx tool run helm -- version --short
#   cx tool run helm -- create demo   &&   cx tool run helm -- template demo ./demo

names:
  - helm{{global.host.vars.file_ext_exe}}

default_version: '4.3.0'

match_version:
  - regex: 'v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} version --short'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/helm/helm'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_help_text: |
  Could not install helm from its release automatically on this system.
  Install it as described at https://helm.sh and run "cx tool setup helm" again.
