storage_key: torch-cpp

# Two defaults, one per way of getting LibTorch (README.md):
# - --with.build=prebuilt: the release whose archives are pinned in tool/torch-cpp-prebuilt (2.7.1);
# - a source build: the git tag of PyTorch that program/build-torch-cpp checks out when no version
#   is asked for (--version=<x.y.z> checks out v<x.y.z>). Without it, the clone step would take
#   PyTorch's default branch on a machine without a clone, and any clone it finds on another
default_version: '2.7.1'
default_checkout: 'v2.14.1'

# LibTorch is built here (program/build-torch-cpp) or, with --with.build=prebuilt, taken from
# PyTorch's prebuilt archives (tool/torch-cpp-prebuilt): a libtorch found in PATH is not used
skip_detect: True

# The library of a build or of the prebuilt archive; its version comes from its headers (api_v1.py)
names:
  - libtorch{{global.host.vars.file_ext_dlib}}
  - torch.dll

# --with.build=prebuilt: the library that tool/torch-cpp-prebuilt unpacked (see "uses")
force_tool_path: '{{global.torch-cpp-prebuilt.path|}}'

match_version:
  - regex: '^(\d+\.\d+[\.\d]*)'
    group: 1

# --with.build=prebuilt (and --with.variant=cpu|cu118|cu126|cu128): PyTorch's prebuilt LibTorch
# instead of a build; this setup is then not cached (api_v1.py, check_params)
uses:
  - task: setup,a2f9b61079ce4333
    if: '"{{params.with.build|}}".strip().lower() == "prebuilt"'
    name: torch-cpp-prebuilt,91e6b48f3ae5438c
    version: "{{params.version|$None}}"
    with:
      compute: "{{params.with.compute|$None}}"
      variant: "{{params.with.variant|$None}}"

# Available releases: git tags of the form v2.7.1, v2.12.0, …
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/pytorch/pytorch'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

build_local:
  target_sub_dir: 'build'

cache_meta_const:
  params:
    with:
      compute: '{{local.compute}}'
      static: '{{params.with.static|$False}}'
      strict_compute: '{{params.with.strict_compute|$None}}'
      ver: '{{params.with.ver|$None}}'

# Trigger program/build-torch-cpp to cmake-build and install libtorch
build_uses:
  all:
    - task: compile-and-run-program,05437a1aae224270
      name: build-torch-cpp,8cf1e453fef742d3
      clean: '{{params.with.clean|$None}}'
      recompile: '{{params.with.recompile|$None}}'
      compute: '{{params.with.compute|$[]}}'
      compile:
        static: '{{params.with.static|$False}}'
        strict_compute: '{{params.with.strict_compute|$None}}'
      skip_run: True
      target_path: '{{local.target_path}}'
      checkout: '{{local.checkout|$None}}'
