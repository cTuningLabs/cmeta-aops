# Obsidian (https://obsidian.md) - the desktop note-taking app on local Markdown files.
#
# Detection: the Electron binary. Windows installs Obsidian.exe per user under %LOCALAPPDATA%\Programs\Obsidian
# (winget uses the same installer); macOS has Obsidian inside /Applications/Obsidian.app; Linux has "obsidian"
# from the .deb or snap, or the versioned AppImage (Obsidian-<version>.AppImage). The app prints no version on
# the command line (and would open a window), so api_v1.py reads it from the installed files - see
# detect_versions.
names:
  - obsidian{{global.host.vars.file_ext_exe}}
  - Obsidian{{global.host.vars.file_ext_exe}}
  - Obsidian-*.AppImage

match_version:
  - regex: '([0-9]+\.[0-9]+\.[0-9]+)'
    group: 1
  - regex: '(unknown)'
    group: 1

# The upstream releases: cx tool setup obsidian --versions
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/obsidianmd/obsidian-releases'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/v([0-9][^^\s]*)$'

# Linux installs the AppImage of this release when no version is asked for (api_v1.py install());
# bump it to move everyone forward.
default_version: '1.9.14'
download_url_templates:
  - 'https://github.com/obsidianmd/obsidian-releases/releases/download/v{version}/{filename}'

# The install ladder: Windows and macOS through the non-sudo package managers (tier 2); Linux downloads
# the prebuilt AppImage (tier 1, api_v1.py) because there is no distribution package.
install_cmd:
  windows: '{{global.winget.qpath}} install --id=Obsidian.Obsidian -e --no-upgrade {{global.init.winget_install_flags|}}'
  darwin: '{{global.brew.qpath}} install --cask obsidian'

install_cmd_version:
  windows: '{{global.winget.qpath}} install --id=Obsidian.Obsidian -e --version={{simple_version}} --no-upgrade {{global.init.winget_install_flags|}}'

install_uses:
  darwin:
    - task: setup,a2f9b61079ce4333
      name: brew,27859c999bdd4085

install_help_text: |
  Could not set up Obsidian automatically. Install it from https://obsidian.md/download
    Windows : winget install --id=Obsidian.Obsidian -e
    macOS   : brew install --cask obsidian
    Linux   : the AppImage or .deb from https://github.com/obsidianmd/obsidian-releases/releases
              (snap install obsidian --classic  /  flatpak install md.obsidian.Obsidian also work)
  and re-run "cx tool setup obsidian". An AppImage needs FUSE (libfuse2) or ./Obsidian-*.AppImage --appimage-extract.

extra_paths:
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Programs\Obsidian'
    - 'C:\Program Files\Obsidian'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'
  darwin:
    - '/Applications/Obsidian.app/Contents/MacOS'
    - '{{user_home}}/Applications/Obsidian.app/Contents/MacOS'
  linux:
    - '/usr/bin'
    - '/opt/Obsidian'
    - '/snap/bin'
    - '{{user_home}}/Applications'
    - '{{user_home}}/.local/bin'
    - '{{user_home}}/bin'
