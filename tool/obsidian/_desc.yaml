names:
  - obsidian{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "uv ([0-9]+(?:[.\\-][0-9A-Za-z]+)*)"
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/openclaw/openclaw'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/v(.+)$'

install_help_text:
  Please install obsidian as described at https://obsidian.md/download !

install_cmd:
  windows: 'powershell -c "irm https://openclaw.ai/install.ps1 | iex"'
  linux: '{{global.curl.qpath}} -fsSL https://openclaw.ai/install.sh | bash'
  darwin: '{{global.curl.qpath}} -fsSL https://openclaw.ai/install.sh | bash'

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
    - task: setup,a2f9b61079ce4333
      name: node-js,238f15e1d6184359


