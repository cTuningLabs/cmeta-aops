storage_key: pytorch

# Default to a recent stable release; override with --version or params.with.ver
default_version: '2.7.1'

# The Python package name used when the tool is queried via pip-like mechanisms
name: torch

# PyTorch version string printed by torch.__version__ is e.g. "2.7.1" or "2.12.0+cpu"
match_version:
  - regex: '^(\d+\.\d+[\.\d]*)'
    group: 1

# Version detection: import torch inside the active Python env
cmd_get_version: '{{global.python.qpath}} -c "import torch; print(torch.__version__)"'

# Available releases: git tags of the form v2.7.1, v2.12.0, …
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/pytorch/pytorch'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)\b'

build_local:
  target_sub_dir: 'build'

cache_meta_const:
  params:
    with:
      compute: '{{local.compute}}'
      static: '{{params.with.static|$False}}'
      strict_compute: '{{params.with.strict_compute|$None}}'
      ver: '{{params.with.ver|$None}}'

build_uses:
  all:
    - task: compile-and-run-program,05437a1aae224270
      name: build-pytorch,b8f3d1c9a5e27046
      clean: '{{params.with.clean|$None}}'
      recompile: '{{params.with.recompile|$None}}'
      compute: '{{params.with.compute|$[]}}'
      compile:
        static: '{{params.with.static|$False}}'
        strict_compute: '{{params.with.strict_compute|$None}}'
      skip_run: True
      target_path: '{{local.target_path}}'
      checkout: '{{local.checkout|$None}}'
