# The Intel GPU compute runtime for Linux: the OpenCL ICD (libigdrcl.so), the Level Zero
# driver, the Intel Graphics Compiler, gmmlib and the Level Zero loader - what OpenVINO's GPU
# plugin, ONNX Runtime's OpenVINO EP, SYCL and PyTorch XPU need to compute on an Intel GPU.
# The kernel driver (i915 or xe) comes with the distribution; this is the user-space part.
#
# Detected (api_v1.py detect()) when the system has it: an ICD in /etc/OpenCL/vendors naming
# libigdrcl.so, with its package version (dpkg or rpm). Otherwise installed without root
# (install ladder, tier 1): Intel's release packages from GitHub, checked against their sha256,
# unpacked into this cache entry. Two release lines (Intel's):
#
#   26.35.39758.10   Gen12 and later: Tiger Lake, Alder/Raptor Lake, Meteor/Arrow/Lunar/Panther Lake, Arc
#   24.35.30872.36   legacy1: Gen8, Gen9, Gen11 (Broadwell, Skylake, Kaby Lake, Coffee Lake, Ice Lake, ...)
#
# Without --version the line follows the PCI device id of the Intel GPU (/sys/bus/pci/devices).
# The result exports the unpacked runtime for the steps that follow: its libraries on
# LD_LIBRARY_PATH and its ICD in OCL_ICD_FILENAMES (the ICD loader adds it to the system's
# ICDs, so an NVIDIA GPU stays visible too). The 26.35 line brings Intel's offline compiler
# too (intel-ocloc, on PATH as "ocloc"): the ahead-of-time compilation of SYCL kernels for
# these GPUs (icx -fsycl-targets=spir64_gen), which PyTorch's XPU build does on Linux, and
# the headers of Level Zero (libze-dev, on CPATH), which that build includes.
#
# The lines are data (releases: below): a new release of Intel's runtime is a new entry, a package
# a line needs is a new item of it. A runtime unpacked before a package was added to its line gets
# that package on its next use (also when reused from the cache), the others kept.
#
#   cx tool setup intel-gpu-runtime                          # detect, else install the right line
#   cx tool setup intel-gpu-runtime --version=24.35.30872.36 # the legacy1 line
#
# Computing on the GPU also needs access to its device (/dev/dri/renderD*: the render group,
# or a desktop session on the machine): the setup says when that is missing. In WSL2 the GPU is
# /dev/dxg and the 26.35 line works with the Windows driver. On Windows the Intel graphics
# driver brings the runtime; macOS has no Intel GPU compute.

storage_key: intel-gpu-runtime

# The release lines of the runtime (Intel's), each with its packages: their GitHub path and sha256 (from the
# releases' checksum lists or the digest GitHub publishes for the asset; Intel publishes none for the legacy
# graphics compiler and the Level Zero loader: those are the sha256 of the first download, 2026-10-02).
#
#   for:                what the line is for (said when it is installed)
#   default:            the line of a machine whose Intel GPUs no other line names, or without one (WSL2)
#   device_id_prefixes: the first byte of the PCI device ids the line is for: taken when every Intel GPU of the
#                       machine has one of them
#   provides:           a file of the package that the runtime must have, and the variable its folder goes on for
#                       the steps that follow (dir: that folder, when it is not the file's own). A command the
#                       package names <name>-<version> (its update-alternatives make <name>, which an unpacking
#                       without root does not run) gets a link of that name, to the newest one
releases:
  '26.35.39758.10':
    for: 'Gen12 and later GPUs: Tiger Lake, Alder/Raptor Lake, Meteor/Arrow/Lunar/Panther Lake, Arc'
    default: true
    packages:
      - path: intel/compute-runtime/releases/download/26.35.39758.10/intel-opencl-icd_26.35.39758.10-0_amd64.deb
        sha256: '61712caaddeba3d38e4f79e2a0fb23fea25596ca2d72c3144c6eea2331ec4301'
      - path: intel/compute-runtime/releases/download/26.35.39758.10/libze-intel-gpu1_26.35.39758.10-0_amd64.deb
        sha256: 'c19a641b953d55aebbf1d51bec364a84bf629f985e02fbbe6dc70224c0e88470'
      - path: intel/compute-runtime/releases/download/26.35.39758.10/libigdgmm12_22.10.0_amd64.deb
        sha256: '6031a63d6e8a12ce61c14efc15f2c8e727061286e3820b8594e6d00615e04d54'
      - path: intel/intel-graphics-compiler/releases/download/v2.41.5/intel-igc-core-2_2.41.5+22716_amd64.deb
        sha256: '0a6e64a663ae65a0fa02d6912ae3b6b37cf85b90c21cc423fd9fef70aaf4f628'
      - path: intel/intel-graphics-compiler/releases/download/v2.41.5/intel-igc-opencl-2_2.41.5+22716_amd64.deb
        sha256: '779e1b9e88098eb25711e9a8f67c2752665bad22f134aa40ed5649f6e1b87058'
      - path: oneapi-src/level-zero/releases/download/v1.34.0/libze1_1.34.0+u24.04_amd64.deb
        sha256: '45210e4549cd965ad7b9f160eefe53cbcdba01af341bea7ac7ba0aedeeb613ba'

      # Intel's offline compiler: the ahead-of-time compilation of SYCL kernels for these GPUs (icx
      # -fsycl-targets=spir64_gen - PyTorch's XPU build on Linux)
      - path: intel/compute-runtime/releases/download/26.35.39758.10/intel-ocloc_26.35.39758.10-0_amd64.deb
        sha256: 'c64bff586edf2bd9b49f3e4c9c2be25e05c43466e4dafa2a2c3948d498c736b7'
        provides:
          file: usr/bin/ocloc
          env: PATH

      # The headers of Level Zero, which a program built against it includes (PyTorch's XPU build: ATen's
      # LazyLevelZero)
      - path: oneapi-src/level-zero/releases/download/v1.34.0/libze-dev_1.34.0+u24.04_amd64.deb
        sha256: '2813bb3b06d0d8c0f3c771051defabdd74da2e454661cd654ebabcfb5ab21c01'
        provides:
          file: usr/include/level_zero/ze_api.h
          env: CPATH
          dir: usr/include

  '24.35.30872.36':
    for: 'legacy1, Gen8, Gen9 and Gen11 GPUs: Broadwell, Skylake, Kaby Lake, Coffee Lake, Ice Lake, ...'
    # Broadwell 16xx, Braswell 22xx, Skylake 19xx, Kaby Lake 59xx, Apollo Lake 5Axx, Gemini Lake 31xx,
    # Coffee/Whiskey Lake 3Exx, Comet Lake 9Bxx, Amber Lake 87xx, Ice Lake 8Axx, Elkhart Lake 45xx, Jasper Lake 4Exx
    device_id_prefixes: ['16', '22', '19', '59', '5a', '31', '3e', '9b', '87', '8a', '45', '4e']
    packages:
      - path: intel/compute-runtime/releases/download/24.35.30872.36/intel-opencl-icd-legacy1_24.35.30872.36_amd64.deb
        sha256: 'bbe71e4f414259e06a10cde72c29a2bd78d41b2bb2f6f8463b1806797fe66e85'
      - path: intel/compute-runtime/releases/download/24.35.30872.36/intel-level-zero-gpu-legacy1_1.5.30872.36_amd64.deb
        sha256: '40dfbd15ab62de036a00824b304a2aa1fa2d81ad60ef83da09cfe3c5a80c429f'
      - path: intel/compute-runtime/releases/download/24.35.30872.36/libigdgmm12_22.5.0_amd64.deb
        sha256: 'cc29d14df83cff1b3c6a66baa39257f0211b168ab43a99c2dc62a3734431bc23'
      - path: intel/intel-graphics-compiler/releases/download/igc-1.0.17537.24/intel-igc-core_1.0.17537.24_amd64.deb
        sha256: 'c1e1ecdfe2064c047c552651cfdcdafc504f2033afafba65654338b880048b67'
      - path: intel/intel-graphics-compiler/releases/download/igc-1.0.17537.24/intel-igc-opencl_1.0.17537.24_amd64.deb
        sha256: 'dd016400f87fa2b6a9fa9fbcca7eb4a2629174a29de679709f9bec5cede88b0e'
      - path: oneapi-src/level-zero/releases/download/v1.34.0/libze1_1.34.0+u24.04_amd64.deb
        sha256: '45210e4549cd965ad7b9f160eefe53cbcdba01af341bea7ac7ba0aedeeb613ba'

install_help_text: |
  Could not set up the Intel GPU compute runtime on this system.
  It needs Linux on x86_64 with an Intel GPU (Gen8 or later); on Windows install or update
  the Intel graphics driver. The packages are also in most distributions (sudo):
  intel-opencl-icd and libze-intel-gpu1 (Ubuntu/Debian), intel-compute-runtime (Fedora, Arch).
