authors: Grigori Fursin

# Azure CLI ("az") - Microsoft's cross-platform command line interface for Azure
# (https://learn.microsoft.com/cli/azure).
#
# az is a Python application rather than a single static binary, so what upstream
# publishes differs sharply per platform. The install ladder below follows that
# reality - see api_v1.py for the code and the exact per-OS reasoning:
#
#   Windows : TIER 1 - the official x64 ZIP package. Fully self-contained (it
#             bundles its own python.exe + python314.dll + Lib/), needs no admin
#             rights, and pins an exact version. Entry point is "bin\az.cmd".
#             Fallback: winget (the MSI needs an elevated prompt).
#   macOS   : TIER 1 - the official macos tarball from GitHub releases. It is
#             relocatable ("bin/az" is a relative symlink into "libexec/"), but
#             it is NOT self-contained: the upstream launcher refuses to start
#             unless AZ_PYTHON points at a matching CPython. api_v1.py resolves
#             one and writes a small "bin/az" wrapper around it; when no matching
#             CPython exists on the host it steps down to brew instead of
#             leaving a broken install behind.
#             Fallback: brew (this is the only method Microsoft supports on macOS).
#   Linux   : no portable download is published at all - no tarball, no static
#             binary, and the .deb/.rpm bundle a non-relocatable venv rooted at
#             /opt/az. So Linux starts one rung lower, at the package manager.
#             api_v1.py picks the Microsoft-maintained repo script on apt-based
#             distros (plain "apt install azure-cli" fails on stock Debian and
#             Ubuntu because the package lives in a Microsoft repo that has to
#             be added first) and the generic sudo package manager elsewhere.

names:
  # ".cmd" on Windows, "" on Linux/macOS - "az" is a batch shim there, not an .exe
  - az{{global.host.vars.file_ext_cmd2}}
  - az

# "az --version" opens with a line like:
#   azure-cli                         2.89.1
# Anchored to the start of a line (the engine matches with re.MULTILINE) so the
# per-dependency lines further down the same block cannot be picked up instead.
match_version:
  - regex: '^azure-cli\s+([\d][^\s]*)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

# `cx tool setup az --versions`. The repo also tags every command module
# separately ("azure-cli-vm-2.2.0", "azure-cli-core-2.0.30", ...), so the regex
# demands a digit straight after "azure-cli-" to keep only CLI releases.
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/Azure/azure-cli'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/azure-cli-(\d+\.\d+\.\d+)(?:\^\{\})?$'

# Version installed when the caller does not ask for a specific one. Pinned on
# purpose: resolving "latest" over the network at install time would make the
# same command produce different results on different days. Bump this line to
# move everyone forward; `cx tool setup az --versions` lists what is available.
default_version: '2.89.1'

# Download templates used by api_v1.py.
#   - The Windows ZIP is published on Microsoft's blob store AND mirrored on the
#     GitHub release, so both are handed to task/download-file, which walks them
#     in order and stops at the first success - an outage on either is survivable.
#   - The macOS tarball is published on the GitHub release only.
download_url_templates_windows:
  - 'https://azcliprod.blob.core.windows.net/zip/{filename}'
  - 'https://github.com/Azure/azure-cli/releases/download/azure-cli-{version}/{filename}'
download_url_templates_darwin:
  - 'https://github.com/Azure/azure-cli/releases/download/azure-cli-{version}/{filename}'

# First release carrying each prebuilt asset - below these api_v1.py steps down
# to a package manager rather than requesting a URL that returns 404.
min_version_zip: '2.57.0'
min_version_macos_tarball: '2.85.0'

# The distro package is named "azure-cli", not "az" (the artifact alias, which is
# what task/setup substitutes into {{name}} by default).
package_name: azure-cli

###############################################################################
# Fallbacks. Reached only when api_v1.py cannot (or should not) download - it
# then returns the command below for task/setup to run.
install_cmd:
  windows: '{{global.winget.qpath}} install --exact --id=Microsoft.AzureCLI --source winget {{global.init.winget_install_flags|}}'
  darwin: 'brew update && brew install {{name}}'
  linux: '{{global.host.os_extra.install_cmd_sudo}}'

install_cmd_version:
  windows: '{{global.winget.qpath}} install --exact --id=Microsoft.AzureCLI --version={{simple_version}} --source winget {{global.init.winget_install_flags|}}'
  # No darwin entry on purpose: brew ships a single "azure-cli" formula with no
  # versioned variants, so "brew install azure-cli@2.51.0" would simply fail.
  # Without this key task/setup reuses install_cmd above and installs current.
  linux: '{{global.host.os_extra.install_cmd_sudo_version}}'

requires_sudo:
  linux: True

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21

extra_paths:
  linux:
    - '/usr/bin'
    - '/usr/local/bin'
    - '{{user_home}}/bin'
    - '{{user_home}}/lib/azure-cli/bin'
    - '/home/linuxbrew/.linuxbrew/**'
  darwin:
    - '/opt/homebrew/bin'
    - '/opt/homebrew/opt/azure-cli/bin'
    - '/usr/local/bin'
    - '/usr/local/opt/azure-cli/bin'
  windows:
    # Where the MSI (and therefore winget) drops the az.cmd shim
    - 'C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin'
    - 'C:\Program Files (x86)\Microsoft SDKs\Azure\CLI2\wbin'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'

install_help_text: |
  Could not set up the Azure CLI automatically.

  Install it by hand, put "az" on PATH, then re-run `cx tool setup az`:

    Windows: winget install --exact --id Microsoft.AzureCLI
             (or unzip https://azcliprod.blob.core.windows.net/zip/azure-cli-2.89.1-x64.zip
              anywhere and add its "bin" folder to PATH - no admin rights needed)
    macOS  : brew update && brew install azure-cli
    Linux  : curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash    # Debian/Ubuntu
             sudo dnf install azure-cli                                # RHEL/Fedora
             sudo zypper install azure-cli                             # SUSE
             sudo tdnf install azure-cli                               # Azure Linux

  Full instructions: https://learn.microsoft.com/cli/azure/install-azure-cli

  Note on `--version=X.Y.Z`: it is honoured exactly by the Windows and macOS
  downloads. The Linux package managers are best-effort - a distro numbers its
  own builds ("2.51.0-1~jammy", "2.51.0-1.el8"), so an exact match may not exist.
