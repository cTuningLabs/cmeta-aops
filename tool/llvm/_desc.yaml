storage_key: llvm

names:
  - clang{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "clang version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'

uses:
- task: setup,a2f9b61079ce4333
  name: msvc,e823256bbbe54b4e
  skip_if_not_win: True

install_cmd:
  darwin: '{{global.tool--brew.qpath}} install llvm'

install_cmd_version:
  darwin: '{{global.tool--brew.qpath}} install llvm@{{major_version}}'

install_help_text:
  Please check https://releases.llvm.org
    or https://visualstudio.microsoft.com/vs/community !

install_uses:
  darwin:
    - task: setup,a2f9b61079ce4333
      name: brew,27859c999bdd4085

extra_paths:
  darwin:
    - "/opt/homebrew/opt/llvm*/**"
