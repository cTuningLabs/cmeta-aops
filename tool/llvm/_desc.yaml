# Windows: the winget install needs administrator rights.
# LLVM.LLVM: an MSI without a scope, so per machine (the release download needs nothing).
# A quiet run (-q) that is not elevated does not start it (task/setup/install.py, unattended_rights);
# without -q, Windows asks (UAC).
requires_sudo:
  windows: True

install_help_text:
  Please check https://releases.llvm.org !

#install_uses:
#  linux:
#    - task: setup,a2f9b61079ce4333
#      name: brew,27859c999bdd4085

extra_paths:
  linux:
    - "/home/linuxbrew/.linuxbrew/**"

    # A distribution's LLVM packages (clang-18, libomp-18-dev on Debian and Ubuntu) keep the compiler
    # out of PATH, in /usr/lib/llvm-<N>/bin
    - "/usr/lib/llvm-*/bin"
  darwin:
    - "/opt/homebrew/opt/llvm*/**"
  windows:
    - "C:\\Program Files\\LLVM\\**"
    - "C:\\Program Files\\LLVM-*\\**"
    - "D:\\Program Files\\LLVM\\**"
    - "D:\\Program Files\\LLVM-*\\**"
    - "{{global.host.os_env.LOCALAPPDATA}}\\Microsoft\\WinGet\\Packages\\**"

