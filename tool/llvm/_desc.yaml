storage_key: llvm

names:
  - clang{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "clang version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'

uses:
- task: setup,a2f9b61079ce4333
  name: msvc,e823256bbbe54b4e
  skip_if_not_win: True

install_cmd:
  darwin: '{{global.brew.qpath}} install llvm'
  linux: '{{global.brew.qpath}} install llvm'
  windows: "{{global.winget.qpath}} install --id=LLVM.LLVM -e --no-upgrade {{global.init.winget_install_flags|}}"

install_cmd_version:
  darwin: '{{global.brew.qpath}} install llvm@{{major_version}}'
  linux: '{{global.brew.qpath}} install llvm@{{major_version}}'
  windows: "{{global.winget.qpath}} install --id=LLVM.LLVM -e --version={{simple_version}} --no-upgrade {{global.init.winget_install_flags|}}"

install_help_text:
  Please check https://releases.llvm.org !

install_uses:
  linux:
    - task: setup,a2f9b61079ce4333
      name: brew,27859c999bdd4085

extra_paths:
  linux:
    - "/home/linuxbrew/.linuxbrew/bin"
  darwin:
    - "/opt/homebrew/opt/llvm*/**"
  windows:
    - "C:\\Program Files\\LLVM\\**"
    - "C:\\Program Files\\LLVM-*\\**"
    - "D:\\Program Files\\LLVM\\**"
    - "D:\\Program Files\\LLVM-*\\**"
