storage_key: llvm

default_version: 22.1.5

names:
  - clang{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "clang version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/llvm/llvm-project'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/(?:.+?-)?([^^\s]+)(?:\^\{\})?$'

uses:
  - task: setup,a2f9b61079ce4333
    name: msvc,e823256bbbe54b4e
    if: '"{{global.host.os.uname}}" == "windows"'

  - task: setup,a2f9b61079ce4333
    name: macosx.sdk,70b0c05382be4e34
    if: '"{{global.host.os.uname}}" == "darwin"'
    with:
      add_env: True

