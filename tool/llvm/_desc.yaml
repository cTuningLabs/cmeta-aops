storage_key: llvm

# Install (api_v1.py) downloads the official prebuilt release for the requested version. An exact
# version (22.1.7) is used as is; a partial one (--version=22, 22.1) is resolved to the newest
# published release that starts with it, read from the upstream tags like cmd_get_versions.
default_version: 23.1.3

# The versions "latest" must not take: a release that has no download for a system (the three tools of one LLVM
# release - llvm, clang, clang-cpp - say the same)
latest_limits:
  - exclude: '==23.1.6'
    os: [darwin]
    reason: 'the release has no macOS download (23.1.5 has)'
    since: '2026-11-24'

# The OpenMP runtime of clang (omp.h, libomp). The packages of some releases have none (Linux: 21.x does, 23.x has
# it): after an install, and on every use of an LLVM this tool unpacked into its own cache entry, the release is
# looked at - not its number - and a release without the runtime gets it, built from the same release's sources with
# its own clang (cmake, ninja), into the folders where a release with OpenMP keeps it (clang's resource folder
# "include", lib/<target triple>). An LLVM of the system or of another installer is never written. Nothing here
# names a version that lacks it: a future release with the runtime needs nothing, one without it needs no edit when
# it publishes one of the layouts below with a sha256.
#
#   systems: where the runtime is built (macOS and Windows: not tried yet - a release there is used as it is)
#   sources: the layouts LLVM publishes its sources in, the first one the release has is taken: up to 21.x the
#            runtime's own source and LLVM's CMake modules (which its standalone build needs beside it), from 22.x the
#            whole llvm-project only (folders: the two folders taken from it). Each file is unpacked into a folder
#            named by its key (its top folder dropped)
#   sha256:  pinned digests, by release; GitHub publishes one for the assets of the newer releases (from 20.x),
#            which is taken when none is pinned. A release with neither is left without OpenMP (said, not an
#            error): pin its digests here
#   cmake_args: the configure words of the runtime (no offloading, no debugger plugin, no tests)
openmp_runtime:
  systems: [linux]
  sources:
    - files:
        openmp: 'openmp-{version}.src.tar.xz'
        cmake: 'cmake-{version}.src.tar.xz'
    - files:
        llvm-project: 'llvm-project-{version}.src.tar.xz'
      folders: [openmp, cmake]
  sha256:
    '21.1.8':
      openmp-21.1.8.src.tar.xz: '856b023748b41ac7b2c83fd8e9f765ff48a4df2fe6777d2811ef7c7ed8f2f977'
      cmake-21.1.8.src.tar.xz: '85735f20fd8c81ecb0a09abb0c267018475420e93b65050cc5b7634eab744de9'
  cmake_args:
    - '-DOPENMP_ENABLE_LIBOMPTARGET=OFF'
    - '-DLIBOMP_OMPD_SUPPORT=OFF'
    - '-DOPENMP_ENABLE_TESTING=OFF'
    - '-DLIBOMP_INSTALL_ALIASES=OFF'

names:
  - clang{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "clang version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/llvm/llvm-project'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/llvmorg-(\d+\.\d+\.\d+)(?![\w.-])'

uses:
  - task: setup,a2f9b61079ce4333
    name: msvc,e823256bbbe54b4e
    if: '"{{global.host.os.uname}}" == "windows"'

  - task: setup,a2f9b61079ce4333
    name: macosx.sdk,70b0c05382be4e34
    if: '"{{global.host.os.uname}}" == "darwin"'
    with:
      add_env: True

