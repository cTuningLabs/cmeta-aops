authors: Grigori Fursin

names:
  - screen{{global.host.vars.file_ext_exe}}

# Homebrew's copy on macOS even when its bin folder is not on the PATH of a non-login shell
extra_paths:
  darwin:
    - /opt/homebrew/bin
    - /usr/local/bin

match_version:
  - regex: 'Screen version\s+([0-9]+\.[0-9]+\.[0-9]+)'
    group: 1

cmd_get_version: '{{tool_path}} -v'

# Every version is taken: Apple's Screen 4.00.03 (/usr/bin/screen of macOS) prints its version for -v and exits 1,
# Screen 4.09 and 5.0 exit 0. Of several copies the newest is used (Homebrew's next to Apple's).
cmd_get_version_exit_codes: [0, 1]

# GNU Screen publishes source; use the host's package manager when it is missing.
install_cmd:
  linux: '{{global.host.os_extra.install_cmd_sudo}}'
  darwin: '{{global.brew.qpath}} install screen'
  windows: ''

requires_sudo:
  linux: True

install_help_text: |
  GNU Screen runs on POSIX hosts: the Linux distribution's package, or Homebrew's on macOS ("brew install screen";
  macOS also has an old Screen of its own in /usr/bin). From Windows, select a Linux/macOS host, WSL or a container.
