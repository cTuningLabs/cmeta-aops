storage_key: clang

cache_params_use: 
  all:
    llvm:
      version: "{{global.llvm.version}}"

only_paths:
  all:
    - "{{global.llvm.path_bin}}"

names:
  - clang{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "clang version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'

uses:
- task: setup,a2f9b61079ce4333
  name: llvm,532bab2de2e94c7d
  version: "{{params.version|$None}}"

uses_os:
  linux:
    - task: setup,a2f9b61079ce4333
      name: gcc,222c51b9e9eb4887
  darwin:

install_help_text:
  Please check https://releases.llvm.org !
