storage_key: clang

cache_params_use: 
  all:
    llvm:
      version: "{{global.llvm.version}}"
      path: "{{global.llvm.path}}"

only_paths:
  all:
    - "{{global.llvm.path_bin}}"

names:
  - clang{{global.host.vars.file_ext_exe}}

match_version: 
  - regex: "clang version\\s*([\\d.]+)"
    group: 1

cmd_get_version: '{{tool_path}} --version'
cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/llvm/llvm-project'
cmd_get_versions_uses: 
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/(?:.+?-)?([^^\s]+)(?:\^\{\})?$'

uses:
  - task: setup,a2f9b61079ce4333
    name: llvm,532bab2de2e94c7d
    version: "{{params.version|$None}}"

uses_os:
  linux:
    - task: setup,a2f9b61079ce4333
      name: gcc,222c51b9e9eb4887
  darwin:

install_help_text:
  Please check https://releases.llvm.org !

features:
  windows:
    flags:
      include_path: '-I'
      dynamic_build: ''
      static_build: '-fms-runtime-lib=static'
      dynamic_build_debug: ''
      static_build_debug: '-fms-runtime-lib=static'
      exe_file: '-o '
      lib_path: '-Wl,/LIBPATH:'
      lib_prefix: '-Wl,'
    vars:
      file_ext_exe: .exe
  linux:
    flags:
      include_path: '-I'
      dynamic_build: ''
      static_build: '-static'
      dynamic_build_debug: ''
      static_build_debug: '-static'
      exe_file: '-o '
      lib_path: '-L'
      lib_prefix: '-l'
    vars:
      file_ext_exe: 
  darwin:
    flags:
      include_path: '-I'
      dynamic_build: ''
      static_build: ''
      dynamic_build_debug: ''
      static_build_debug: ''
      exe_file: '-o '
      lib_path: '-L'
      lib_prefix: '-l'
    vars:
      file_ext_exe: 
