authors: Grigori Fursin

# hyperfine, the command-line benchmarking tool - https://github.com/sharkdp/hyperfine (MIT / Apache-2.0).
#
# Installed from the pinned upstream release (install ladder tier 1) by the shared helper
# category/tool/api/common_release.py: the asset for this OS and CPU (x86_64 / aarch64 on Windows,
# Linux and macOS), the binary unpacked and named "hyperfine". Upstream publishes no checksums for
# its release assets, so the download is over HTTPS only. An installation already on the PATH
# (or in extra_paths) is detected and used first.
#
#   cx tool setup hyperfine                         # detect, else install the pinned release
#   cx tool setup hyperfine --version=<x.y.z> --new # another release
#   cx tool setup hyperfine --versions              # the released versions
#
# Quick checks:
#   cx tool run hyperfine -- --version
#   cx tool run hyperfine -- --runs 5 "python -c pass"                 # mean / min / max of 5 runs
#   cx tool run hyperfine -- --warmup 3 --export-json t.json "cmd a" "cmd b"   # a comparison, recorded
#
# hyperfine times whole commands - warmup runs, outlier detection, exports to JSON / CSV / Markdown -
# the first answer to "how long does this command take" before any deeper profiling.

names:
  - hyperfine{{global.host.vars.file_ext_exe}}

default_version: '1.21.0'

match_version:
  - regex: 'hyperfine (\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/sharkdp/hyperfine'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)(?![\w.-])'

extra_paths:
  linux:
    - '{{user_home}}/.local/bin'
    - '{{user_home}}/.cargo/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/bin'
  darwin:
    - '/opt/homebrew/bin'
    - '/usr/local/bin'
    - '{{user_home}}/.cargo/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Links'
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'
    - '{{user_home}}\.cargo\bin'

install_help_text: |
  Could not install hyperfine from its release automatically on this system.
  Install it as described at https://github.com/sharkdp/hyperfine#installation and run "cx tool setup hyperfine" again.
