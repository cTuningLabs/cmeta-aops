names:
  - libcudart{{global.host.vars.file_ext_dlib}}
  - cudart{{global.host.vars.file_ext_lib}}

match_version: 
  - regex: '^.*$'
    group: 0

cache_params_use: 
  all:
    nvcc:
      version: "{{global.nvcc.version}}"
      path: "{{global.nvcc.path}}"

only_paths:
  all:
    - "{{global.nvcc.features.paths.home}}/**"

uses:
  # A toolkit that nvcc installed from NVIDIA's archives gets the libraries asked for here
  # (cublas, cufft, ...) when it lacks them
  - task: setup,a2f9b61079ce4333
    name: nvcc,7f0e9193fef74919
    with:
      cuda_libs: '{{params.with.lib_names|$None}}'

