names:
  - kubectl{{global.host.vars.file_ext_exe}}

match_version:
  - regex: 'v(\d+\.\d+\.\d+)'
    group: 1

cmd_get_version: '{{tool_path}} version --client'

default_version: '1.31.0'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/kubernetes/kubernetes'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: '\brefs/tags/v(\d+\.\d+\.\d+)\b'

install_cmd:
  linux: 'snap install kubectl --classic'
  darwin: 'brew install kubectl'
  windows: '{{global.winget.qpath}} install --id=Kubernetes.kubectl -e --no-upgrade --source winget {{global.init.winget_install_flags|}}'

install_cmd_version:
  linux: 'snap install kubectl --classic --channel={{simple_version}}/stable'
  darwin: 'brew install kubectl@{{simple_version}}'
  windows: '{{global.winget.qpath}} install --id=Kubernetes.kubectl -e --version={{simple_version}} --no-upgrade --source winget {{global.init.winget_install_flags|}}'

requires_sudo:
  linux: True

extra_paths:
  linux:
    - '/snap/bin'
    - '/usr/local/bin'
    - '/home/linuxbrew/.linuxbrew/**'
  darwin:
    - '/opt/homebrew/bin'
    - '/opt/homebrew/**'
    - '/usr/local/bin'
  windows:
    - '{{global.host.os_env.LOCALAPPDATA}}\Microsoft\WinGet\Packages\**'
    - 'C:\Program Files\kubectl\**\'
    - 'D:\Program Files\kubectl\**\'
