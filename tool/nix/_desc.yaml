# Nix (https://nixos.org, https://github.com/NixOS/nix, LGPL-2.1): the package manager with reproducible, declarative
# builds; on Linux and macOS, natively (on Windows only inside WSL2). Detected where it is (the multi-user install
# puts it in /nix/var/nix/profiles/default/bin, a user profile in ~/.nix-profile/bin), else installed with the
# Determinate Nix Installer (https://github.com/DeterminateSystems/nix-installer): the installer is downloaded first
# and then run, "install --no-confirm" (upstream Nix with flakes enabled, the multi-user daemon, a clean uninstall
# with "/nix/nix-installer uninstall"). It needs root: it asks sudo itself, so a host with passwordless sudo
# installs unattended. The install touches the system (/nix, a daemon, the shell profiles): nothing is put in the
# cMeta cache, which is why it is a plain install_cmd and not a tier-1 download.
# Not yet: nix as a rung of the install ladder ("nix profile install nixpkgs#<tool>") - the tool is the first step.
# Checked 2026-10-07: the command names and the installer's flags; the install itself is tested on the fleet.
names:
  - nix

# "nix --version" prints "nix (Nix) 2.33.1" (or "nix (Determinate Nix 3.x) 2.33.1")
match_version:
  - regex: 'nix \([^)]*\) ([\d.]+)'
    group: 1
  - regex: '([\d]+\.[\d.]+)'
    group: 1

cmd_get_version: '{{tool_path}} --version'

cmd_get_versions: '{{global.git.qpath}} ls-remote --tags https://github.com/NixOS/nix'
cmd_get_versions_uses:
  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
cmd_get_versions_regex: 'refs/tags/(\d+\.\d+\.\d+)(?:\^\{\})?$'

install_help_text: |
  Could not install Nix automatically.
  Linux, macOS:  curl -fsSL https://install.determinate.systems/nix | sh -s -- install
                 (https://nixos.org/download for the upstream installers)
  Windows:       Nix runs inside WSL2 only (install it in the distribution, then "cx tool setup nix" there).
  Open a new terminal afterwards and retry "cx tool setup nix".

# The installer is downloaded first and then run; "--no-confirm" takes the defaults without a question; it elevates
# itself with sudo (passwordless sudo = unattended). No version pin: the installer ships the Nix it bundles.
install_cmd:
  linux: '{{global.curl.qpath}} -fsSLo nix-installer.sh https://install.determinate.systems/nix && sh nix-installer.sh install --no-confirm && rm -f nix-installer.sh'
  darwin: '{{global.curl.qpath}} -fsSLo nix-installer.sh https://install.determinate.systems/nix && sh nix-installer.sh install --no-confirm && rm -f nix-installer.sh'

requires_sudo:
  linux: True
  darwin: True

install_uses:
  all:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21

# Where an installed nix lives when the current shell has not sourced its profile yet
extra_paths:
  linux:
    - '/nix/var/nix/profiles/default/bin'
    - '{{user_home}}/.nix-profile/bin'
  darwin:
    - '/nix/var/nix/profiles/default/bin'
    - '{{user_home}}/.nix-profile/bin'
