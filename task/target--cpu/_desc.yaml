store_global: True
storage_key: target--cpu
cache: True

env_if_not_used:
  CMETA_TARGET_CPU: 0
env:
  CMETA_TARGET_CPU: 1

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: cpu
  hardware: 'the host CPU (x86-64, Arm64)'
  host_os: [linux, windows, darwin]
  status: supported
