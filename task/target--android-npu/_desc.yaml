store_global: True
storage_key: target--android-npu
cache: False

# The device: target--android-cpu selects it (adb, by serial: --use.target--android-cpu.serial=<s/n>)
# and the NDK toolchain and sysroot follow; programs built for android-npu are pushed and run over
# adb. api_v1.py then asks the device which NPU a program started from the adb shell can reach:
# the NNAPI accelerators (AIDL services, HIDL lshal), and which vendor stack is there.
uses:
  - task: target--android-cpu,eb4790d97cf74df9

env_if_not_used:
  CMETA_TARGET_ANDROID_NPU: 0
env:
  CMETA_TARGET_ANDROID_NPU: 1

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: npu
  hardware: 'the NPU of an Android device (NNAPI and the vendor stacks)'
  host_os: [linux, windows, darwin]
  device_os: android
  status: supported
