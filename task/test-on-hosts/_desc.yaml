authors: Grigori Fursin

# cx commands on several hosts at once, each in a throwaway cMeta home (README.md):
#
#   cx task run test-on-hosts --cmds="task run explore-tool-versions yq;tool check-updates" [--hosts=a,b,here]
#   cx task run test-on-hosts --action=peek --id=<round>
#   cx task run test-on-hosts --action=collect --id=<round> [--files=*.jsonl] [--to=<folder>]
#   cx task run test-on-hosts --action=remove --id=<round>

cache: False
store_global: False

cli_params:
  action:
    values: [launch, peek, collect, remove]

# The keys of the config artifact task-test-on-hosts, this machine's defaults of the rounds.

configs:
  task-test-on-hosts:
    desc: 'the defaults of the test-on-hosts rounds of this machine'
    keys:
      hosts:
        desc: 'the hosts of a round when --hosts is not given: host aliases, a list or comma-separated (the test
          machines of a fleet); empty: here, this machine'
        type: list
        example: host-a,host-b
      here_dir:
        desc: 'where this machine''s part of a round runs (<here_dir>/test-on-hosts-<id>); empty: ~/cmeta-tests. Keep it
          short on Windows - MSVC writes no file beyond 260 characters'
        type: path
        example: D:\cmeta-tests
