store_global: True
storage_key: target--android-gpu
cache: False

# The device: target--android-cpu selects it (adb, by serial: --use.target--android-cpu.serial=<s/n>)
# and the NDK toolchain and sysroot follow, as for the CPU; programs built for android-gpu are
# pushed and run over adb like any Android program. api_v1.py then asks the device for its GPU:
# the Vulkan devices (cmd gpu vkjson), the GLES driver (SurfaceFlinger) and the OpenCL library.
uses:
  - task: target--android-cpu,eb4790d97cf74df9

env_if_not_used:
  CMETA_TARGET_ANDROID_GPU: 0
env:
  CMETA_TARGET_ANDROID_GPU: 1

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: gpu
  hardware: 'the GPU of an Android device (Vulkan, OpenCL, GLES)'
  host_os: [linux, windows, darwin]
  device_os: android
  status: supported
