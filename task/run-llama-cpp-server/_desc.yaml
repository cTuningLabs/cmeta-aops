authors: Grigori Fursin

# A server is a live thing: never cached, nothing stored.
cache: false
store_global: false

usage: |
  cx task run run-llama-cpp-server                                        Qwen3-8B (Q4_K_M) on CUDA, port 8686, detached
  cx task run run-llama-cpp-server --model=hf-ggml-org@gpt-oss-20b-GGUF     the larger model: the layers that fit on the GPU
  cx task run run-llama-cpp-server --compute=cpu --port=8687
  cx task run run-llama-cpp-server --action=status
  cx task run run-llama-cpp-server --action=stop

  The server's record and log: the state artifact local:llama-cpp-server-<port> (cx state ls).
  What a start takes when its command line does not say: config::task-run-llama-cpp-server (below).
  A gateway artifact that points harnesses at it (where the AI gateways are plugged): cxai --gateway=<its alias>

# The defaults of a start on this machine (a word on the command line wins): a page of the server sets them, and a
# server kept by its host (server: run: cxt run-llama-cpp-server --foreground) takes them at its next start.

configs:
  task-run-llama-cpp-server:
    desc: What a llama.cpp server of this machine starts with when its command line does not say (task run-llama-cpp-server); a server that runs takes a change at its next start.
    keys:
      model:
        desc: The model artifact, a GGUF one (cx model ls).
        example: hf-Qwen@Qwen3-8B-GGUF
        default: hf-Qwen@Qwen3-8B-GGUF
      filename:
        desc: Which file of the model artifact (its _desc-<file>.yaml); empty - its first.
      compute:
        desc: "The llama.cpp build, which is the hardware it runs on: cuda (an NVIDIA GPU), cpu, metal (Apple silicon)."
        values: [cuda, cpu, metal]
        default: cuda
      ctx_size:
        desc: The context window in tokens (Claude Code's first request alone is about 17k tokens).
        type: int
        default: 32768
      gpu_layers:
        desc: "Layers on the GPU: auto - as many as its memory takes (llama.cpp's --fit), the rest on the CPU; or a number."
        default: auto
      alias:
        desc: The model's name in /v1/models and in the harnesses; empty - the file's name.
      parallel:
        desc: Requests served at once (each takes its share of the context).
        type: int
        default: 1

# Which of its words are the choices of a run, for people: the cMeta CLI builder (cserver.cmeta.cli) and help read it,
# the engine never does. A choice changes what is served (the model, the device, the context) and is shown first;
# the other words say how the server is run. What each word means is the comment of its line in run() (api_v1.py).
cli_help:
  model: {choice: run, artifact: model}
  filename: {choice: run}
  compute: {choice: run}
  ctx_size: {choice: run}
  gpu_layers: {choice: run}
  parallel: {choice: run}
  action: {group: main}
