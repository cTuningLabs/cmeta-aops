uses:
  - task: runner,1e48cc0c5f6041a5

  - task: force-fail,fbc834fe54894aec
    if: '"{{global.host.os.uname}}" == "darwin"'
    text: 'task "{{task_artifact_alias}}" does not work on MacOS'

  # On Linux with an Intel GPU: its compute runtime (Level Zero and OpenCL, set up without root - intel_gpu_runtime
  # of api_v1.py). Without it SYCL sees the CPU only, and the test runs there. Other machines: as before
  - internal_func: intel_gpu_runtime

  - task: setup,a2f9b61079ce4333
    name: icpx,2dd552ea24a34a81

  - task: cmd,c9ba0a88df394d7f
    mkdir: '{{task_artifact_path}}{{os_sep}}tmp'
    storage_key: test-icpx-sycl-build
    cmd: >-
      {{global.icpx.qpath}} -fsycl {{local.flags}}
      {{task_artifact_path}}{{os_sep}}src{{os_sep}}test.cpp
      -o {{task_artifact_path}}{{os_sep}}tmp{{os_sep}}test{{global.host.vars.file_ext_exe}}

  - task: cmd,c9ba0a88df394d7f
    storage_key: test-icpx-sycl-run
    cmd: '{{task_artifact_path}}{{os_sep}}tmp{{os_sep}}test{{global.host.vars.file_ext_exe}}'

