authors: Grigori Fursin

# The harness this task runs, as run-ai and every list of harnesses find it (the tag ai-harness in _cmeta.yaml):
# its name for --harness, a title, the tool of its model list, its place in a list, the words of run-ai its run()
# takes - task/run-ai/README.md, "Harnesses as artifacts"
harness:
  name: claude
  title: 'Claude Code (Anthropic)'
  tool: claude,383841b240c74e88
  sort: 10
  takes: ['yes', long_prompt_file, gateway, main_screen, output_file]
  read_only: ['--permission-mode', 'plan']
  cache_ttl_minutes: 5
  # wires: the APIs it speaks to an AI gateway; login_pass_through: a gateway may pass its own login on; resume:
  # the flags that continue a native session ({session}: its id); chooses_session_id: cMeta names a new one
  wires: [anthropic]
  login_pass_through: true
  resume: ['--resume', '{session}']
  chooses_session_id: true

# Run the "claude" CLI non-interactively on an assembled prompt and exit:
#
#   cx task run run-claude --prompt="{prompt text}"
#   cx task run run-claude --prompt_file={file}
#   cx task run run-claude --prompt_file={file} --prompt="{extra text}" --output_file={file}
#   cx task run run-claude --prompt_file={file} --yes --stats
#
# With no prompt at all, this task opens an interactive claude session instead of
# failing:
#
#   cx task run run-claude                         # just open a claude session
#
# --interactive (short: --i or -i) asks for that session explicitly: the assembled
# prompt is preloaded as the first message and claude keeps the terminal afterwards,
# so a preset prompt can be followed up on by hand:
#
#   cx task run run-claude --prompt_file=review.txt --interactive
#   cx task run run-claude --i --prompt="look at the failing tests"
#
# Since the session owns the terminal, nothing
# can be captured: --stats, --stats_file and --output_file are switched off, and a
# non-zero exit code is reported but does not fail the task (quitting is normal).
#
# A prompt longer than 30000 characters cannot be a command line argument (Windows
# caps a whole command line at 32767 characters): an interactive session is then
# given a file with it - --long_prompt_file={file}, else {prompt_file without
# extension}-prompt.md, else a temporary file removed afterwards - and a one-line
# request to read it first; it follows it and stays interactive. A non-interactive
# run sends the prompt on stdin and never needs this.
#
# --yes runs claude fully unattended: all questions (file edits, Bash, ...) are
# answered "yes" via "--permission-mode bypassPermissions". The workspace trust
# question is skipped by claude itself in non-interactive mode ("-p").
#
# --reproducible cuts the run-to-run variation of claude (per-machine sections are
# removed from the system prompt, ambient MCP servers are ignored). It cannot make
# the output deterministic - claude has no temperature or seed flag. Pin the model
# too: "-- --model claude-haiku-4-5-20251001".
#
# --stats prints the tokens sent/received and the cost of this prompt at the end
# (claude is then asked for its JSON event stream, which is turned back into text).
# --stats_file={file} records the same statistics ("*.json" = JSON, otherwise text)
# and turns --stats on by itself.
#
# The prompt sent to claude is the text of --prompt_file (when given), then "\n",
# then the text of --prompt. The full output is streamed to the console and
# recorded into "{prompt_file without extension}-output.txt" unless --output_file
# overrides it. Anything after "--" is appended to the claude command line, e.g.
#
#   cx task run run-claude --prompt_file=p.txt -- --allowedTools "Read,Edit,Write,Bash" --permission-mode acceptEdits
#
# --add_repos={alias,alias} adds cMeta repositories to the claude context - one
# "--add-dir <path>" each, the path resolved on this machine by "cx repo find", so the
# same command works everywhere (never write --add-dir "$(...)" by hand). By default the
# repository this task lives in is added (its AGENTS.md, CLAUDE.md and skills), plus the
# repositories listed in the "agent_add_repos" key of the local cMeta config - set it once
# per machine and your own repositories are in context without any flag:
#
#   cx config set default --meta.agent_add_repos=myorg@my-knowledge-repo
#
# --add_repos=none adds nothing (not even the defaults):
#
#   cx task run run-claude                              # defaults, interactive
#   cx task run run-claude --add_repos=myorg@other-repo # + one more repository
#   cx task run run-claude --add_repos=none --prompt="..."
#
# --prompt_cache_minutes=<5|60> tells claude how long the model's provider keeps the prompt
# cache of the conversation. A request that comes later than that after the one before pays
# for the whole conversation again as a cache write; a 1-hour write costs more than a
# 5-minute one, and a pause of up to an hour then costs a cache read. By itself claude asks
# for 1 hour on a Claude subscription and for 5 minutes on a key (an API key, a gateway,
# Bedrock, Vertex, Foundry). Not given: nothing is set and claude decides as before.
#
#   cx task run run-claude --gateway=acme --prompt_cache_minutes=60
#
# See api_v1.py for the full list of flags.

# This task launches claude and changes files - never memoize it on disk
cache: False

# The words of the command line that take a number
cli_params:
  prompt_cache_minutes: {type: int, hint: 'minutes: 5 or 60'}
  autocompact: {type: str, hint: 'auto, or tokens: 400k (at least 100k)'}

# The auto-compact window of the session (--autocompact): the size at which Claude Code summarises its conversation.
# The ways, THE NEWEST FIRST, chosen by the version of the installed claude as for prompt_cache below.
#   flag      Claude Code's own option, given the value (auto, or tokens: 400k, 400000; at least 100k)
autocompact:
  ways:
    - name: autocompact-flag
      since: '2.1.304'                 # its changelog of 2.1.304 names "--autocompact" (and its k / M suffixes)
      flag: '--autocompact'
      min_tokens: 100000               # "at least 100k" (its help); run-ai refuses less before a run starts
      verified:
        - {harness: '2.1.330', os: windows, date: '2026-11-23'}

# What run-ai records of Claude Code's own settings with every request of a run (the run reference a gateway of one's
# own keeps): the settings that decide what a long session costs. Its settings file (CLAUDE_CONFIG_DIR when set),
# the keys read there - nothing else of the file - and the variables of the run's environment (or of the file's "env"
# block), each with the key of the run reference.
run_settings:
  file: '~/.claude/settings.json'
  home_env: CLAUDE_CONFIG_DIR
  file_name: settings.json
  format: json
  keys:
    autoCompactWindow: h_compact
    idleCompaction: h_idle_compact
    subagentPromptCacheTtl: h_sub_cache
    effortLevel: h_effort
    tui: h_tui
  env:
    CLAUDE_CODE_AUTO_COMPACT_WINDOW: h_compact
    CLAUDE_CODE_SUBAGENT_EFFORT: h_sub_effort
    CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS: h_idle_min

# How long the prompt cache of a conversation lives, as claude can be told (--prompt_cache_minutes): the ways, THE
# NEWEST FIRST. For the installed version - asked of the program itself, which updates itself in place - the task
# takes the first way whose `since` is not above it (no `since`: every version). A version below every `since` cannot
# be told: a lifetime asked for is then an error, and nothing is set without one.
#
#   minutes   the lifetimes a way takes, and what each one is: `settings` - keys of Claude Code's settings, which go
#             into the session's --settings - and `env` - variables of the session's environment
#   drops     the variables of the environment that would decide in the way's place: not passed on to the session
#   verified  what was really seen with a way: the version, the system, the day
#
# A claude that changes how it is told gets a NEW way above the others, with `since: <the first version that has
# it>`. The ways below stay as they are, for the machines that still run an older claude: nothing here is replaced.
prompt_cache:
  ways:
    - name: prompt-cache-ttl-setting
      since: '2.1.243'                 # its changelog: "Added promptCacheTtl and subagentPromptCacheTtl settings"
      minutes:
        5: {settings: {promptCacheTtl: 5m}}
        60: {settings: {promptCacheTtl: 1h}}
      drops: [CLAUDE_CODE_PROMPT_CACHE_TTL, FORCE_PROMPT_CACHING_5M]
      verified:
        - {harness: '2.1.330', os: windows, date: '2026-11-22'}

    - name: prompt-caching-1h-variable
      since: '2.1.108'                 # its changelog: "Added ENABLE_PROMPT_CACHING_1H ... and FORCE_PROMPT_CACHING_5M"
                                       # (2.1.129: "Fixed 1-hour prompt cache TTL being silently downgraded to 5
                                       # minutes" - below it the hour asked for is not certain to be kept)
      minutes:                         # one lifetime for the whole session there, its subagents included
        5: {env: {FORCE_PROMPT_CACHING_5M: '1'}}
        60: {env: {ENABLE_PROMPT_CACHING_1H: '1'}}
      drops: [ENABLE_PROMPT_CACHING_1H, FORCE_PROMPT_CACHING_5M]
      verified: []

uses:
  # Bootstrap host (OS detection, env, vars) - normally already resolved from global
  - task: runner,1e48cc0c5f6041a5

  # Detect / install the "claude" tool and expose {{global.claude.path}}
  - task: setup,a2f9b61079ce4333
    name: claude,383841b240c74e88
