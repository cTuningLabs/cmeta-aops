authors: Grigori Fursin

# Run the "opencode" CLI (OpenCode.AI) non-interactively on an assembled prompt
# and exit. Same flags as the sister tasks "run-claude2" and "run-codex2":
#
#   cx task run run-opencode2 --prompt="{prompt text}"
#   cx task run run-opencode2 --prompt_file={file}
#   cx task run run-opencode2 --prompt_file={file} --prompt="{extra text}" --output_file={file}
#   cx task run run-opencode2 --prompt_file={file} --yes --stats
#
# With no prompt at all, this task opens an interactive opencode session instead
# of failing (same default as run-claude2 / run-codex2):
#
#   cx task run run-opencode2                        # just open an opencode session
#
# --interactive (short: --i or -i) asks for that session explicitly: the assembled
# prompt is preloaded as the first message and opencode keeps the terminal
# afterwards, so a preset prompt can be followed up on by hand:
#
#   cx task run run-opencode2 --prompt_file=review.txt --interactive
#   cx task run run-opencode2 --i --prompt="look at the failing tests"
#
# Since the session owns the terminal, nothing can be captured: --stats,
# --stats_file and --output_file are switched off, and a non-zero exit code is
# reported but does not fail the task (quitting is normal).
#
# IMPORTANT difference from run-claude2 / run-codex2: "opencode run" has no stdin
# mode, so the prompt always travels as a command line argument - in both modes.
# The OS caps a command line (~32K chars on Windows, ~2MB argv on Linux), so a
# very long prompt file is warned about and may be refused by the OS.
#
# --yes runs opencode unattended: permissions that are not explicitly denied are
# auto-approved via "--auto".
#
# --reproducible cuts the run-to-run variation of opencode (external plugins are
# not loaded via "--pure"). It cannot make the output deterministic. Pin the model
# too: "-- --model anthropic/claude-opus-5 --variant high".
#
# --stats prints the tokens sent/received and the cost of this prompt at the end
# (opencode is then asked for its JSON event stream via "--format json", which is
# turned back into text).
# --stats_file={file} records the same statistics ("*.json" = JSON, otherwise text)
# and turns --stats on by itself.
#
# The prompt sent to opencode is the text of --prompt_file (when given), then "\n",
# then the text of --prompt. The full output is streamed to the console and
# recorded into "{prompt_file without extension}-output.txt" unless --output_file
# overrides it. Anything after "--" is appended to the opencode command line, e.g.
#
#   cx task run run-opencode2 --prompt_file=p.txt -- --model anthropic/claude-opus-5 --variant max
#
# See api_v1.py for the full list of flags, and ../../README.md for the models
# each agent can reach.

# This task launches opencode and changes files - never memoize it on disk
cache: False

uses:
  # Bootstrap host (OS detection, env, vars) - normally already resolved from global
  - task: runner,1e48cc0c5f6041a5

  # Detect / install the "opencode" tool and expose {{global.opencode.path}}
  - task: setup,a2f9b61079ce4333
    name: opencode,7777071804e84fb5
