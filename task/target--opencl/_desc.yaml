store_global: True
storage_key: target--opencl
cache: True

# On Linux an Intel GPU computes through Intel's user-space runtime, which the kernel driver does
# not bring: intel_gpu_runtime (api_v1.py) sets it up first (tool/intel-gpu-runtime, without root),
# so its ICD joins the system's. Then the OpenCL library lists the platforms and devices.
uses:
  - task: runner,1e48cc0c5f6041a5

  - internal_func: intel_gpu_runtime

  - task: setup,a2f9b61079ce4333
    name: opencl,14ea96800e2841cc

env_if_not_used:
  CMETA_TARGET_OPENCL: 0
env:
  CMETA_TARGET_OPENCL: 1

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: gpu
  hardware: 'any OpenCL GPU (the ICDs of the drivers)'
  host_os: [linux, windows, darwin]
  status: supported
