store_global: True
storage_key: target--vulkan
cache: True

# The runtime and its devices (tool/vulkan asks the loader; no SDK needed to run)
uses:
  - task: setup,a2f9b61079ce4333
    name: vulkan,5e701705d99b405b

env_if_not_used:
  CMETA_TARGET_VULKAN: 0
env:
  CMETA_TARGET_VULKAN: 1

# Building for Vulkan: headers, loader library and glslc (exports VULKAN_SDK)
sdk:
  uses:
    - task: setup,a2f9b61079ce4333
      name: vulkan-sdk,f7097a132e3349ba

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: gpu
  hardware: 'any Vulkan GPU (NVIDIA, AMD, Intel, Apple through MoltenVK, Mesa)'
  host_os: [linux, windows, darwin]
  status: supported

# How --compute=auto treats this target when it is present (detect-targets): a portable interface over the devices of
# other targets - taken only when the program supports no target of this machine's own accelerators (cuda, rocm, xpu,
# metal, an NPU)
auto: portable

# The probe of detect-targets (--compute=auto): a GPU with a driver registered for Vulkan. Linux: a GPU and the manifest
# of its driver (a distribution installs the manifests of every Mesa driver, so a manifest alone says nothing; Mesa's
# lvp, a CPU device, is no accelerator - --compute=vulkan still takes it when asked); WSL2: the GPU device of WSL and
# Mesa's driver over Direct3D 12. Windows: a present display device (or a software component of one) whose driver names
# its Vulkan manifest - what the Khronos loader reads - or the older list of the registry. macOS: MoltenVK's manifest
# from Homebrew
probe:
  linux:
    any:
      - all:
          - {drm_vendor: '0x10de', drivers: [nvidia]}
          - any:
              - {glob: '/etc/vulkan/icd.d/nvidia_icd*.json'}
              - {glob: '/usr/share/vulkan/icd.d/nvidia_icd*.json'}
      - all:
          - {drm_vendor: '0x8086', drivers: [i915, xe]}
          - {glob: '/usr/share/vulkan/icd.d/intel_icd*.json'}
      - all:
          - {drm_vendor: '0x1002', drivers: [amdgpu, radeon]}
          - {glob: '/usr/share/vulkan/icd.d/radeon_icd*.json'}
      - all:
          - {glob: /dev/dxg}
          - {glob: '/usr/share/vulkan/icd.d/dzn_icd*.json', names: true}
  windows:
    any:
      - {pnp_driver_value: {class: [Display, SoftwareComponent], value: VulkanDriverName}}
      - {registry_values: 'SOFTWARE\Khronos\Vulkan\Drivers'}
  darwin:
    any:
      - {glob: '/opt/homebrew/etc/vulkan/icd.d/*.json', names: true}
      - {glob: '/opt/homebrew/share/vulkan/icd.d/*.json', names: true}
      - {glob: '/usr/local/etc/vulkan/icd.d/*.json', names: true}
      - {glob: '/usr/local/share/vulkan/icd.d/*.json', names: true}
