store_global: True
storage_key: target--vulkan
cache: True

# The runtime and its devices (tool/vulkan asks the loader; no SDK needed to run)
uses:
  - task: setup,a2f9b61079ce4333
    name: vulkan,5e701705d99b405b

env_if_not_used:
  CMETA_TARGET_VULKAN: 0
env:
  CMETA_TARGET_VULKAN: 1

# Building for Vulkan: headers, loader library and glslc (exports VULKAN_SDK)
sdk:
  uses:
    - task: setup,a2f9b61079ce4333
      name: vulkan-sdk,f7097a132e3349ba

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: gpu
  hardware: 'any Vulkan GPU (NVIDIA, AMD, Intel, Apple through MoltenVK, Mesa)'
  host_os: [linux, windows, darwin]
  status: supported
