# A cserver and an ssh server of this machine started after every restart, before anyone logs in (api_v1.py, README.md):
# a Windows startup task as the user (S4U, no stored password), crontab @reboot on Linux and macOS.
#
#   cx task run start-after-restart                                          status: enabled? running? its log
#   cx task run start-after-restart enable --what=cserver,ssh --workdir=<folder>     ssh: the fleet's key (cx host whoami)
#   cx task run start-after-restart disable --what=cserver,ssh
#   cx task run start-after-restart start|stop --what=cserver,ssh             now, as a restart starts it

cache: False

params_map:
  arg2: action
