authors: Grigori Fursin

# run-ai: one front door to the coding-agent harnesses cMeta runs (run-claude, run-codex, run-opencode, run-openclaw,
# run-agy, run-gemini, run-hermes), with the agent's memory, skills, logs and conversations kept inside the artifact it works
# on, in a folder named !AI (README.md has the whole story):
#
#   cxt run-ai                                      # continue the latest conversation of the project around the cwd
#                                                   # an existing !AI marks the nearest workspace, including scratch sessions
#   cxai                                            # the same, shorter (cMeta 0.37.6+): cxai = cx task run run-ai
#   cxt run-ai -l                                   # a fresh dated scratch workspace, with its own !AI
#   cxt run-ai -l="quick question"                   # YYYYMMDD-HHMM.quick question (the value is a label)
#   cxt run-ai --log_project="quick question" --prompt="..."    # long form; the prompt is separate
#   cxt run-ai "one prompt"                         # one more turn of it, then exit
#   cxt run-ai --harness=codex --model=<m>,<e>      # the same conversation with another harness and model
#   cxt run-ai --cx "..."                           # --harness=codex in short
#   cxt run-ai --harness -i                         # the harnesses of this machine listed, one chosen (as a bare -gw)
#   cxt run-ai --new / --conversation=<id> / --conversations
#   cxt run-ai --summarize                          # !AI/log/<id>.summary.md, read first at the next hand-over
#   cxt run-ai --dry_run                            # everything that would be given to the harness; nothing runs
#   cxt run-ai --login [--harness=codex]            # sign the harness in on this machine (its tool set up first)
#   cxt run-ai --login --on=<host>                  # ... on another machine, from a terminal here; --login_status checks
#   cxt run-ai --project=<cRef> --on=<host> --on_screen          # create/reconnect the persistent run-ai terminal
#   cxt run-ai --project=<cRef> --on=<host> --on_screen=<name>   # another independent terminal
#
# The sub-task is chosen at run time from --harness (the old --agent still works), so it is called from api_v1.py,
# not listed here. --model=<model>[,<effort>] and --effort are turned into the harness flags from the tool's
# _desc_models.yaml; --list_models prints that list. A run continues the project's latest conversation (the native
# session of the harness, or the transcript handed over when the harness changes); --new starts another;
# --conversation=<id> picks one; --conversations lists them (conversations.py). !AI/skills is loaded as a claude
# plugin and listed in the prompt for the other harnesses. The sister task import-ai brings memories and skills in;
# --no_seed skips copying Claude Code's own memory of the folder into an empty !AI/memory.
#
# Context, read-only: --context (";"-separated cRefs or claude:<folder>), the project's ai_uses (_desc.yaml), the
# repository default (_cmr.yaml), this machine's mapping (config task-run-ai, key local_ai_uses). The memory and skills
# of those artifacts are read-only for a run, for every harness alike (pending.py): a change is staged under the
# project's !AI/pending/<alias>--<UID>/, --pending lists the proposals, --apply_pending applies them on the user's
# word, and after every run --context_guard (ask | restore | report | off) deals with what was changed there directly.
# The context is estimated in tokens against --max_context_tokens; --trim_context leaves sources out to fit it.
#
# What a run may write: --write=ask (default) | project (no questions, like --yes) | all (-w: also the used artifacts'
# memory, directly - listed, recorded, the versions before the run saved) | none (the harness's read-only mode); the
# key "write" of the config task-run-ai is this machine's default (cx config set task-run-ai --meta.write=all).
#
# The prompt cache: --prompt_cache_minutes=<minutes> says how long the model's provider keeps the prompt cache of the
# conversation (Claude Code: 5 or 60) - a request that comes later pays for the whole conversation again. Without the
# flag a run on a key asks for the key "prompt_cache_minutes" of the config task-run-ai (60; 0: the harness's own),
# and a run on the harness's own login leaves it to the harness. A harness is told the way its task declares
# (prompt_cache in the _desc.yaml of run-claude); for one whose task declares none the flag is an error.

# This task launches a coding agent - never memoize it on disk
cache: False

params_map:
  arg2: prompt       # cxt run-ai [--project=...] "the prompt" -- <harness flags>

# The switches that take a word and also mean something without one: the task category lets them come bare
# ("bare" says what a bare one means)
cli_params:
  harness: {type: str, bare: 'the harnesses of this machine to choose from (nobody to ask - as without the flag)'}
  gw: {type: str, bare: 'the gateways of this machine to choose from (nobody to ask - its default)'}
  gw_default: {type: str, bare: 'a gateway chosen from the list becomes the default'}
  write: {type: str, bare: 'all'}
  prompt_cache_minutes: {type: int, hint: 'minutes; Claude Code takes 5 or 60'}
  main_screen: bool
  autocompact: {type: str, hint: 'auto, or tokens: 400k'}

uses:
  - task: runner,1e48cc0c5f6041a5

# The config artifacts run-ai reads: its own task-run-ai (its keys in the README) and an older key of config::default.

configs:
  task-run-ai:
    desc: 'this machine''s settings of run-ai, in its local repository - the mapping local_ai_uses, the limit of the
      context estimate, what a run may write, runs of a project on another machine (the README, "Configuration")'
    keys:
      prompt_cache_minutes:
        desc: 'how long the model''s provider is asked to keep the prompt cache of a run that goes through a gateway
          with a key, in minutes, when --prompt_cache_minutes is not given: a lifetime the harness takes (Claude Code:
          5 or 60); 0 leaves it to the harness. A run on the harness''s own login is always left to the harness.'
        type: number
        default: '60'
        example: '5'
      main_screen:
        desc: 'yes: every interactive run of this machine keeps its harness on the terminal''s main screen, so that what
          it shows stays in the history one scrolls back to (claude, codex, hermes); --main_screen=no for one run. The
          sessions of /ai.sessions ask for it themselves.'
        type: yes/no
        default: 'no: the harness''s own setting'
        example: 'yes'
      autocompact:
        desc: 'the auto-compact window of a run when --autocompact is not given: the size at which the harness
          summarises its conversation - auto, or tokens such as 400k (Claude Code: at least 100k); not set or 0: the
          harness''s own window'
        type: text
        default: 'the harness''s own'
        example: 400k
      max_context_tokens:
        desc: 'the limit of the context estimate of a run, in tokens, when --max_context_tokens is not given: over it
          a run asks, or fails under -q, --yes or without a terminal'
        type: number
        default: '30000'
        example: '40000'
        secret: false                 # a count of tokens: only its name looks like a secret's (an engine that knows
                                      # the word shows its value on its settings pages; an older one hides it)
  default:
    keys:
      run_ai_max_context_tokens:
        desc: 'the older key of the limit of the context estimate of run-ai, in tokens (over it a run asks, or fails
          under -q, --yes or without a terminal): --max_context_tokens and the key max_context_tokens of the config
          task-run-ai come first'
        type: number
        default: '30000'
        secret: false                 # a count of tokens, as above
