###################################################################################################
# One dated place per test, build or benchmark: a sandbox to work in, and a log that stays.
#
#   <CMETA_HOME>/tmp/cmeta-tests-<YYYYMMDD>/<HHMM>.<type>/       the sandbox (deletable)
#   <CMETA_HOME>/log/cmeta-tests-<YYYYMMDD>/<HHMM>.<type>.md     the log (kept)
#   <CMETA_HOME>/log/cmeta-tests-<YYYYMMDD>/<HHMM>.<type>.json   the same as data
#   <CMETA_HOME>/log/cmeta-tests-<YYYYMMDD>/<HHMM>.<type>/       attached files (kept)
#
#   cx task run test-session --start --type=llama-drift --title="llama.cpp release vs source" \
#                            [--cmd="cx program run llama-cpp cuda"] [--repos=<other repo>]
#   cx task run test-session --id=20261002/0915.llama-drift --note="CUDA release done"
#   cx task run test-session --id=20261002/0915.llama-drift --results.cuda_tps=<value> --attach=bench.txt
#   cx task run test-session --finish --id=20261002/0915.llama-drift --status=passed --summary="<what was found>"
#   cx task run test-session [--list] [--date=20261002] [--type=llama-drift]
#   cx task run test-session --prune [--days=7]        # sandboxes of finished sessions; logs stay
#
# The record holds the host, cMeta and the repositories (branch, commit, changed files), and the
# agent: CMETA_GENERATOR (agent, model, effort), the Claude Code session, or --agent, --model,
# --effort and --session. Costs: the wall time and the sandbox size; the tokens the Claude Code
# session used while the test session was open (from its transcripts under ~/.claude/projects,
# when they are on this machine; with test_session.prices.<model>.input|output|cache_write|
# cache_read in USD per million tokens, the cost too); --tokens, --cost_usd and
# --costs.<key>=<value> for what is reported otherwise.
#
# Finish removes a sandbox above --max_keep_mib (1024) unless --keep. --print=sandbox|log|id|json
# prints only that, on the last line (for scripts). --root (or CMETA_TESTS_ROOT) instead of
# CMETA_HOME. Defaults: cx config set task --meta.test_session.max_keep_mib=4096 (also .root).
###################################################################################################
cache: False

params_map:
  arg2: id
