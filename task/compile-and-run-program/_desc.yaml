store_global: False
storage_key: compile-and-run-program
cache: False
preserve_global_keys:
  - compiler
  - lib-*

params_map:
  arg2: name
  arg3: compute
  arg4: cmd

uses_before_init:
  - task: select-program,beea611608bb459c
    name: '{{params.name|$None}}'
    program_tags: '{{params.program_tags|$None}}'
    program_api_ver: '{{params.program_api_ver|$None}}'
    ask: '{{params.ask|$False}}'
    compute: '{{params.compute|$[]}}'
    cmd: '{{params.cmd|$[]}}'

# The switches as words of the command line (--here=no, --use.<key>.here=yes): run() reads its
# parameters through **kwargs, so the task category is told here which ones are booleans (cMeta 0.37+)
cli_params:
  here: bool
  recompile: bool
  skip_compile: bool
  skip_run: bool
  skip_size_check: bool

# The key of the config artifact "task" this task reads besides the ones its README names.

configs:
  task:
    keys:
      compile_and_run_program.skip_cache:
        desc: 'true: a program is built and run in a folder of its own artifact (tmp, or what --target_tmp or
          compile_and_run_program.target_tmp names), the same for every request; false: each request - its explicit
          choices and its targets - gets a build entry of its own in the cache and comes back to it'
        type: yes/no
        default: 'false'
