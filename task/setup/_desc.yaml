store_global: True                     # force
storage_key: "tool--{{$params.name}}"  # force ($ - use alias from cname, $$ - use UID from cname)
cache: True                            # force

params_map:
  arg2: name

cache_params:
- name
- "@version" # Treat @keys as fuzzy versions or versions with conditions during cMeta search!
- tool_path  # To separate various pythons for example even with the same name/version

uses_before_init:
- task: runner,1e48cc0c5f6041a5

install_uses:
  windows:
    - task: setup,a2f9b61079ce4333
      name: winget,4a6b40ba0d4d49fb
      skip_install: True
      skip_build: True

env_path_keys:
- PATH
- PYTHONPATH
- EXTERNAL_INCLUDE
- INCLUDE
- LIB
- LIBPATH
- WindowsLibPath
