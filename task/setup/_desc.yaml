store_global: True               # force by default
storage_key: "{{$params.name}}"  # force ($ - use alias from cname, $$ - use UID from cname)
cache: True                      # force by default

params_map:
  arg2: name

# The switches as words of the command line (--skip_install=no, --use.<tool>.install=yes): run() reads its
# parameters through **kwargs, so the task category is told here which ones are booleans (cMeta 0.37+)
cli_params:
  detect: bool
  install: bool
  build: bool
  skip_detect: bool
  skip_install: bool
  skip_build: bool
  skip_install_uses: bool
  skip_build_uses: bool
  skip_cache_version_check: bool
  skip_size_check: bool
  skip_hardware_check: bool
  versions: bool
  status: bool
  upgrade: bool
  sizes: bool
  here: bool
  ignore_install_errors: bool
  ignore_build_errors: bool
  custom_install: bool
  custom_build: bool
  add_tool_path_to_env: bool
  force_add_tool_path_to_env: bool
  refresh_versions: bool
  check_update: bool
  version_policy:
    values: [known, latest, ask]

  # The options that take a value: given without one (--version), the run stops with this hint
  version:
    type: str
    hint: 'a version (13.4.92), a prefix (13.4), a range (">=12.4,<13"), latest or known; "cx tool setup <tool> --status"
      shows the installed and the newest versions, "cx tool run <tool> -- --version" asks the tool itself'
  name:
    type: str
    hint: 'the tool (--name=nvcc)'
  tool_path:
    type: str
    hint: 'the path of the tool''s program'
  tool_tags:
    type: str
    hint: 'the tags of the tool, separated by commas'

cache_params:
  - name
  - "@version" # Treat @keys as fuzzy versions or versions with conditions during cMeta search!
  - tool_path  # To separate various tools (python for example) even with the same name/version


# Normally this dependency is already added by higher-level tasks
# but if we decide to use setup direct from CMD, it will set up host
uses_before_init:
  - task: runner,1e48cc0c5f6041a5


# We prepare most common deps for installation for different platforms
# to avoid duplicating them in many tools
install_uses:
  windows:
    - task: setup,a2f9b61079ce4333
      name: winget,4a6b40ba0d4d49fb
      skip_install: True # Available on Windows by default!
      skip_build: True
  linux:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_build: True
  darwin:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_install: True # Available on MacOS by default!
      skip_build: True
    - task: setup,a2f9b61079ce4333
      name: brew,27859c999bdd4085
      skip_build: True


# The variables of a tool's environment script (cmd_call_script: vcvars, oneapi-vars) that are lists of paths: what
# the script added goes in front of what the run already has (a "+KEY" of the aggregated environment) instead of
# replacing it. A variable that is not named here is taken as the script left it - which, for a list, would drop
# what another tool of the same run added to it (seen on Linux: oneapi-vars.sh sets LD_LIBRARY_PATH and
# OCL_ICD_FILENAMES, and the Intel GPU runtime's libraries and ICD were gone from the run).
add_env_path_keys:
  - PATH
  - PYTHONPATH
  - EXTERNAL_INCLUDE
  - INCLUDE
  - LIB
  - LIBPATH
  - WindowsLibPath
  - LD_LIBRARY_PATH
  - DYLD_LIBRARY_PATH
  - LIBRARY_PATH
  - CPATH
  - C_INCLUDE_PATH
  - CPLUS_INCLUDE_PATH
  - PKG_CONFIG_PATH
  - CMAKE_PREFIX_PATH
  - MANPATH
  - OCL_ICD_FILENAMES

# What the words of the command line mean, for people: the cMeta CLI builder (cserver.cmeta.cli) and help read it, the
# engine never does - cli_params above alone says how a word is read (a type, its values: checked at every run). An
# entry is a line of text, or desc (what it does), group (main: shown at once), example, conflicts (the words it
# cannot be used with), needs, hide (the page fills it itself), artifact (its value is an artifact of that category),
# choice (the word changes what comes out - here, which version is set up - and is shown first; the others say how).
# These are the words of cx tool setup | install | upgrade | run <tool>.
cli_help:
  name: {hide: true}
  tool_tags: {hide: true}
  tool_path: "The path of the tool's own program, when you know where it is"

  version:
    desc: 'The version wanted: a version (13.4.92), a prefix (13.4), a range (">=12.4,<13"), latest or known'
    choice: true
    example: latest
  install:
    desc: Install it with cMeta, without looking for a copy on this machine first
    group: main
    conflicts: [detect, status, versions, skip_install]
  detect:
    desc: 'Only look for it: nothing is installed'
    group: main
    conflicts: [install, upgrade, build]
  upgrade:
    desc: Upgrade it through the way it was installed; install the newest version when it is absent
    group: main
    conflicts: [detect, status, versions]
  status:
    desc: Show the installed version against the newest one; nothing is changed
    group: main
    conflicts: [install, upgrade, versions, build]
  versions:
    desc: List the versions that can be installed; nothing is changed
    group: main
    conflicts: [install, upgrade, status, build]

  build: Build it from its sources with cMeta, without looking for a copy or installing a release first
  check_update:
    desc: Compare the version cMeta installs by default with the newest one; nothing is installed
    conflicts: [install, upgrade, build]
  sizes: The disk space the copies of this tool take
  refresh_versions: Ask for the list of versions again instead of using the one remembered
  version_policy: 'Which version to take when none is asked: the one cMeta knows, the latest, or a question'
  here: Look for it under the current folder instead of the usual places
  skip_detect:
    desc: 'Do not look for a copy on this machine: install it, or build it'
    conflicts: [detect]
  skip_install:
    desc: 'Do not install a release: use a copy found here, or build it'
    conflicts: [install]
  skip_build:
    desc: 'Do not build it from its sources: use a copy found here, or install a release'
    conflicts: [build]
  skip_install_uses: Do not set up first what the install needs (winget, curl, a package manager)
  skip_build_uses: Do not set up first the tools the build needs
  ignore_install_errors: Go on when the install fails instead of stopping
  ignore_build_errors: Go on when the build fails instead of stopping
  custom_install: Use the tool's own install code (its api_v1.py) instead of its install command; an error when it has none
  custom_build: Use the tool's own build code (its api_v1.py) instead of its build command; an error when it has none
  add_tool_path_to_env: Put the tool's folder on PATH for the commands that run after it
  force_add_tool_path_to_env: Put the tool's folder first on PATH even when it is there already
  skip_cache_version_check: Remember this copy as one whose version is not checked again when it is reused, even with --check_versions
  skip_size_check: Do not check the free disk space before an install or a build
  skip_hardware_check: Do not check the hardware the tool declares (its hardware rules) before an install or a build
