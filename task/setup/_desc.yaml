store_global: True               # force by default
storage_key: "{{$params.name}}"  # force ($ - use alias from cname, $$ - use UID from cname)
cache: True                      # force by default

params_map:
  arg2: name

# The switches as words of the command line (--skip_install=no, --use.<tool>.install=yes): run() reads its
# parameters through **kwargs, so the task category is told here which ones are booleans (cMeta 0.37+)
cli_params:
  detect: bool
  install: bool
  build: bool
  skip_detect: bool
  skip_install: bool
  skip_build: bool
  skip_install_uses: bool
  skip_build_uses: bool
  skip_cache_version_check: bool
  skip_size_check: bool
  versions: bool
  status: bool
  upgrade: bool
  sizes: bool
  here: bool
  ignore_install_errors: bool
  ignore_build_errors: bool
  custom_install: bool
  custom_build: bool
  add_tool_path_to_env: bool
  force_add_tool_path_to_env: bool
  refresh_versions: bool
  check_update: bool
  version_policy:
    values: [known, latest, ask]

  # The options that take a value: given without one (--version), the run stops with this hint
  version:
    type: str
    hint: 'a version (13.4.92), a prefix (13.4), a range (">=12.4,<13"), latest or known; "cx tool setup <tool> --status"
      shows the installed and the newest versions, "cx tool run <tool> -- --version" asks the tool itself'
  name:
    type: str
    hint: 'the tool (--name=nvcc)'
  tool_path:
    type: str
    hint: 'the path of the tool''s program'
  tool_tags:
    type: str
    hint: 'the tags of the tool, separated by commas'

cache_params:
  - name
  - "@version" # Treat @keys as fuzzy versions or versions with conditions during cMeta search!
  - tool_path  # To separate various tools (python for example) even with the same name/version


# Normally this dependency is already added by higher-level tasks
# but if we decide to use setup direct from CMD, it will set up host
uses_before_init:
  - task: runner,1e48cc0c5f6041a5


# We prepare most common deps for installation for different platforms
# to avoid duplicating them in many tools
install_uses:
  windows:
    - task: setup,a2f9b61079ce4333
      name: winget,4a6b40ba0d4d49fb
      skip_install: True # Available on Windows by default!
      skip_build: True
  linux:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_build: True
  darwin:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_install: True # Available on MacOS by default!
      skip_build: True
    - task: setup,a2f9b61079ce4333
      name: brew,27859c999bdd4085
      skip_build: True


# Add env path keys to aggregated if detected
add_env_path_keys:
  - PATH
  - PYTHONPATH
  - EXTERNAL_INCLUDE
  - INCLUDE
  - LIB
  - LIBPATH
  - WindowsLibPath

