store_global: True               # force by default
storage_key: "{{$params.name}}"  # force ($ - use alias from cname, $$ - use UID from cname)
cache: True                      # force by default

params_map:
  arg2: name

cache_params:
  - name
  - "@version" # Treat @keys as fuzzy versions or versions with conditions during cMeta search!
  - tool_path  # To separate various tools (python for example) even with the same name/version


# Normally this dependency is already added by higher-level tasks
# but if we decide to use setup direct from CMD, it will set up host
uses_before_init:
  - task: runner,1e48cc0c5f6041a5


# We prepare most common deps for installation for different platforms
# to avoid duplicating them in many tools
install_uses:
  windows:
    - task: setup,a2f9b61079ce4333
      name: winget,4a6b40ba0d4d49fb
      skip_install: True # Available on Windows by default!
      skip_build: True
  linux:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_build: True
  darwin:
    - task: setup,a2f9b61079ce4333
      name: curl,bfbb8526694d4f21
      skip_install: True # Available on MacOS by default!
      skip_build: True
    - task: setup,a2f9b61079ce4333
      name: brew,27859c999bdd4085
      skip_build: True


# Add env path keys to aggregated if detected
add_env_path_keys:
  - PATH
  - PYTHONPATH
  - EXTERNAL_INCLUDE
  - INCLUDE
  - LIB
  - LIBPATH
  - WindowsLibPath

