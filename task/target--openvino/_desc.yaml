###################################################################################################
# A stack target: it detects nothing itself; the device targets next to it say where OpenVINO
# runs (npu-intel -> "NPU", xpu -> "GPU", cpu -> "CPU"). Alone, programs use every device
# OpenVINO finds. The OpenVINO runtime is a pip package, which programs set up in their venv.
###################################################################################################
store_global: True
storage_key: target--openvino
cache: False

env_if_not_used:
  CMETA_TARGET_OPENVINO: 0
env:
  CMETA_TARGET_OPENVINO: 1

sdk:
  uses:
    - task: setup,a2f9b61079ce4333
      name: pip
      with:
        package: openvino

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: stack
  hardware: 'the OpenVINO stack on Intel CPUs, GPUs and NPUs'
  host_os: [linux, windows, darwin]
  status: supported

# How --compute=auto treats this target when it is present (detect-targets): a portable interface over the devices of
# other targets - taken only when the program supports no target of this machine's own accelerators (cuda, rocm, xpu,
# metal, an NPU)
auto: portable

# The probe of detect-targets (--compute=auto): hardware of the OpenVINO stack as `support` names it - an Intel CPU, an
# Intel GPU or an Intel NPU
probe:
  linux:
    any:
      - {cpu_vendor: [GenuineIntel]}
      - {drm_vendor: '0x8086', drivers: [i915, xe]}
      - {accel_driver: [intel_vpu]}
  windows:
    any:
      - {cpu_vendor: [GenuineIntel]}
      - {pnp: {class: [Display], vendor: ['8086']}}
      - {pnp: {class: [ComputeAccelerator], vendor: ['8086']}}
  darwin:
    any:
      - {cpu_vendor: [GenuineIntel]}
