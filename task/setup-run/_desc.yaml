storage_key: 'setup-run'
cache: False

params_map:
  arg2: compute

uses_before_init:
  - task: runner,1e48cc0c5f6041a5

  - task: target,94decb2ddd28441f
    ask: '{{params.ask|$False}}'
    compute: '{{params.compute|$None}}'

# The switches as words of the command line (--run_on_host=no, --use.<key>.run_on_host=yes): run() reads its
# parameters through **kwargs, so the task category is told here which ones are booleans (cMeta 0.37+)
cli_params:
  run_on_host: bool
  profile: bool
  profile_python: bool
  profile_cuda: bool
  profile_cuda_kernels: bool
