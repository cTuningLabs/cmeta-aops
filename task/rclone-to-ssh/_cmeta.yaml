desc: "Sync, copy or bisync a local directory to a plain SSH host with rclone through an on-the-fly sftp remote: no rclone.conf entry, no stored credentials."
last_update_timestamp: '2026-09-08T13:20:26.904344+00:00'
note: Push a local directory to a plain SSH host with rclone, with no rclone.conf
  entry - the remote is built on the fly as ":sftp:" driven by the system ssh binary,
  so hosts, keys, ports and jump hosts all come from ~/.ssh/config.
