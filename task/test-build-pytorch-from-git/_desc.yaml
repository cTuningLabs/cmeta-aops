uses:
  - task: runner,1e48cc0c5f6041a5

  - task: target,94decb2ddd28441f
    ask: True

  - task: install-sys-tool,38596f32da974d46
    if_os: linux
    if: '"{{params.install_sys_tools|False}}" == "True"'
    package: build-essential
    sudo: True

  - task: setup,a2f9b61079ce4333
    name: python-pip,28399f0bb52c4148


  - task: compiler,f3925b201c704bde
    storage_key: host_cpp_compiler_for_pytorch_build
    lang: cpp
    text: "INFO: Selecting host C++ compiler to build PyTorch"
    cache: True
    
  - task: compiler,f3925b201c704bde
    storage_key: host_c_compiler_for_pytorch_build
    lang: c
    text: "INFO: Selecting host C compiler to build PyTorch"
    cache: True

  - task: setup,a2f9b61079ce4333
    name: cmake,e26c11ebb3dd40ca

  - task: setup,a2f9b61079ce4333
    name: ninja,a3df3c45e9b04830

  - task: cmd,c9ba0a88df394d7f
    storage_key: cmd_before_cloning
    cmd: echo "Preparing cloning ..."



  - task: clone-git,af9422df6ea241ec
    store_global: True
    storage_key: clone-git-pytorch
    cache: True
    url: https://github.com/pytorch/pytorch
    cache_extra_params:
      name: pytorch
      src: True
    cache_extra_tags: 'src,git,github,pytorch'

  - task: get-directory-size,8011c5c45c9748bc
    text: 'Git repo size BEFORE submodule update:'
    if: '"{{params.check_dir_size|}}" == "True"'
    directory: '{{global.clone-git-pytorch.path_to_git_repo}}'
    store_global: True
    storage_key: clone-git-pytorch-size-before-update

  - task: update-git-submodules,344510a999b748d7
    rem: >
      This can be done in clone-git with update_submodules=True 
      but we want to check repo size before and after modules update
    directory: '{{global.clone-git-pytorch.path_to_git_repo}}'

  - task: get-directory-size,8011c5c45c9748bc
    if: '"{{params.check_dir_size|}}" == "True"'
    text: 'Git repo size AFTER submodule update:'
    directory: '{{global.clone-git-pytorch.path_to_git_repo}}'
    store_global: True
    storage_key: clone-git-pytorch-size-after-update

  - task: cmd,c9ba0a88df394d7f
    rem: Installing dev group deps from pyproject
    chdir: '{{global.clone-git-pytorch.path_to_git_repo}}'
    cmd: '{{global.pip.cmd}} install --group dev'


  # cuDNN if CUDA
  - task: setup,a2f9b61079ce4333
    name: cudnn,440a30eb25b64853
    if: '"{{aggregated.env.CMETA_TARGET_CUDA}}" == "1"'


  # ICX and OneAPI if Intel XPU
  - task: setup,a2f9b61079ce4333
    name: icx,15789d59a5534055
    if: '"{{aggregated.env.CMETA_TARGET_XPU}}" == "1"'

  # MKL if CPU and not Intel XPU
  - task: setup,a2f9b61079ce4333
    name: pip,c4987bc3955347f2
    with:
      package: mkl
    if: '"{{aggregated.env.CMETA_TARGET_CPU}}" == "1" and "{{aggregated.env.CMETA_TARGET_XPU}}" != "1" and "{{aggregated.env.CMETA_TARGET_MPS}}" != "1"'

  # MKL if CPU and not Intel XPU
  - task: setup,a2f9b61079ce4333
    name: pip,c4987bc3955347f2
    with:
      package: mkl-static
    if: '"{{aggregated.env.CMETA_TARGET_CPU}}" == "1" and "{{aggregated.env.CMETA_TARGET_XPU}}" != "1" and "{{aggregated.env.CMETA_TARGET_MPS}}" != "1"'

#  # MKL if CPU and not Intel XPU
#  - task: setup,a2f9b61079ce4333
#    name: pip,c4987bc3955347f2
#    with:
#      package: mkl-devel
#    if: '"{{aggregated.env.CMETA_TARGET_CPU}}" == "1" and "{{aggregated.env.CMETA_TARGET_XPU}}" != "1"'

  # MKL if CPU and not Intel XPU
  - task: setup,a2f9b61079ce4333
    name: pip,c4987bc3955347f2
    with:
      package: mkl-include
    if: '"{{aggregated.env.CMETA_TARGET_CPU}}" == "1" and "{{aggregated.env.CMETA_TARGET_XPU}}" != "1" and "{{aggregated.env.CMETA_TARGET_MPS}}" != "1"'



  # Ninja
  - task: setup,a2f9b61079ce4333
    name: pip,c4987bc3955347f2
    with:
      package: ninja
    set_env:
      CMAKE_GENERATOR: Ninja

  # Triton for Linux
  - task: cmd,c9ba0a88df394d7f
    if_os: linux
    storage_key: cmd_before_building_triton
    chdir: '{{global.clone-git-pytorch.path_to_git_repo}}'
    cmd: 'PATH="{{global.python.qpath_bin}}:$PATH" make PYTHON={{global.python.qpath}} triton'


  # OpenSSL Lib
  - task: setup,a2f9b61079ce4333
    name: lib-openssl,903191f1fab74064


  - task: cmd,c9ba0a88df394d7f
    storage_key: cmd_before_cleaning
    cmd: echo "Preparing building ..."


  # Clean build
  - task: print-text,23e0ac84f583466f
    if: '"{{params.clean_build|False}}" == "True"'
    text: "WARNING: Your previous PyTorch build will be cleaned!"
    extra_line: True
    set_env:
      CMAKE_FRESH: 1

  - task: cmd,c9ba0a88df394d7f
    if: '"{{params.clean_build|False}}" == "True"'
    storage_key: cmd_before_build
    mkdir: '{{global.clone-git-pytorch.path_to_git_repo}}{{os_sep}}build' # create to avoid failing on windows when cleaning it 
    chdir: '{{global.clone-git-pytorch.path_to_git_repo}}'
    cmd: '{{global.host.vars.clean_dir_quiet}} build'

