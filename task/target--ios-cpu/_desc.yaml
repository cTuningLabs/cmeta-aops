authors: Grigori Fursin
store_global: True
storage_key: target--ios-cpu
cache: True

# Xcode (devicectl, the iOS SDK) before init selects the device
uses_before_init:
  - task: setup,a2f9b61079ce4333
    name: apple.xcode,1f2abbf32a664e7a

params_map:
  arg2: device

# One cache entry per device (its UDID) and bundle id: the development profile and the entitlements inside are
# made for them (a cached entry whose profile expired or disappeared is not reused: api_v1.py)
cache_extra_params:
  udid: '{{local.ios_udid}}'
  bundle_id: '{{local.ios_bundle_id}}'

env_if_not_used:
  CMETA_TARGET_IOS_CPU: 0
env:
  CMETA_TARGET_IOS_CPU: 1

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: cpu
  hardware: 'the CPU of an iPhone or iPad (Xcode, devicectl)'
  host_os: [darwin]
  device_os: ios
  status: supported
