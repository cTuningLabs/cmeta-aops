authors: Grigori Fursin
store_global: True
storage_key: target--android-app
cache: False
env:
  CMETA_TARGET_ANDROID_APP: 1
env_if_not_used:
  CMETA_TARGET_ANDROID_APP: 0

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: app
  hardware: 'an Android application (APK) installed and launched through adb'
  host_os: [linux, windows, darwin]
  device_os: android
  status: supported

# The probe of detect-targets: an Android device that the adb server of this machine lists as ready, asked on the
# server's own socket. Nothing is started: a device shows once "adb devices" or "cx host connect" started the server.
# It is another device (`support.device_os`), so --compute=auto never takes it by itself - it is listed, with its
# command line
probe:
  all:
    any:
      - {adb_devices: true}
