authors: Grigori Fursin

# Run the OpenClaw agent (https://openclaw.ai) on an assembled prompt and exit, or open its
# terminal UI. The same flags as the sister tasks "run-claude", "run-codex" and "run-opencode":
#
#   cx task run run-openclaw --prompt="{prompt text}"
#   cx task run run-openclaw --prompt_file={file}
#   cx task run run-openclaw --prompt_file={file} --prompt="{extra text}" --output_file={file}
#   cx task run run-openclaw --prompt_file={file} --stats
#   cx task run run-openclaw --prompt="..." --dry_run         # print the openclaw command, run nothing
#
# First use on a machine: cMeta installs OpenClaw (npm) when it is missing, so drive it through the tool,
# never by a bare "openclaw" (which may be another copy, or none):
#
#   cx tool run openclaw -- models status                                 # which providers are authenticated
#   cx tool run openclaw -- models set claude-cli/claude-opus-5-5         # the default model: the local Claude Code login, no other key
#   cxt run-ai --harness=openclaw "..."        /   cxt run-ai --harness=openclaw -i
#
# OpenClaw's own default is openai/gpt-5.5, which needs an OpenAI login ("cx tool run openclaw -- configure");
# the claude-cli provider runs the "claude" binary cMeta put on OpenClaw's PATH (see "Sub-agents" below).
#
# Headless it runs one agent turn with "openclaw agent --local --message <prompt>": the embedded
# agent runtime of this machine, with the model-provider keys of your shell or of OpenClaw's own
# auth store ("cx tool run openclaw -- configure" / "-- onboard" once per machine). --gateway sends the turn
# through a running OpenClaw Gateway instead ("openclaw agent" without --local). A headless turn needs a
# session: the task passes "--agent main" (the agent OpenClaw creates by default) unless --agent=<id> or
# --session=<id> is given, or a session flag (--agent, --session-id, --session-key, --to) follows "--".
#
# With no prompt at all, or with --interactive (short: --i or -i), it opens OpenClaw's terminal UI
# ("openclaw tui --local", i.e. "openclaw chat"), with the assembled prompt as the first message:
#
#   cx task run run-openclaw                                  # just open the terminal UI
#   cx task run run-openclaw --prompt_file=review.txt --i     # preload a prompt, then continue by hand
#
# Since the terminal UI owns the terminal, nothing can be captured: --stats, --stats_file and
# --output_file are switched off, and a non-zero exit code is reported but does not fail the task.
#
# "openclaw agent" has no stdin mode, so the prompt always travels as a command-line argument: the OS
# caps a command line (32767 chars on Windows, 128 KB per argument on Linux), so a prompt longer than
# 30000 characters is written to a file - --long_prompt_file={file}, else {prompt_file without
# extension}-prompt.md, else a temporary file removed afterwards - and openclaw is given a one-line
# request to read it first; it follows it, and the terminal UI stays open as before.
#
# --stats asks OpenClaw for JSON output ("--json") and prints the reply text plus the token usage and
# cost it reports. --stats_file={file} records the same statistics ("*.json" = JSON, otherwise text).
# With the claude-cli provider (--model claude-cli/<model>: the local Claude Code login) OpenClaw
# reports only the last model call of a turn, so the counts are taken from Claude Code's own session
# file of the turn instead (every model call, each once).
#
# OpenClaw works in its own workspace (~/.openclaw/workspace, from its config) whatever the current
# directory is: give it absolute paths (run-ai tells it where the project is).
#
# The prompt sent is the text of --prompt_file (when given), then "\n", then the text of --prompt.
# The full output is streamed to the console and recorded into "{prompt_file without extension}-output.txt"
# unless --output_file overrides it. Anything after "--" is appended to the openclaw command line, e.g.
#
#   cx task run run-openclaw --prompt_file=p.txt -- --model anthropic/claude-sonnet-5 --thinking medium
#   cx task run run-openclaw --prompt="Summarise the inbox" -- --agent ops --timeout 300
#
# Provenance: when nothing else set CMETA_GENERATOR, it is set for the run to
# {"method": "agent", "agent": "OpenClaw <version>", "model": ..., "effort": <--thinking>}, so artifacts
# created through cMeta during the run record what made them.
#
# Sub-agents: OpenClaw may call other agent CLIs (claude, codex, opencode, gemini, agy). They are the
# copies cMeta knows: set up as cMeta tools before openclaw starts (detected, never installed from here),
# and their folders - with openclaw's own - go first on the PATH of the openclaw process, so a sub-agent is
# the pinned, recorded one, not whatever the shell's PATH holds. --agents=claude,codex narrows the list,
# --agents= (empty) leaves the PATH as it is; an agent that is not on this machine is reported and skipped.
# --dry_run prints what was found.

# This task launches an agent that may change files - never memoize it on disk
cache: False

uses:
  # Bootstrap host (OS detection, env, vars) - normally already resolved from global
  - task: runner,1e48cc0c5f6041a5

  # Detect / install the "openclaw" tool (npm) and expose {{global.openclaw.path}}
  - task: setup,a2f9b61079ce4333
    name: openclaw,1776c76162b14545
