store_global: True
storage_key: "clone-git-to-cache-{{$params.name}}"  # force ($ - use alias from cname, $$ - use UID from cname)
cache: True

params_map:
  arg2: name
  arg3: url
  arg4: directory

cache_params:
  - name
  - url
  - branch
  - new_branch
  - fetch
  - checkout
  - update_submodules

cache_extra_params:
  version: '{{params.version|$None}}'
  src: True

cache_extra_alias: '{{params.name}}--{{params.checkout}}'

cache_extra_tags: 
  - '{{params.name}}'
  - github

sort_keys:
  - 'cmeta.params.name'
  - '@cmeta.params.version-'
  - 'cmeta.params.tag-'

uses:
  - task: host,96ac7118439c4490

  - task: setup,a2f9b61079ce4333
    name: git,959d8c0fbc004bd0
