store_global: True
storage_key: target
cache: False

params_map:
  arg2: compute

# The switches as words of the command line (--ask=no, --use.<key>.ask=yes): run() reads its
# parameters through **kwargs, so the task category is told here which ones are booleans (cMeta 0.37+)
cli_params:
  ask: bool
  add_env: bool
