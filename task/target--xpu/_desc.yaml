store_global: True
storage_key: target--xpu
cache: True

uses:
  - task: generate-temp-file,2e96e68cd41046d1
    storage_key: generate-temp-file-target-xpu

  - task: install-sys-tool,38596f32da974d46
    os: linux
    sudo: True
    package: pciutils
    check_binary: lspci

  # GPUs are "VGA compatible", "3D" or "Display" controllers (data-center GPUs are not VGA)
  - task: cmd,c9ba0a88df394d7f
    if_os: linux
    cmd: 'lspci | grep -i -E "vga|3d controller|display controller" > {{local.generate-temp-file-target-xpu.temp_file}} || true'

  # wmic is gone from current Windows 11 builds: the same query through PowerShell (CIM), as UTF-8
  - task: cmd,c9ba0a88df394d7f
    if_os: windows
    cmd: 'powershell -NoProfile -Command "[Console]::OutputEncoding = [Text.Encoding]::UTF8; Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion" > {{local.generate-temp-file-target-xpu.temp_file}}'
    local:
      encoding: 'utf-8-sig'

env_if_not_used:
  CMETA_TARGET_XPU: 0
env:
  CMETA_TARGET_XPU: 1
    
