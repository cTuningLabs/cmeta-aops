store_global: True
storage_key: target--cuda
cache: True

uses:
  - task: setup,a2f9b61079ce4333
    name: cuda,805716c4f32d42cf

env_if_not_used:
  CMETA_TARGET_CUDA: 0
env:
  CMETA_TARGET_CUDA: 1

sdk:
  uses:
    - task: setup,a2f9b61079ce4333
      name: nvcc,7f0e9193fef74919

# Where this target works - declared facts read by "cx program targets" and the page cserver.cmeta.targets:
# kind (cpu, gpu, npu, stack, app), the hardware, host_os = the OS of the machine cMeta runs on (linux,
# windows, darwin), device_os = the OS of another device the program runs on (driven from the host), status
# (supported, placeholder).
support:
  kind: gpu
  hardware: 'NVIDIA GPUs (CUDA)'
  host_os: [linux, windows]
  status: supported

# The probe of detect-targets (--compute=auto): NVIDIA's kernel driver (its version in the fingerprint), or under WSL2 the
# Windows driver's CUDA library; on Windows a display device of vendor 10DE
probe:
  linux:
    any:
      - {glob: /proc/driver/nvidia/version, version: 'Kernel Module(?:\s+for\s+\S+)?\s+([0-9][0-9.]+)'}
      - {glob: /usr/lib/wsl/lib/libcuda.so*}
  windows:
    any:
      - {pnp: {class: [Display], vendor: ['10DE']}}

# In an instance (--on=docker, --on=podman, --on=wsl) this target needs its device given to the instance: the kinds of
# instance that are made with the template's compute overlay of this target's name (its image, its GPU run flags) -
# a template without that overlay stops the run and says so. In another kind of instance, and for a target that
# declares nothing here, the instance is a CPU one
instance_overlay: [docker, podman, wsl]
