store_global: True               # force
storage_key: target-metal-swift  # force storage key to avoid mixing up in the future
cache: False                     # force

uses:
  - task: runner,1e48cc0c5f6041a5

  - task: force-fail,fbc834fe54894aec
    if: '"{{global.host.os.uname}}" != "darwin"'
    text: '"{{task_artifact_alias}}" can run only on MacOS'

  - task: setup,a2f9b61079ce4333
    name: swiftlang,043d6514109e495d

  - task: cmd,c9ba0a88df394d7f
    mkdir: '{{task_artifact_path}}{{os_sep}}tmp'
    cmd: >
      {{global.swiftlang.qpath_bin}}{{os_sep}}swiftc
      {{task_artifact_path}}{{os_sep}}src{{os_sep}}detect-metal.swift
      -framework Metal
      -o
      {{task_artifact_path}}{{os_sep}}tmp{{os_sep}}detect-metal{{global.host.vars.file_ext_exe}}

  - task: cmd,c9ba0a88df394d7f
    clean_files:
      - '{{task_artifact_path}}{{os_sep}}tmp{{os_sep}}tmp-detect-metal.json'
    cmd: >
      {{task_artifact_path}}{{os_sep}}tmp{{os_sep}}detect-metal{{global.host.vars.file_ext_exe}}
      {{task_artifact_path}}{{os_sep}}tmp{{os_sep}}tmp-detect-metal.json

env_if_not_used:
  CMETA_TARGET_MPS: 0
env:
  CMETA_TARGET_MPS: 1

cmake_vars_if_not_used:
  USE_MPS: 'OFF'
cmake_vars:
  USE_MPS: 'ON'
