name: Test cMeta core AOps via cTuning

on:
  workflow_dispatch:
#  push:
#    paths:
#      - '**'
#      - '!**.md'
#  pull_request:
#    branches:
#      - main
#      - dev

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux & macOS
      - name: Dummy (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "======================="
          echo "Running on Linux/macOS"
          echo "======================="

      # Windows
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: |
          echo =======================
          echo Running on Windows
          echo =======================
        shell: cmd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print python version
        run: |
          python --version

      - name: Install package
        run: |
          python -m pip install --upgrade pip

      - name: Install cMeta framework
        env:
          GH_USER: gfursin
          GH_TOKEN: ${{ secrets.PRIVATE_GH_TOKEN_CMETA }}
        run: |
          git clone https://${GH_USER}:${GH_TOKEN}@github.com/cTuningLabs/cmeta.git
          cd cmeta
          pip install .[all]

      - name: Test cMeta
        run: |
          cx --reindex
          cx --version

      - name: Add cTuning server API key
        env:
          CTUNING_SERVER_API_KEY: ${{ secrets.PRIVATE_CTUNING_SERVER_API_KEY }}
        run: |
          cx config set ctuning_server --meta.api_key=${{ secrets.CTUNING_SERVER_API_KEY }}

      - name: Get latest repo from cTuning.ai
        run: |
          cx repo get cmeta://ctuninglabs@cmeta-aops

      - name: List tasks
        run: |
          cx task list

      - name: Clone some repo
        run: |
          cxt git-clone https://github.com/ctuning/mlcommons-ck --cache
