name: Test cMeta AOps task python with numpy

on:
  workflow_dispatch:
#  push:
#    paths:
#      - '**'
#      - '!**.md'
#  pull_request:
#    branches:
#      - main
#      - dev

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux & macOS
      - name: Dummy (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "======================="
          echo "Running on Linux/macOS"
          echo "======================="

      # Windows
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: |
          echo =======================
          echo Running on Windows
          echo =======================
        shell: cmd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print python version
        run: |
          python --version

      - name: Install package
        run: |
          python -m pip install --upgrade pip

      - name: Install cMeta framework
        env:
          GH_USER: gfursin
          GH_TOKEN: ${{ secrets.PRIVATE_GH_TOKEN_CMETA }}
        run: |
          git clone https://${GH_USER}:${GH_TOKEN}@github.com/cTuningLabs/cmeta.git
          cd cmeta
          pip install .[all]

      - name: Test cMeta
        run: |
          cx --reindex
          cx --version

      - name: Plug this repo
        run: |
          cx repo plug .

      - name: List tasks
        run: |
          cx task list

      - name: Set quite flags for winget on Windows
        if: runner.os == 'Windows'
        run: |
          cx config set task --meta.winget_install_flags="--silent --accept-source-agreements --accept-package-agreements"

      - name: Test python with numpy
        run: |
          cxt test-python-numpy --use.pip-numpy.version=">=2" -v -q --extra_line

      - name: Dummy
        run: |
          echo "DONE"
